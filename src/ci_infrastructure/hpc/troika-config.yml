# Troika sites for ci_infrastructure.hpc.site.load_site; a leg's `site` names one.
# Builds need a slurm site (a scheduler to submit to and poll). Direct sites only
# give a shell: `hpc-login`/`lumi-login` on the far end, `local-direct` locally.
sites:
  hpc-batch: &slurm
    type: slurm
    connection: ssh
    host: hpc-batch
    copy_script: true
    at_startup: ["check_connection"]
    pre_submit: ["create_output_dir"]
    at_exit: ["copy_submit_logfile"]

  # Kept in step with ecmwf/build-package-hpc's config.yml: a missing site fails
  # with `troika.InvocationError: Unknown site '<name>'`.
  aa-batch: {<<: *slurm, host: aa-batch}
  ab-batch: {<<: *slurm, host: ab-batch}
  ac-batch: {<<: *slurm, host: ac-batch}
  ad-batch: {<<: *slurm, host: ad-batch}
  ag-batch: {<<: *slurm, host: ag-batch}
  lumi: {<<: *slurm, host: lumi}

  hpc-login: &direct {<<: *slurm, type: direct, host: hpc-login}
  lumi-login: {<<: *direct, host: lumi}

  local-direct:
    type: direct
    connection: local
