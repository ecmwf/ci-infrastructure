# Troika site configuration for ci-infrastructure's HPC backend.
#
# Consumed as a Python library (ci_infrastructure.hpc.site.load_site), not via
# the troika CLI. A manifest leg's `site` field names one of these sites.
#
# The build path drives the batch (slurm) sites: it needs a job id to persist for
# reattach and a scheduler state to poll, neither of which troika's `direct`
# sites provide. The two direct sites are for things that only need a shell on
# the far end: `hpc-login` reaches the real login node, and `local-direct` is the
# local machine — no cluster, no ssh — for trying a transfer out by hand. The
# unit tests do NOT need either: they monkeypatch load_site, so the site name
# they pass is only a string.
sites:
  hpc-batch:
    type: slurm
    connection: ssh
    host: hpc-batch
    copy_script: true
    at_startup: ["check_connection"]
    pre_submit: ["create_output_dir"]
    at_exit: ["copy_submit_logfile"]

  # The AC and AG clusters, same shape as hpc-batch — only the ssh alias differs.
  # ac-batch is in active use: ectrans' ci-hpc job targets it, and fetch-hpc-tree
  # failed there with `troika.InvocationError: Unknown site 'ac-batch'` purely
  # because this file did not list it. ag-batch is added alongside it because the
  # same gap would produce the same confusing error for the next consumer; it is
  # a real ECMWF site name (see ecflow's .github/cd-config.yml) but, unlike
  # ac-batch, we have not yet seen a job use it through this path.
  ac-batch:
    type: slurm
    connection: ssh
    host: ac-batch
    copy_script: true
    at_startup: ["check_connection"]
    pre_submit: ["create_output_dir"]
    at_exit: ["copy_submit_logfile"]

  ag-batch:
    type: slurm
    connection: ssh
    host: ag-batch
    copy_script: true
    at_startup: ["check_connection"]
    pre_submit: ["create_output_dir"]
    at_exit: ["copy_submit_logfile"]

  lumi:
    type: slurm
    connection: ssh
    host: lumi
    copy_script: true
    at_startup: ["check_connection"]
    pre_submit: ["create_output_dir"]
    at_exit: ["copy_submit_logfile"]

  hpc-login:
    type: direct
    connection: ssh
    host: hpc-login
    copy_script: true
    at_startup: ["check_connection"]
    pre_submit: ["create_output_dir"]
    at_exit: ["copy_submit_logfile"]

  local-direct:
    type: direct
    connection: local
