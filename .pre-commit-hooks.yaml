- id: check-ci-approval
  name: require the ci-approval gate on workflows that can run fork code
  description: >
    Fails a workflow triggered by pull_request_target, or by pull_request onto a
    non-GitHub-hosted runner, unless every job hangs off require-ci-approval via
    `needs:`. Exemptions go in .github/ci-approval-allowlist.yml.
  entry: ci-infrastructure-check-ci-approval
  language: python
  files: ^\.github/workflows/.*\.ya?ml$

- id: check-ci-result
  name: require the ci-result job in ci.yml
  description: >
    Fails a ci.yml without the job ci-result, the one required check, running
    `if: always()` with statuses: write, `name: collect results`, and actions/ci-result fed toJSON(needs).
  entry: ci-infrastructure-check-ci-result
  language: python
  files: ^\.github/workflows/ci\.ya?ml$

- id: check-cd-workflow
  name: hold the CD v3 release workflow to its safe shape
  description: >
    Experimental (CD v3). Fails a release workflow whose shape could leak a publish
    credential or publish what was not tested; see docs/configuring/releases.rst.
    Pass `args: [--allow-ref, feature/cd-v3]` while the release actions live on that branch.
  entry: ci-infrastructure-check-cd-workflow
  language: python
  files: ^\.github/workflows/(cd|cd-v3|release)\.ya?ml$
