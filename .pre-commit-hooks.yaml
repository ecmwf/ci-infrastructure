- id: check-ci-approval
  name: require the ci-approval gate on workflows that can run fork code
  description: >
    Fails a workflow triggered by pull_request_target, or by pull_request onto a
    non-GitHub-hosted runner, unless every job hangs off require-ci-approval via
    `needs:`. Exemptions go in .github/ci-approval-allowlist.yml.
  entry: ci-infrastructure-check-ci-approval
  language: python
  files: ^\.github/workflows/.*\.ya?ml$

- id: check-ci-result
  name: require a ci-result job that collects every job of ci.yml
  description: >
    Fails a ci.yml without the job ci-result, the one required check, running
    `if: always()` with actions/ci-result and every other job in `needs:`.
  entry: ci-infrastructure-check-ci-result
  language: python
  files: ^\.github/workflows/ci\.ya?ml$
