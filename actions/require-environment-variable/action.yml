name: Require environment variable
description: >
  Fail when a required environment variable is unset or empty, instead of letting
  the job proceed and misbehave on the empty value further down.

  READS THE ENVIRONMENT, BY NAME. It looks each name up in its own environment,
  so a `vars.X` or `secrets.X` value has to be put there by the caller first --
  those live in expression contexts, not in the environment, and a composite
  action cannot reach them:

  Forget the `env:` block and every name reports as unset, which is why the error
  says which of the two it was: `unset` means nothing put it in the environment
  (usually a missing `env:` block), `empty` means something did but the value was
  blank (usually a variable or secret that does not exist).

  Never prints a value, only the name and which state it is in, so it is safe to
  point at a secret. Echo the value yourself if you want it in the log.

  Checks every name before failing, so one run lists everything that is missing
  rather than one name per re-run.

inputs:
  name:
    description: >
      Environment variable name to require. Accepts several, separated by
      whitespace or newlines, to check a whole set in one step.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        # Via env:, not interpolated into the script, so a value containing
        # quotes or a newline cannot terminate the surrounding shell string.
        REQUIRED_NAMES: ${{ inputs.name }}
      run: |
        set -euo pipefail

        # Unquoted on purpose: word splitting is what turns both a
        # whitespace-separated and a newline-separated list into names.
        # shellcheck disable=SC2206
        names=( ${REQUIRED_NAMES} )
        if [ "${#names[@]}" -eq 0 ]; then
          echo "::error::require-environment-variable: the 'name' input is empty — nothing to check." >&2
          exit 1
        fi

        missing=()
        for n in "${names[@]}"; do
          # ${!n} is indirect expansion: the value of the variable NAMED by $n.
          # The +/:- suffixes keep it from tripping `set -u` on an unset name,
          # and separate "nothing set it" from "set to the empty string".
          if [ -z "${!n+set}" ]; then
            missing+=( "$n (unset)" )
          elif [ -z "${!n:-}" ]; then
            missing+=( "$n (empty)" )
          else
            echo "ok: $n is set"
          fi
        done

        if [ "${#missing[@]}" -gt 0 ]; then
          for m in "${missing[@]}"; do
            echo "::error title=Missing environment variable::$m is required by this job." >&2
          done
          echo "::error::require-environment-variable: ${#missing[@]} of ${#names[@]} required variable(s) missing: ${missing[*]}" >&2
          exit 1
        fi
