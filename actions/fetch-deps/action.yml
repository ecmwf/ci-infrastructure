name: Fetch resolved deps
description: >
  Download each resolved dep from the S3 store (`ARTIFACT_S3_*`, `AWS_*` in the
  job env) into its install path, emit the CMAKE_PREFIX_PATH covering them and
  prepend their lib dirs to LD_LIBRARY_PATH for later steps.

inputs:
  deps-json:
    description: 'JSON array of resolved deps (a matrix leg''s `_resolved.deps`).'
    required: true
    default: '[]'
  token:
    description: 'GitHub token (App token preferred for higher rate limits)'
    required: false
    default: ''
  install-python-deps:
    description: '"false" stages needs-python wheels without installing them (e.g. HPC legs).'
    required: false
    default: 'true'

outputs:
  cmake-prefix-path:
    description: 'Semicolon-separated CMAKE_PREFIX_PATH covering all downloaded deps'
    value: ${{ steps.compose-cmake.outputs.cmake-prefix-path }}
  updated-deps-json:
    description: 'The resolved deps JSON array with each source updated to "store"'
    value: ${{ steps.fetch-deps.outputs.updated-deps-json }}

runs:
  using: composite
  steps:
    - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main

    - name: Fetch resolved deps
      id: fetch-deps
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        DEPS_JSON: ${{ inputs.deps-json }}
        INSTALL_PYTHON_DEPS: ${{ inputs.install-python-deps }}
      run: |
        # needs-python wheels go into the setup-python interpreter
        # ($pythonLocation), never $CI_INFRASTRUCTURE_PYTHON; with
        # install-python-deps=false they are only staged (HPC installs them).
        echo "S3 artifact bucket: ${ARTIFACT_S3_BUCKET:-<unset>}"
        args=(--deps-json "$DEPS_JSON")
        if [ "${INSTALL_PYTHON_DEPS:-true}" = "false" ]; then
          args+=(--no-python-install)
        elif [ -n "${pythonLocation:-}" ]; then
          args+=(--consumer-python "${pythonLocation}/bin/python")
        fi
        "$CI_INFRASTRUCTURE_PYTHON" -I -u -m ci_infrastructure.fetch_deps "${args[@]}"

    - name: Compose CMAKE_PREFIX_PATH and LD_LIBRARY_PATH from deps-json
      id: compose-cmake
      shell: bash
      run: |
        "$CI_INFRASTRUCTURE_PYTHON" -I - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os
        deps = json.loads(os.environ["DEPS_JSON"])
        # Expand the resolver's $RUNNER_TEMP template against THIS job's runner.
        paths = [os.path.expandvars(d["install-path"]) for d in deps]
        print(f"cmake-prefix-path={';'.join(paths)}")
        # For dlopen (findlibs) in later steps; linked code finds its deps by RPATH.
        lib_dirs = [d for p in paths for d in (f"{p}/lib64", f"{p}/lib") if os.path.isdir(d)]
        if lib_dirs:
            old = os.environ.get("LD_LIBRARY_PATH", "")
            with open(os.environ["GITHUB_ENV"], "a") as env:
                env.write(f"LD_LIBRARY_PATH={':'.join(lib_dirs + ([old] if old else []))}\n")
        PY
      env:
        DEPS_JSON: ${{ inputs.deps-json }}
