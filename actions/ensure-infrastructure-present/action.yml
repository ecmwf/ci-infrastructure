name: Ensure ci-infrastructure infrastructure is present
description: >
  YOU PROBABLY DO NOT NEED TO CALL THIS. Every action here that uses the
  ci_infrastructure package nests it already, as its first step, so a caller
  never bootstraps -- see README.md, and tests/test_action_conventions.py, which
  enforces it. Call it directly only when a workflow runs
  $CI_INFRASTRUCTURE_PYTHON itself rather than through an action, as
  hpc-nightly-cleanup.yml and smoke-test-hpc.yml do. To force a reinstall from
  inside a job that only reaches this through a nested action, set
  CI_INFRASTRUCTURE_FORCE_REINSTALL=true in the job's env.

  Materialise a dedicated venv at
  $RUNNER_TOOL_CACHE/ci-infrastructure-venv/<ref>-<src-hash> with the
  ci-infrastructure package installed, isolated from the test interpreter's
  site-packages. Exposes the venv's interpreter as $CI_INFRASTRUCTURE_PYTHON for
  all subsequent steps in the job.

  The path carries a hash of the action checkout's sources, not just the ref
  name, because a ref like `main` moves: keyed on the name alone, a runner with
  a persistent tool cache keeps serving whichever ci-infrastructure it installed
  first and never picks up a push to main. A content key makes a source change a
  new venv, and leaves an unchanged ref hitting the same cached one.

  The bootstrap interpreter is chosen INDEPENDENTLY of any
  actions/setup-python step the consumer may have run before us. The helper
  venv hosts ci-infrastructure, and we prefer a
  stable system interpreter over the consumer's test-matrix one, so we drop
  setup-python's bin from PATH for the probe.

  Idempotent, with two short-circuits. An image that bakes ci-infrastructure
  into an interpreter advertises it via CI_INFRASTRUCTURE_PYTHON; when that is
  set, can import the HPC entrypoint, AND matches the sources we would otherwise
  install, we reuse it and skip the venv entirely (a true no-op — no per-job
  build, no PyPI/GitHub egress). The bake must live outside _work: ARC's
  Kubernetes mode overlays the runner's _work tree (where RUNNER_TOOL_CACHE, and
  thus the venv, lives) with an ephemeral per-job volume that shadows anything
  baked at that path, so a baked tool-cache venv would be hidden. Absent a baked
  interpreter, we reuse an existing venv at the target path if a prior step in
  the same job already built one.

  THE MATCH IS CHECKED, AND A MISMATCH IS FATAL. Importability is not version: a
  baked install from an older commit imports perfectly well, so an import check
  would take the fast path and the job would silently run stale code — surfacing
  much later as a missing CLI command. We compare a digest of the baked package's
  *.py files against the checkout's and fail loudly when they differ, naming both
  digests and (when the image records it in CI_INFRASTRUCTURE_BAKED_REF) the
  commit the image was built from.

  Only *.py files are hashed, deliberately. An installed tree is not
  byte-identical to src/ci_infrastructure: the certs/*.pem.license sidecar is not
  matched by the package-data glob, and py.typed is not declared as package data
  at all, so whether it survives an install depends on the setuptools version.
  Hashing everything would report a mismatch on an image that is perfectly in
  sync. *.py is what determines behaviour and CLI surface, which is the failure
  mode that matters; drift confined to troika-config.yml or the bundled certs is
  not detected.

  Source of the install: normally the ci-infrastructure checkout that GitHub
  Actions pulled into _actions/<owner>/ci-infrastructure/<ref>/ when it loaded
  this composite. Pip installs from that local path, so the install needs no
  token and works for private repos. When the job's own workspace IS a
  ci-infrastructure checkout, that wins instead — so this repo's own workflows
  test the branch under test rather than whatever @main currently holds.

  The checkout is located by probing candidate paths for the file we actually
  need, rather than by re-anchoring github.action_path: that assumes an
  /_actions/ segment, which a local `uses: ./actions/...` reference does not have.

inputs:
  force-reinstall:
    description: >
      When 'true', ignore any baked interpreter and any cached venv and install
      ci-infrastructure fresh from the checkout. Empty or 'false' keeps the
      default: reuse a matching baked interpreter, else a content-keyed venv.

      The environment variable CI_INFRASTRUCTURE_FORCE_REINSTALL=true does the
      same thing and is what a consumer normally wants: this action is usually
      reached through another action that nests it, and a nested `uses:` cannot
      forward an input. Set the env var once on the job and every bootstrap in
      that job honours it.
      Set this in ci-infrastructure's own end-to-end jobs, which must exercise
      the branch rather than whatever an image happens to carry — it makes those
      jobs independent of which commit the image was built from. Needed on any
      pull-request job that runs inside one of the published images, because the
      image necessarily lags the branch under test.
    required: false
    default: ''

outputs:
  python:
    description: 'Path to the ci-infrastructure venv interpreter.'
    value: ${{ steps.bootstrap.outputs.python }}

runs:
  using: composite
  steps:
    - id: bootstrap
      shell: bash
      env:
        FORCE_REINSTALL_INPUT: ${{ inputs.force-reinstall }}
      run: |
        set -euo pipefail

        rel="src/ci_infrastructure/__init__.py"

        # Digest of a package's *.py files, keyed on paths relative to the package
        # dir so an installed tree and a source tree are comparable. LC_ALL=C
        # fixes the ordering; __pycache__ is pruned because a pip install leaves
        # one behind in the _actions checkout on a persistent self-hosted runner.
        pkg_py_hash() {
          local dir="$1" list
          [ -d "$dir" ] || return 1
          list="$(cd "$dir" && find . -name '__pycache__' -prune -o -type f -name '*.py' -print \
                  | LC_ALL=C sort)"
          [ -n "$list" ] || return 1
          ( cd "$dir" && printf '%s\n' "$list" | xargs sha256sum | sha256sum | cut -c1-16 )
        }

        # Locate the ci-infrastructure sources to install/compare against. The
        # job's own workspace wins when it is a ci-infrastructure checkout, so
        # this repo's own workflows exercise the branch under test; otherwise the
        # _actions checkout of whatever ref the consumer pinned.
        #
        # Probing for the file we need, instead of re-anchoring github.action_path
        # unconditionally, is what makes `uses: ./actions/...` work: a local
        # reference has no /_actions/ segment for the substitution to strip.
        cands=()
        if [ -n "${GITHUB_WORKSPACE:-}" ] && [ -f "$GITHUB_WORKSPACE/$rel" ] \
           && grep -qE '^name[[:space:]]*=[[:space:]]*"ci-infrastructure"' "$GITHUB_WORKSPACE/pyproject.toml" 2>/dev/null; then
          cands+=( "$GITHUB_WORKSPACE" )
        fi
        cands+=( "${GITHUB_ACTION_PATH:-}/../.." )
        case "${GITHUB_ACTION_PATH:-}" in
          */_actions/*)
            if [ -n "${RUNNER_WORKSPACE:-}" ]; then
              # ARC's Kubernetes container mode mounts the work tree elsewhere in
              # the job container, so github.action_path can be a host path that
              # does not resolve here. Re-anchor the _actions tail on the
              # in-container work root (parent of RUNNER_WORKSPACE).
              cands+=( "$(dirname "$RUNNER_WORKSPACE")/_actions/${GITHUB_ACTION_PATH#*/_actions/}/../.." )
            fi
            ;;
        esac
        repo_root=""
        for cand in "${cands[@]}"; do
          if [ -f "$cand/$rel" ] && [ -f "$cand/pyproject.toml" ]; then
            repo_root="$(cd "$cand" && pwd -P)"
            break
          fi
        done
        if [ -z "$repo_root" ]; then
          echo "::error::ensure-infrastructure-present: cannot locate a ci-infrastructure checkout (probed: ${cands[*]})." >&2
          exit 1
        fi
        if [ "$repo_root" = "${GITHUB_WORKSPACE:-}" ]; then
          echo "ensure-infrastructure-present: sources = the job workspace ($repo_root)"
        else
          echo "ensure-infrastructure-present: sources = the action checkout ($repo_root)"
        fi

        # Either source enables it. The env var exists because this action is
        # almost always reached through another action that nests it -- see the
        # invariant in README.md -- and a nested `uses:` cannot forward an input.
        # A consumer sets CI_INFRASTRUCTURE_FORCE_REINSTALL once at job level and
        # every bootstrap in that job sees it, at any nesting depth. The input
        # stays for the workflows that call this action directly.
        force_reinstall=false
        [ "${FORCE_REINSTALL_INPUT:-}" = "true" ] && force_reinstall=true
        [ "${CI_INFRASTRUCTURE_FORCE_REINSTALL:-}" = "true" ] && force_reinstall=true
        if $force_reinstall && [ "$repo_root" != "${GITHUB_WORKSPACE:-}" ]; then
          echo "::warning::ensure-infrastructure-present: force-reinstall is set, but the workspace is not a ci-infrastructure checkout — installing from the action checkout ($repo_root), which is the ref this action was pinned at, not a branch under test."
        fi

        checkout_hash="$(pkg_py_hash "$repo_root/src/ci_infrastructure")" \
          || { echo "::error::ensure-infrastructure-present: no *.py under $repo_root/src/ci_infrastructure" >&2; exit 1; }

        # Fast path: an image that baked ci-infrastructure into an interpreter
        # advertises it via CI_INFRASTRUCTURE_PYTHON. Honour it only when that
        # interpreter can import the HPC entrypoint AND carries the same sources
        # we would install — an import check alone passes on a stale bake and
        # silently runs old code. force-reinstall skips this path entirely.
        python="${CI_INFRASTRUCTURE_PYTHON:-}"
        baked_ok=false
        if ! $force_reinstall && [ -n "$python" ] && [ -x "$python" ] \
           && "$python" -c "import ci_infrastructure.hpc.orchestrate" >/dev/null 2>&1; then
          baked_dir="$("$python" -c 'import ci_infrastructure, os; print(os.path.dirname(os.path.abspath(ci_infrastructure.__file__)))' 2>/dev/null || true)"
          baked_hash="$(pkg_py_hash "$baked_dir" || true)"
          if [ -n "$baked_hash" ] && [ "$baked_hash" = "$checkout_hash" ]; then
            baked_ok=true
            echo "ensure-infrastructure-present: reusing the baked interpreter $python (*.py digest $baked_hash matches the checkout)"
          else
            baked_ref="${CI_INFRASTRUCTURE_BAKED_REF:-}"
            echo "::error::ensure-infrastructure-present: the ci-infrastructure baked into this image does not match the checkout (baked *.py digest ${baked_hash:-unreadable}, checkout $checkout_hash${baked_ref:+, image built from $baked_ref}). The images are rebuilt automatically by ecmwf/ci-infrastructure's images.yml on every push to main that changes what gets installed, so on a pull request -- or on a commit that just landed -- the image is EXPECTED to lag and this is not a fault: set CI_INFRASTRUCTURE_FORCE_REINSTALL=true in your job's env: to install from the checkout instead (or force-reinstall: true, if you call this action directly rather than through one that nests it). If the checkout is an already-published main commit, the publish failed or was skipped; re-run images.yml." >&2
            exit 1
          fi
        fi

        if ! $baked_ok; then
          ref="${GITHUB_ACTION_REF:-main}"
          # Hash what pip would install. Two details keep the digest stable for
          # unchanged sources: sort by path (field 2), because `find -exec … +`
          # batches in directory order; and prune build leftovers, because the
          # _actions checkout persists between jobs on a self-hosted runner and
          # a pip install may leave an .egg-info or __pycache__ behind in it.
          src_hash="$(cd "$repo_root" && find pyproject.toml src \
            \( -name '__pycache__' -o -name '*.egg-info' \) -prune -o \
            -type f -exec sha256sum {} + | sort -k 2 | sha256sum | cut -c1-16)"
          venv_root="${RUNNER_TOOL_CACHE}/ci-infrastructure-venv"
          venv="${venv_root}/${ref}-${src_hash}"
          python="$venv/bin/python"
          if $force_reinstall && [ -d "$venv" ]; then
            echo "ensure-infrastructure-present: force-reinstall — discarding the cached venv at $venv"
            rm -rf "$venv"
          fi
          if [ -x "$python" ] && "$python" -c "import ci_infrastructure.hpc.orchestrate" >/dev/null 2>&1; then
            echo "ensure-infrastructure-present: reusing existing venv at $venv (no pip install needed)"
          else
            if [ -x "$python" ]; then
              echo "ensure-infrastructure-present: existing venv at $venv is incomplete (import check failed) — rebuilding from scratch."
              rm -rf "$venv"
            fi
            echo "ensure-infrastructure-present: no venv at $venv — creating one now."
            echo "  This pip-installs ci-infrastructure from $repo_root, pulling its deps"
            echo "  (pydantic, boto3, click, PyYAML) from PyPI and troika from GitHub over git; if this"
            echo "  container has no outbound access to PyPI and GitHub the install will stall below."

            # Strip the consumer's setup-python bin from PATH for the probe. If
            # pythonLocation is unset (no consumer setup-python ran) we just use
            # PATH as-is. We prefer a stable system interpreter over the
            # matrix-leg one. The version gate below must match
            # ci-infrastructure's requires-python, or the pip install fails.
            bootstrap_path="$PATH"
            if [ -n "${pythonLocation:-}" ]; then
              exclude="${pythonLocation}/bin"
              cleaned=""
              IFS=:
              for p in $bootstrap_path; do
                [ "$p" = "$exclude" ] && continue
                cleaned="${cleaned:+$cleaned:}$p"
              done
              unset IFS
              bootstrap_path="$cleaned"
            fi

            bootstrap_py=""
            for cand in python3.13 python3.12 python3.11 python3; do
              if path="$(PATH="$bootstrap_path" command -v "$cand" 2>/dev/null)"; then
                if "$path" -c 'import sys; sys.exit(0 if sys.version_info >= (3,11) else 1)'; then
                  bootstrap_py="$path"
                  break
                fi
              fi
            done

            if [ -z "$bootstrap_py" ]; then
              echo "::error::ensure-infrastructure-present: no Python >=3.11 found on PATH after excluding the consumer setup-python interpreter (pythonLocation=${pythonLocation:-<unset>}). Install python3.11+ in the runner image, or in the consumer container." >&2
              exit 1
            fi

            echo "  using bootstrap interpreter: $bootstrap_py ($("$bootstrap_py" --version 2>&1))"
            "$bootstrap_py" -m venv "$venv"
            start=$SECONDS
            # Drop --quiet so pip's "Collecting …" progress is visible — a stall is
            # then obvious from the log instead of being silent. --no-input never
            # prompts; --timeout/--retries bound network waits so a blocked PyPI
            # egress fails fast with a clear error rather than hanging for minutes.
            echo "  pip install ci-infrastructure from $repo_root ..."
            "$venv/bin/pip" install --no-input --timeout 60 --retries 2 --disable-pip-version-check "$repo_root"
            echo "ensure-infrastructure-present: venv ready in $((SECONDS - start))s"
          fi
          # mtime is the venv's last-used time, not its build time, so the sweep
          # below measures idleness. Touch on reuse as well as after a build.
          touch "$venv"
          # Content keys mean a new venv per ci-infrastructure change, which on a
          # persistent self-hosted tool cache would accumulate forever. Drop the
          # ones no job has touched in a week; anything a concurrent job is using
          # was touched seconds ago and is never a candidate.
          find "$venv_root" -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + 2>/dev/null || true
        fi
        echo "CI_INFRASTRUCTURE_PYTHON=$python" >> "$GITHUB_ENV"
        echo "python=$python" >> "$GITHUB_OUTPUT"
