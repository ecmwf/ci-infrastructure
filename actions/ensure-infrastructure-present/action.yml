name: Ensure ci-infrastructure infrastructure is present
description: |
  If `$CI_INFRASTRUCTURE_PYTHON` is not set, install ci-infrastructure
  and expose its Python via `$CI_INFRASTRUCTURE_PYTHON`.
  It does nothing if the infrastructure is already installed,
  either because of prior calls or because it is baked into the image.
  An installed copy that does not match the checkout is replaced, with a warning.

  .. note::
    All actions that need the CI infrastructure are guaranteed to call it themselves,
    i.e. the user does not have to bootstrap.
    But it also does no harm to call it.
    Call it yourself when a workflow runs `$CI_INFRASTRUCTURE_PYTHON` directly.
    `tests/test_action_conventions.py` enforces that every action using the package nests it.

inputs:
  force-reinstall:
    description: >
      'true' ignores any baked interpreter or cached venv and installs from the
      checkout; CI_INFRASTRUCTURE_FORCE_REINSTALL=true in the job env does the
      same for nested calls.
    required: false
    default: ''

outputs:
  python:
    description: 'Path to the ci-infrastructure venv interpreter.'
    value: ${{ steps.bootstrap.outputs.python }}

runs:
  using: composite
  steps:
    - id: bootstrap
      shell: bash
      env:
        FORCE_REINSTALL_INPUT: ${{ inputs.force-reinstall }}
      run: |
        set -euo pipefail

        rel="src/ci_infrastructure/__init__.py"

        # Relative paths, so an installed tree and a source tree compare equal. The package
        # data (pyproject.toml's package-data) counts too: a template-only change must not
        # reuse a stale baked interpreter.
        pkg_hash() {
          local dir="$1" list
          [ -d "$dir" ] || return 1
          list="$(cd "$dir" && find . -name '__pycache__' -prune -o -type f \
                  \( -name '*.py' -o -name '*.j2' -o -name '*.yml' -o -name '*.pem' \) -print \
                  | LC_ALL=C sort)"
          [ -n "$list" ] || return 1
          ( cd "$dir" && printf '%s\n' "$list" | xargs sha256sum | sha256sum | cut -c1-16 )
        }

        # The workspace wins when it is a ci-infrastructure checkout (this repo's CI).
        cands=()
        if [ -n "${GITHUB_WORKSPACE:-}" ] && [ -f "$GITHUB_WORKSPACE/$rel" ] \
           && grep -qE '^name[[:space:]]*=[[:space:]]*"ci-infrastructure"' "$GITHUB_WORKSPACE/pyproject.toml" 2>/dev/null; then
          cands+=( "$GITHUB_WORKSPACE" )
        fi
        cands+=( "${GITHUB_ACTION_PATH:-}/../.." )
        case "${GITHUB_ACTION_PATH:-}" in
          */_actions/*)
            if [ -n "${RUNNER_WORKSPACE:-}" ]; then
              # ARC's Kubernetes mode mounts the work tree elsewhere, so
              # re-anchor the _actions tail on the in-container work root.
              cands+=( "$(dirname "$RUNNER_WORKSPACE")/_actions/${GITHUB_ACTION_PATH#*/_actions/}/../.." )
            fi
            ;;
        esac
        repo_root=""
        for cand in "${cands[@]}"; do
          if [ -f "$cand/$rel" ] && [ -f "$cand/pyproject.toml" ]; then
            repo_root="$(cd "$cand" && pwd -P)"
            break
          fi
        done
        if [ -z "$repo_root" ]; then
          echo "::error::ensure-infrastructure-present: cannot locate a ci-infrastructure checkout (probed: ${cands[*]})." >&2
          exit 1
        fi
        if [ "$repo_root" = "${GITHUB_WORKSPACE:-}" ]; then
          echo "ensure-infrastructure-present: sources = the job workspace ($repo_root)"
        else
          echo "ensure-infrastructure-present: sources = the action checkout ($repo_root)"
        fi

        # The env var reaches nested calls, which cannot forward inputs.
        force_reinstall=false
        [ "${FORCE_REINSTALL_INPUT:-}" = "true" ] && force_reinstall=true
        [ "${CI_INFRASTRUCTURE_FORCE_REINSTALL:-}" = "true" ] && force_reinstall=true
        if $force_reinstall && [ "$repo_root" != "${GITHUB_WORKSPACE:-}" ]; then
          echo "::warning::ensure-infrastructure-present: force-reinstall is set, but the workspace is not a ci-infrastructure checkout — installing from the action checkout ($repo_root), which is the ref this action was pinned at, not a branch under test."
        fi

        checkout_hash="$(pkg_hash "$repo_root/src/ci_infrastructure")" \
          || { echo "::error::ensure-infrastructure-present: no package files under $repo_root/src/ci_infrastructure" >&2; exit 1; }

        python="${CI_INFRASTRUCTURE_PYTHON:-}"
        baked_ok=false
        if ! $force_reinstall && [ -n "$python" ] && [ -x "$python" ] \
           && "$python" -c "import ci_infrastructure.hpc.orchestrate" >/dev/null 2>&1; then
          baked_dir="$("$python" -c 'import ci_infrastructure, os; print(os.path.dirname(os.path.abspath(ci_infrastructure.__file__)))' 2>/dev/null || true)"
          baked_hash="$(pkg_hash "$baked_dir" || true)"
          if [ -n "$baked_hash" ] && [ "$baked_hash" = "$checkout_hash" ]; then
            baked_ok=true
            echo "ensure-infrastructure-present: reusing the baked interpreter $python (package digest $baked_hash matches the checkout)"
          else
            baked_ref="${CI_INFRASTRUCTURE_BAKED_REF:-}"
            echo "::warning::ensure-infrastructure-present: the ci-infrastructure baked into this image does not match the checkout (baked package digest ${baked_hash:-unreadable}, checkout $checkout_hash${baked_ref:+, image built from $baked_ref}); installing from the checkout instead. Expected on a pull request or just after a merge to main, until images.yml republishes the image; if it persists, check images.yml."
          fi
        fi

        if ! $baked_ok; then
          ref="${GITHUB_ACTION_REF:-main}"
          src_hash="$(cd "$repo_root" && find pyproject.toml src \
            \( -name '__pycache__' -o -name '*.egg-info' \) -prune -o \
            -type f -exec sha256sum {} + | sort -k 2 | sha256sum | cut -c1-16)"
          venv_root="${RUNNER_TOOL_CACHE}/ci-infrastructure-venv"
          venv="${venv_root}/${ref}-${src_hash}"
          python="$venv/bin/python"
          if $force_reinstall && [ -d "$venv" ]; then
            echo "ensure-infrastructure-present: force-reinstall — discarding the cached venv at $venv"
            rm -rf "$venv"
          fi
          if [ -x "$python" ] && "$python" -c "import ci_infrastructure.hpc.orchestrate" >/dev/null 2>&1; then
            echo "ensure-infrastructure-present: reusing existing venv at $venv (no pip install needed)"
          else
            if [ -x "$python" ]; then
              echo "ensure-infrastructure-present: existing venv at $venv is incomplete (import check failed) — rebuilding from scratch."
              rm -rf "$venv"
            fi
            echo "ensure-infrastructure-present: no venv at $venv — creating one now."
            echo "  This installs ci-infrastructure from $repo_root with uv, pulling its deps"
            echo "  (pydantic, boto3, click, PyYAML, jinja2) from PyPI and troika from GitHub over git; if this"
            echo "  container has no outbound access to PyPI and GitHub the install will stall below."

            # uv is the images' way to a Python (public-images/README.md); the venv
            # gets the same uv-managed CPython the baked interpreter is.
            if ! command -v uv >/dev/null 2>&1; then
              echo "::error::ensure-infrastructure-present: uv is not on PATH. It is in every ci-infrastructure image; on another runner install it (https://docs.astral.sh/uv/getting-started/installation/), e.g. with astral-sh/setup-uv." >&2
              exit 1
            fi
            start=$SECONDS
            echo "  using $(uv --version) with a uv-managed CPython 3.12"
            UV_PYTHON_PREFERENCE=only-managed uv venv --python 3.12 "$venv"
            # Not --quiet, so a stall is visible; the timeout makes blocked egress fail fast.
            echo "  uv pip install ci-infrastructure from $repo_root ..."
            # [runtime]: the base install is only what the pre-commit hook needs.
            UV_HTTP_TIMEOUT=60 uv pip install --python "$venv/bin/python" "$repo_root[runtime]"
            echo "ensure-infrastructure-present: venv ready in $((SECONDS - start))s"
          fi
          # mtime = last use; drop venvs idle a week.
          touch "$venv"
          find "$venv_root" -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + 2>/dev/null || true
        fi
        echo "CI_INFRASTRUCTURE_PYTHON=$python" >> "$GITHUB_ENV"
        echo "python=$python" >> "$GITHUB_OUTPUT"
