name: Report a check run back to the dispatcher
description: >
  Post a check run on the dispatcher's commit so a private dispatched run reports
  pass/fail on a public PR without exposing its logs (details_url needs repo
  access). phase=start creates it in progress; phase=finish completes
  (or creates) it.

inputs:
  token:
    description: 'Token with checks:write on head-repo (an owner-scoped App installation token).'
    required: true
  head-repo:
    description: 'owner/repo whose commit the check run is attached to (the dispatcher / from-repo).'
    required: true
  head-sha:
    description: 'Commit SHA on head-repo to attach the check run to (from-sha).'
    required: true
  name:
    description: 'Check run name, e.g. "cxxmath/build (clang++-18, ubuntu-24.04)".'
    required: true
  details-url:
    description: 'URL the check links to (this private run).'
    required: true
  phase:
    description: 'start | finish'
    required: true
  conclusion:
    description: 'For phase=finish: the run conclusion (success | failure | cancelled | skipped ...).'
    required: false
    default: 'success'
  check-run-id:
    description: 'For phase=finish: the id output by the phase=start invocation.'
    required: false
    default: ''

outputs:
  check-run-id:
    description: 'The created check run id (set on phase=start).'
    value: ${{ steps.report.outputs.check-run-id }}

runs:
  using: composite
  steps:
    - id: report
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        HEAD_REPO: ${{ inputs.head-repo }}
        HEAD_SHA: ${{ inputs.head-sha }}
        CHECK_NAME: ${{ inputs.name }}
        DETAILS_URL: ${{ inputs.details-url }}
        PHASE: ${{ inputs.phase }}
        CONCLUSION: ${{ inputs.conclusion }}
        CHECK_RUN_ID: ${{ inputs.check-run-id }}
      run: |
        set -uo pipefail
        # Best-effort: bookkeeping must never change the job's result.
        if [ "$PHASE" = "start" ]; then
          id=$(gh api -X POST "repos/$HEAD_REPO/check-runs" \
                 -f name="$CHECK_NAME" \
                 -f head_sha="$HEAD_SHA" \
                 -f status=in_progress \
                 -f details_url="$DETAILS_URL" \
                 --jq .id 2>/dev/null) || id=""
          if [ -z "$id" ]; then
            echo "::warning title=check-run::Could not create in-progress check '$CHECK_NAME' on $HEAD_REPO."
          fi
          echo "check-run-id=$id" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$PHASE" = "finish" ]; then
          if [ -n "$CHECK_RUN_ID" ]; then
            gh api -X PATCH "repos/$HEAD_REPO/check-runs/$CHECK_RUN_ID" \
              -f status=completed \
              -f conclusion="$CONCLUSION" \
              -f details_url="$DETAILS_URL" >/dev/null 2>&1 \
              || echo "::warning title=check-run::Could not update check $CHECK_RUN_ID on $HEAD_REPO."
          else
            gh api -X POST "repos/$HEAD_REPO/check-runs" \
              -f name="$CHECK_NAME" \
              -f head_sha="$HEAD_SHA" \
              -f status=completed \
              -f conclusion="$CONCLUSION" \
              -f details_url="$DETAILS_URL" >/dev/null 2>&1 \
              || echo "::warning title=check-run::Could not create terminal check '$CHECK_NAME' on $HEAD_REPO."
          fi
          exit 0
        fi

        echo "::error title=check-run::Unknown phase '$PHASE' (expected start|finish)." >&2
        exit 1
