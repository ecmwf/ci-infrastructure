name: Announce image
description: >
  Print the CI image this job runs in (name, tag, build date, Dockerfile link,
  from the baked CI_IMAGE_* env; see IMAGES.md) plus `extra`, as a notice and
  step summary. Pure bash with no dependencies, so it cannot fail for unrelated
  reasons. Silent when CI_IMAGE_NAME is unset.

inputs:
  extra:
    description: 'Free text printed with the image facts (resolved deps, compiler, leg). Multi-line is fine.'
    required: false
    default: ''
  title:
    description: 'Heading for the notice and the step summary.'
    required: false
    default: 'CI image'

runs:
  using: composite
  steps:
    - id: announce
      shell: bash
      env:
        EXTRA: ${{ inputs.extra }}
        TITLE: ${{ inputs.title }}
        # Stands down the images' BASH_ENV announcer for this step.
        CI_IMAGE_ANNOUNCE_ACTION: '1'
      run: |
        set -euo pipefail

        if [ -z "${CI_IMAGE_NAME:-}" ]; then
          exit 0
        fi

        # Once per job.
        if [ -n "${CI_IMAGE_ANNOUNCED:-}" ]; then
          exit 0
        fi
        [ -n "${GITHUB_ENV:-}" ] && echo "CI_IMAGE_ANNOUNCED=1" >> "$GITHUB_ENV"
        # The marker keeps the BASH_ENV announcer quiet within this step too.
        : > "${CI_IMAGE_ANNOUNCED_MARKER:-/tmp/.ci-image-announced}" 2>/dev/null || true

        # The rolling tag carries a date: which build, vs CREATED: when it ran.
        line="$CI_IMAGE_NAME:${CI_IMAGE_TAG:-<untagged>} built ${CI_IMAGE_CREATED:-<unknown>}"

        echo "::notice title=$TITLE::$line"

        {
          echo "$TITLE"
          echo "  image:      $CI_IMAGE_NAME"
          echo "  tag:        ${CI_IMAGE_TAG:-<untagged>}"
          echo "  built:      ${CI_IMAGE_CREATED:-<unknown>}"
          [ -n "${CI_IMAGE_DOCKERFILE_URL:-}" ] && echo "  dockerfile: $CI_IMAGE_DOCKERFILE_URL"
          [ -n "${CI_INFRASTRUCTURE_BAKED_REF:-}" ] && echo "  ci-infra:   $CI_INFRASTRUCTURE_BAKED_REF"
          [ -n "$EXTRA" ] && { echo "  --"; printf '%s\n' "$EXTRA" | sed 's/^/  /'; }
        } || true

        # Append, never truncate: the summary is shared with the job's other steps.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "<details><summary>$TITLE — <code>$CI_IMAGE_NAME</code></summary>"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`$CI_IMAGE_NAME\` |"
            echo "| tag | \`${CI_IMAGE_TAG:-<untagged>}\` |"
            echo "| built | \`${CI_IMAGE_CREATED:-<unknown>}\` |"
            if [ -n "${CI_IMAGE_DOCKERFILE_URL:-}" ]; then
              echo "| dockerfile | [$CI_IMAGE_NAME/Dockerfile]($CI_IMAGE_DOCKERFILE_URL) |"
            fi
            if [ -n "${CI_INFRASTRUCTURE_BAKED_REF:-}" ]; then
              echo "| ci-infrastructure | \`$CI_INFRASTRUCTURE_BAKED_REF\` |"
            fi
            if [ -n "$EXTRA" ]; then
              echo
              printf '%s\n' "$EXTRA"
            fi
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
