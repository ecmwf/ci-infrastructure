name: Run pre-commit
description: >
  Run `pre-commit run --all-files`. Needs Python and a prior checkout.
  pre-commit/action still runs on Node 20; FORCE_JAVASCRIPT_ACTIONS_TO_NODE24:
  'true' in the job's env silences GitHub's deprecation warning.

runs:
  using: composite
  steps:
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
