name: Run pre-commit
description: >
  Run `pre-commit run --all-files`, with pre-commit from uv and the hook
  environments cached per config. Needs a prior checkout.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: false

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-uv|${{ runner.os }}-${{ runner.arch }}|${{ hashFiles('.pre-commit-config.yaml') }}

    - shell: bash
      run: uvx pre-commit run --show-diff-on-failure --color=always --all-files
