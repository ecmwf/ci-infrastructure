name: Run pre-commit
description: >
  Run `pre-commit run --all-files`. Needs Python, a prior checkout, and
  job-level FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'.

runs:
  using: composite
  steps:
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
