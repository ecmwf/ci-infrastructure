name: Fetch deps and publish package
description: >
  DEPRECATED, and kept only so call sites that predate the split keep working.
  Use `actions/fetch-deps` instead of `mode: download-only`, and
  `actions/publish-artifact` instead of `mode: publish`. This shim delegates to
  exactly those two and will be deleted once every consumer has migrated.

  It exists because actions are referenced @main: a generated workflow already
  committed on a consumer's default branch still names this action, and would
  break the moment it disappeared.

inputs:
  mode:
    description: '"download-only" or "publish"'
    required: true
  deps-json:
    description: 'JSON array of resolved deps. download-only mode.'
    required: false
    default: '[]'
  install-path:
    description: 'Absolute path of the freshly-built package install. publish mode.'
    required: false
    default: ''
  artifact-name:
    description: 'Canonical artifact name for the freshly-built package. publish mode.'
    required: false
    default: ''
  found:
    description: '"true" if package was already found in the upstream store. publish mode.'
    required: false
    default: 'false'
  token:
    description: 'GitHub token (App token preferred for higher rate limits). download-only mode.'
    required: false
    default: ''
  install-python-deps:
    description: 'Whether to pip-install needs-python wheels into the consumer interpreter. download-only mode.'
    required: false
    default: 'true'
  s3-bucket:
    description: 'Artifact S3 bucket name. publish mode.'
    required: false
    default: ''
  s3-region:
    description: 'Artifact S3 region. publish mode.'
    required: false
    default: ''
  s3-endpoint:
    description: 'Artifact S3 endpoint URL. publish mode.'
    required: false
    default: ''
  s3-use-ssl:
    description: 'Whether to use SSL for S3 connections. publish mode.'
    required: false
    default: ''
  s3-key-prefix:
    description: 'Key prefix for artifact objects. publish mode.'
    required: false
    default: ''
  s3-ca-bundle:
    description: 'Path to a CA bundle for S3 TLS verification. publish mode.'
    required: false
    default: ''

outputs:
  cmake-prefix-path:
    description: 'Semicolon-separated CMAKE_PREFIX_PATH covering all downloaded deps (download-only mode)'
    value: ${{ steps.fetch.outputs.cmake-prefix-path }}
  updated-deps-json:
    description: 'The resolved deps JSON array with each source updated to "store" (download-only mode)'
    value: ${{ steps.fetch.outputs.updated-deps-json }}

runs:
  using: composite
  steps:
    # No ensure-infrastructure-present here on purpose: this shim runs nothing
    # itself, and both actions it delegates to bootstrap themselves.
    - name: Fetch resolved deps
      id: fetch
      if: inputs.mode == 'download-only'
      uses: ecmwf/ci-infrastructure/actions/fetch-deps@main
      with:
        deps-json: ${{ inputs.deps-json }}
        token: ${{ inputs.token }}
        install-python-deps: ${{ inputs.install-python-deps }}

    - name: Publish
      if: inputs.mode == 'publish'
      uses: ecmwf/ci-infrastructure/actions/publish-artifact@main
      with:
        install-path: ${{ inputs.install-path }}
        artifact-name: ${{ inputs.artifact-name }}
        found: ${{ inputs.found }}
        s3-bucket: ${{ inputs.s3-bucket }}
        s3-region: ${{ inputs.s3-region }}
        s3-endpoint: ${{ inputs.s3-endpoint }}
        s3-use-ssl: ${{ inputs.s3-use-ssl }}
        s3-key-prefix: ${{ inputs.s3-key-prefix }}
        s3-ca-bundle: ${{ inputs.s3-ca-bundle }}
