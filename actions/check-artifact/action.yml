name: Check artifact store
description: >
  Resolves a git ref to a SHA and checks whether a named artifact exists in a
  GitHub repo's artifact store. Wraps scripts/check_artifact.py, which lives
  alongside this action in the ci-infrastructure repo.

inputs:
  repo:
    description: 'owner/repo to check'
    required: true
  ref:
    description: 'Branch, tag, or full commit SHA to resolve'
    required: true
  artifact-prefix:
    description: 'Prefix for the artifact name (<prefix>-<sha>-<platform>-<compiler>-<build-type>)'
    required: true
  platform:
    description: >
      Explicit binary-compatibility class (e.g. ubuntu-24.04), used verbatim as the
      artifact-name platform slot. ABI-compatible images sharing a platform share one
      artifact. The runner/image is pure scheduling and not part of artifact identity.
    required: true
  compiler:
    description: 'Compiler identifier including version (e.g. gfortran-14, clang-18, gcc-13) for the artifact name'
    required: true
  build-type:
    description: 'CMake build type (e.g. Release, Debug) for the artifact name'
    required: true
  python-version:
    description: >
      Python version (e.g. 3.12). When set, included in the artifact name as
      py<version>: <prefix>-<sha>-<platform>-<compiler>-py<version>-<build-type>.
      Leave empty for non-Python artifacts.
    required: false
    default: ''
  deps-artifact-names:
    description: >
      Space-separated list of direct compiled dependency artifact names used to
      compute the deps-hash8 segment in the artifact name. Leave empty for leaf
      packages (e.g. fortmath) that have no compiled binary dependencies.
    required: false
    default: ''
  options:
    description: >
      Space-separated build options (feature flags) orthogonal to build-type.
      When non-empty, an 'opts.<sorted.dotted>' segment is appended to the
      artifact name. Leave empty for a plain build.
    required: false
    default: ''
  token:
    description: 'GitHub token with contents:read and actions:read on the repo'
    required: false
    default: ''
  s3-bucket:
    description: 'Artifact S3 bucket name. Empty leaves ARTIFACT_S3_BUCKET from the job environment in place.'
    required: false
    default: ''
  s3-region:
    description: 'Artifact S3 region. Empty keeps the org default (RegionOne).'
    required: false
    default: ''
  s3-endpoint:
    description: 'Artifact S3 endpoint URL. Empty leaves ARTIFACT_S3_ENDPOINT from the job environment in place.'
    required: false
    default: ''
  s3-use-ssl:
    description: 'Whether to use SSL for S3 connections. Empty keeps the default (true).'
    required: false
    default: ''
  s3-key-prefix:
    description: 'Key prefix for artifact objects. Empty reads them from the bucket root.'
    required: false
    default: ''
  s3-ca-bundle:
    description: 'Path to a CA bundle for S3 TLS verification. Empty uses the object-store root vendored with ci-infrastructure.'
    required: false
    default: ''

outputs:
  sha:
    description: 'Resolved 40-char commit SHA'
    value: ${{ steps.check.outputs.sha }}
  artifact-name:
    description: 'Full artifact name: <prefix>-<sha>-<platform>-<compiler>-<build-type>'
    value: ${{ steps.check.outputs.artifact-name }}
  tar-name:
    description: 'Artifact tar filename: <artifact-name>.tar.gz'
    value: ${{ steps.check.outputs.tar-name }}
  found:
    description: '"true" if the artifact exists in the store, "false" otherwise'
    value: ${{ steps.check.outputs.found }}
  run-status:
    description: 'running|completed|none — status of workflow runs for this SHA in the upstream repo'
    value: ${{ steps.check.outputs.run-status }}
  run-conclusion:
    description: 'success|failure|cancelled|skipped — conclusion when run-status is completed; empty otherwise'
    value: ${{ steps.check.outputs.run-conclusion }}
  original-ref:
    description: 'The original ref string passed to the action (for threading into merge)'
    value: ${{ steps.check.outputs.original-ref }}

runs:
  using: composite
  steps:
    - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main

    - name: Configure S3 artifact store
      shell: bash
      env:
        S3_BUCKET_INPUT: ${{ inputs.s3-bucket }}
        S3_REGION_INPUT: ${{ inputs.s3-region }}
        S3_ENDPOINT_INPUT: ${{ inputs.s3-endpoint }}
        S3_USE_SSL_INPUT: ${{ inputs.s3-use-ssl }}
        S3_KEY_PREFIX_INPUT: ${{ inputs.s3-key-prefix }}
        S3_CA_BUNDLE_INPUT: ${{ inputs.s3-ca-bundle }}
      run: |
        set -euo pipefail
        if [ -n "$S3_BUCKET_INPUT" ]; then echo "ARTIFACT_S3_BUCKET=$S3_BUCKET_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_REGION_INPUT" ]; then echo "ARTIFACT_S3_REGION=$S3_REGION_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_ENDPOINT_INPUT" ]; then echo "ARTIFACT_S3_ENDPOINT=$S3_ENDPOINT_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_USE_SSL_INPUT" ]; then echo "ARTIFACT_S3_USE_SSL=$S3_USE_SSL_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_KEY_PREFIX_INPUT" ]; then echo "ARTIFACT_S3_KEY_PREFIX=$S3_KEY_PREFIX_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_CA_BUNDLE_INPUT" ]; then echo "ARTIFACT_S3_CA_BUNDLE=$S3_CA_BUNDLE_INPUT" >> "$GITHUB_ENV"; fi

    - name: Resolve ref and check artifact store
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        REPO_INPUT: ${{ inputs.repo }}
        REF_INPUT: ${{ inputs.ref }}
        ARTIFACT_PREFIX_INPUT: ${{ inputs.artifact-prefix }}
        PLATFORM_INPUT: ${{ inputs.platform }}
        COMPILER_INPUT: ${{ inputs.compiler }}
        BUILD_TYPE_INPUT: ${{ inputs.build-type }}
        PYTHON_VERSION_INPUT: ${{ inputs.python-version }}
        DEPS_ARTIFACT_NAMES_INPUT: ${{ inputs.deps-artifact-names }}
        OPTIONS_INPUT: ${{ inputs.options }}
      run: |
        set -euo pipefail
        args=(
          --repo "$REPO_INPUT"
          --ref "$REF_INPUT"
          --artifact-prefix "$ARTIFACT_PREFIX_INPUT"
          --platform "$PLATFORM_INPUT"
          --compiler "$COMPILER_INPUT"
          --build-type "$BUILD_TYPE_INPUT"
        )
        if [ -n "$PYTHON_VERSION_INPUT" ]; then args+=(--python-version "$PYTHON_VERSION_INPUT"); fi
        if [ -n "$DEPS_ARTIFACT_NAMES_INPUT" ]; then args+=(--deps-artifact-names "$DEPS_ARTIFACT_NAMES_INPUT"); fi
        if [ -n "$OPTIONS_INPUT" ]; then args+=(--options "$OPTIONS_INPUT"); fi
        "$CI_INFRASTRUCTURE_PYTHON" -m ci_infrastructure.check_artifact "${args[@]}"
