name: Ensure the base-image environment
description: >
  Give a job that does not run in an official image what a job script relies on
  from the `base` images (public-images/README.md): uv on PATH, in the bases'
  version. In an official image, which sets CI_IMAGE_NAME, it does nothing.
  Elsewhere, e.g. on a GitHub-hosted runner, it installs uv if it is missing and
  warns about anything else `verify-environment.sh --host` finds missing.

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${CI_IMAGE_NAME:-}" ]; then
          echo "ensure-environment: official image $CI_IMAGE_NAME, nothing to do."
          echo "image=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "image=false" >> "$GITHUB_OUTPUT"
        if command -v uv >/dev/null 2>&1; then
          echo "uv=true" >> "$GITHUB_OUTPUT"
        else
          echo "uv=false" >> "$GITHUB_OUTPUT"
        fi

    # The version the official bases copy from ghcr.io/astral-sh/uv (public-images/*/base/Dockerfile).
    - if: steps.check.outputs.image == 'false' && steps.check.outputs.uv == 'false'
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: '0.13.5'
        # Nothing keys a cache before the checkout; downloads are fast.
        enable-cache: false

    # Only a warning: a Python leg needs none of the headers and tools the bases add for C/C++ builds.
    - if: steps.check.outputs.image == 'false'
      shell: bash
      env:
        VERIFY: ${{ github.action_path }}/../../public-images/verify-environment.sh
      run: |
        if ! out="$(bash "$VERIFY" --host 2>&1)"; then
          # Without the ::error:: prefix, so the log shows no error annotation for a warning.
          printf '%s\n' "$out" | sed 's/::error:://'
          echo "::warning title=ensure-environment::this host lacks part of the base images' environment: $(grep -m1 '::error::' <<<"$out" | sed 's/.*::error:://')"
        fi
