name: Resolve dependency tree from manifest
description: >
  Read .ci/manifest.toml, walk the upstream graph over GraphQL and emit the
  resolved dependency tree per matrix leg.

inputs:
  manifest:
    description: 'Path to the local manifest file (relative to repo root)'
    required: false
    default: '.ci/manifest.toml'
  current-branch:
    description: >
      Branch being built. A sync branch is used in each upstream repo where it
      exists, as in actions/pick-ref.
    required: false
    default: ''
  matrix:
    description: >
      Comma-separated [matrix.<name>] blocks to expand; each becomes a
      matrix-<name> output.
    required: false
    default: 'build'
  upstream-manifest-path:
    description: 'Manifest path in upstream repos'
    required: false
    default: '.ci/manifest.toml'
  token:
    description: >
      Token with contents:read and actions:read on every repo in the manifest
      graph (an App token has higher rate limits).
    required: false
    default: ''
  client-id:
    description: >
      GitHub App client ID. With app-private-key, mints an org token so a missing
      producer artifact is rebuilt by dispatch instead of failing fast.
    required: false
    default: ''
  app-private-key:
    description: 'GitHub App private key (PEM). See client-id for usage.'
    required: false
    default: ''
  s3-bucket:
    description: 'Artifact S3 bucket name. Empty leaves ARTIFACT_S3_BUCKET from the job environment in place.'
    required: false
    default: ''
  s3-region:
    description: 'Artifact S3 region. Empty keeps the org default (RegionOne).'
    required: false
    default: ''
  s3-endpoint:
    description: 'Artifact S3 endpoint URL. Empty leaves ARTIFACT_S3_ENDPOINT from the job environment in place.'
    required: false
    default: ''
  s3-use-ssl:
    description: 'Whether to use SSL for S3 connections. Empty keeps the default (true).'
    required: false
    default: ''
  s3-key-prefix:
    description: 'Key prefix for artifact objects. Empty reads them from the bucket root.'
    required: false
    default: ''
  s3-ca-bundle:
    description: 'Path to a CA bundle for S3 TLS verification. Empty uses the object-store root vendored with ci-infrastructure.'
    required: false
    default: ''

outputs:
  matrix-build:
    description: 'Resolved matrix for [matrix.build].'
    value: ${{ steps.r.outputs.matrix-build }}
  matrix-build-hpc:
    description: 'Resolved matrix for [matrix.build-hpc] (SLURM builds).'
    value: ${{ steps.r.outputs.matrix-build-hpc }}
  matrix-test:
    description: 'Resolved matrix for [matrix.test].'
    value: ${{ steps.r.outputs.matrix-test }}
  matrix-clang-tidy:
    description: 'Resolved matrix for [matrix.clang-tidy].'
    value: ${{ steps.r.outputs.matrix-clang-tidy }}
  matrix-build-python:
    description: 'Resolved matrix for [matrix.build-python].'
    value: ${{ steps.r.outputs.matrix-build-python }}
  matrix-build-python-hpc:
    description: 'Resolved matrix for [matrix.build-python-hpc] (SLURM Python-extension builds).'
    value: ${{ steps.r.outputs.matrix-build-python-hpc }}
  matrix-test-hpc:
    description: 'Resolved matrix for [matrix.test-hpc] (SLURM test-only legs).'
    value: ${{ steps.r.outputs.matrix-test-hpc }}
  matrix-ci:
    description: 'Resolved matrix for [matrix.ci].'
    value: ${{ steps.r.outputs.matrix-ci }}
  json:
    description: 'Full resolved tree, keyed by matrix name.'
    value: ${{ steps.r.outputs.json }}
  app-token:
    description: 'App-minted token, same job only (masked values arrive empty through job outputs).'
    value: ${{ steps.mint.outputs.token }}

runs:
  using: composite
  steps:
    - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main

    - name: Configure S3 artifact store
      shell: bash
      env:
        S3_BUCKET_INPUT: ${{ inputs.s3-bucket }}
        S3_REGION_INPUT: ${{ inputs.s3-region }}
        S3_ENDPOINT_INPUT: ${{ inputs.s3-endpoint }}
        S3_USE_SSL_INPUT: ${{ inputs.s3-use-ssl }}
        S3_KEY_PREFIX_INPUT: ${{ inputs.s3-key-prefix }}
        S3_CA_BUNDLE_INPUT: ${{ inputs.s3-ca-bundle }}
      run: |
        set -euo pipefail
        if [ -n "$S3_BUCKET_INPUT" ]; then echo "ARTIFACT_S3_BUCKET=$S3_BUCKET_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_REGION_INPUT" ]; then echo "ARTIFACT_S3_REGION=$S3_REGION_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_ENDPOINT_INPUT" ]; then echo "ARTIFACT_S3_ENDPOINT=$S3_ENDPOINT_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_USE_SSL_INPUT" ]; then echo "ARTIFACT_S3_USE_SSL=$S3_USE_SSL_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_KEY_PREFIX_INPUT" ]; then echo "ARTIFACT_S3_KEY_PREFIX=$S3_KEY_PREFIX_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_CA_BUNDLE_INPUT" ]; then echo "ARTIFACT_S3_CA_BUNDLE=$S3_CA_BUNDLE_INPUT" >> "$GITHUB_ENV"; fi

    - name: Mint dispatch token
      id: mint
      if: inputs.client-id != '' && inputs.app-private-key != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        # Org-wide (the graph is dynamic); permissions narrowed instead.
        owner: ${{ github.repository_owner }}
        permission-contents: read
        permission-actions: write

    - name: Resolve dependency tree
      id: r
      shell: bash
      env:
        # Prefer the org-scoped App token; github.token 404s on sibling private repos.
        GH_TOKEN: ${{ steps.mint.outputs.token || inputs.token || github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        DISPATCH_TOKEN: ${{ steps.mint.outputs.token }}
        MANIFEST: ${{ inputs.manifest }}
        CURRENT_BRANCH: ${{ inputs.current-branch }}
        MATRIX: ${{ inputs.matrix }}
        UPSTREAM_MANIFEST_PATH: ${{ inputs.upstream-manifest-path }}
      run: |
        set -euo pipefail
        "$CI_INFRASTRUCTURE_PYTHON" -m ci_infrastructure.resolve_deps \
          --manifest "$MANIFEST" \
          --current-branch "$CURRENT_BRANCH" \
          --matrix "$MATRIX" \
          --upstream-manifest-path "$UPSTREAM_MANIFEST_PATH"
