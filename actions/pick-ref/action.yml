name: Pick downstream ref
description: >
  Emit `try-branch` when it is a sync branch (`sync-branch/*` / `feature-sync/*`)
  that exists in `repo`, otherwise `fallback-ref`, so coordinated cross-repo PRs
  build against each other. Stdlib-only python, no bootstrap.

inputs:
  repo:
    description: 'owner/repo to probe (typically github.repository — the consumer repo).'
    required: true
  try-branch:
    description: 'Branch name to probe; usually the upstream-side branch we were called from.'
    required: true
  fallback-ref:
    description: 'Ref to use unless try-branch is a sync branch that exists in `repo` (typically the manifest ref).'
    required: true
  token:
    description: 'Token with contents:read on `repo`. Defaults to github.token.'
    required: false
    default: ''

outputs:
  ref:
    description: 'The chosen ref: try-branch if it is a sync branch that exists in `repo`, otherwise fallback-ref.'
    value: ${{ steps.pick.outputs.ref }}

runs:
  using: composite
  steps:
    - id: pick
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        REPO: ${{ inputs.repo }}
        TRY_BRANCH: ${{ inputs.try-branch }}
        FALLBACK_REF: ${{ inputs.fallback-ref }}
      run: |
        set -euo pipefail

        rel="src/ci_infrastructure/sync_branch.py"

        # Probe for the module; see actions/check-pr-declaration.
        cands=( "${GITHUB_ACTION_PATH:-}/../.." )
        case "${GITHUB_ACTION_PATH:-}" in
          */_actions/*)
            if [ -n "${RUNNER_WORKSPACE:-}" ]; then
              cands+=( "$(dirname "$RUNNER_WORKSPACE")/_actions/${GITHUB_ACTION_PATH#*/_actions/}/../.." )
            fi
            ;;
        esac
        root=""
        for cand in "${cands[@]}"; do
          if [ -f "$cand/$rel" ]; then
            root="$(cd "$cand" && pwd -P)"
            break
          fi
        done
        if [ -z "$root" ]; then
          echo "::error title=pick-ref::cannot locate $rel next to this action (probed: ${cands[*]}). This is a ci-infrastructure bug." >&2
          exit 1
        fi

        python=""
        for cand in python3 python; do
          if path="$(command -v "$cand" 2>/dev/null)"; then
            if "$path" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 8) else 1)'; then
              python="$path"
              break
            fi
          fi
        done
        if [ -z "$python" ]; then
          echo "::error title=pick-ref::no python3 >= 3.8 on PATH." >&2
          exit 1
        fi

        if ! PYTHONPATH="$root/src${PYTHONPATH:+:$PYTHONPATH}" \
            "$python" -m ci_infrastructure.sync_branch "$TRY_BRANCH"; then
          echo "ref=$FALLBACK_REF" >> "$GITHUB_OUTPUT"
          echo "'$TRY_BRANCH' is not a sync branch; using '$FALLBACK_REF'."
          exit 0
        fi
        if gh api "repos/$REPO/branches/$TRY_BRANCH" >/dev/null 2>&1; then
          echo "ref=$TRY_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Branch '$TRY_BRANCH' exists in $REPO; using it."
        else
          echo "ref=$FALLBACK_REF" >> "$GITHUB_OUTPUT"
          echo "Branch '$TRY_BRANCH' not in $REPO; falling back to '$FALLBACK_REF'."
        fi
