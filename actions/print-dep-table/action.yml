name: Print dependency table
description: >
  Renders a Markdown table of the OWN package and its resolved upstream
  dependencies to the job's step summary. The Package and SHA columns
  link to the upstream repo and commit, so log readers can click through
  to the source of every dep.

  Inputs are the JSON the resolver emits via _resolved.deps and the
  per-leg own-* fields. Pass them straight from the matrix entry.

  Columns: Package | Ref | SHA | Deps hash | Platform | Compiler | Python | Build type | Source

inputs:
  deps-json:
    description: >
      JSON array of resolved dep dicts (matrix._resolved.deps). Rejected when
      empty: '[]' is what a package with no deps passes, and the difference
      between that and "the caller wired nothing up" is the whole point.
    required: true
  own-name:
    description: 'OWN package name. Omit to skip the OWN row; supply it and own-artifact-name is required too.'
    required: false
    default: ''
  own-repo:
    description: 'OWN package repo as owner/name'
    required: false
    default: ${{ github.repository }}
  own-sha:
    description: 'OWN package commit SHA'
    required: false
    default: ${{ github.sha }}
  own-artifact-name:
    description: 'OWN package artifact name (matrix._resolved.own-artifact-name)'
    required: false
    default: ''
  own-source:
    description: 'OWN package source label (built / artifact / triggered rebuild)'
    required: false
    default: 'built'
  own-ref:
    description: 'OWN package branch/tag (matrix._resolved.own-ref); blank if a SHA was pinned'
    required: false
    default: ''
  own-platform:
    description: 'OWN package platform slug (matrix._resolved.own-platform)'
    required: false
    default: ''
  own-compiler:
    description: 'OWN package compiler (matrix._resolved.own-compiler)'
    required: false
    default: ''
  own-python:
    description: 'OWN package python version (matrix._resolved.own-python)'
    required: false
    default: ''
  own-build-type:
    description: 'OWN package build type (matrix._resolved.own-build-type)'
    required: false
    default: ''
  own-deps-hash:
    description: 'OWN package deps hash (matrix._resolved.own-deps-hash)'
    required: false
    default: ''
  title:
    description: 'Heading for the Markdown table section'
    required: false
    default: 'Resolved dependencies'

runs:
  using: composite
  steps:
    - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main

    - name: Print dependency table to step summary
      shell: bash
      env:
        OWN_NAME: ${{ inputs.own-name }}
        OWN_REPO: ${{ inputs.own-repo }}
        OWN_SHA: ${{ inputs.own-sha }}
        OWN_ARTIFACT: ${{ inputs.own-artifact-name }}
        OWN_SOURCE: ${{ inputs.own-source }}
        OWN_REF: ${{ inputs.own-ref }}
        OWN_PLATFORM: ${{ inputs.own-platform }}
        OWN_COMPILER: ${{ inputs.own-compiler }}
        OWN_PYTHON: ${{ inputs.own-python }}
        OWN_BUILD_TYPE: ${{ inputs.own-build-type }}
        OWN_DEPS_HASH: ${{ inputs.own-deps-hash }}
        DEPS_JSON_INPUT: ${{ inputs.deps-json }}
        TITLE_INPUT: ${{ inputs.title }}
      run: |
        set -euo pipefail

        # `required:` is documentation only -- the runner does not enforce it for a
        # composite action, and an unknown input (a misremembered name) is a
        # warning, not an error. Either way the input arrives empty and the table
        # renders blank, which reads as "no dependencies" rather than as a broken
        # call. So reject empty here, where it can actually be rejected.
        if [ -z "$DEPS_JSON_INPUT" ]; then
          echo "::error title=Dependency table::input 'deps-json' is required and was empty. Pass matrix._resolved.deps; '[]' is the right value for a package with no dependencies." >&2
          exit 1
        fi
        if [ -n "$OWN_NAME" ] && [ -z "$OWN_ARTIFACT" ]; then
          echo "::error title=Dependency table::own-name is set but 'own-artifact-name' is empty, so the OWN row would be dropped in silence. Pass matrix._resolved.own-artifact-name, or drop own-name to skip the row deliberately." >&2
          exit 1
        fi

        own_arg=()
        if [ -n "$OWN_NAME" ]; then
          own_json=$("$CI_INFRASTRUCTURE_PYTHON" -c '
        import json, os
        print(json.dumps({
            "name": os.environ["OWN_NAME"],
            "repo": os.environ["OWN_REPO"],
            "ref": os.environ["OWN_REF"],
            "sha": os.environ["OWN_SHA"],
            "artifact-name": os.environ["OWN_ARTIFACT"],
            "source": os.environ["OWN_SOURCE"],
            "platform": os.environ["OWN_PLATFORM"],
            "compiler": os.environ["OWN_COMPILER"],
            "python-version": os.environ["OWN_PYTHON"],
            "build-type": os.environ["OWN_BUILD_TYPE"],
            "deps-hash": os.environ["OWN_DEPS_HASH"],
        }))')
          own_arg=(--own "$own_json")
        fi
        # ${a[@]:+...} rather than "${a[@]}": under `set -u` an empty array is an
        # unbound variable, and the OWN row is legitimately absent for a caller
        # that passes no own-name.
        "$CI_INFRASTRUCTURE_PYTHON" -m ci_infrastructure.print_dep_table \
          --deps-json "$DEPS_JSON_INPUT" \
          --title "$TITLE_INPUT" \
          ${own_arg[@]:+"${own_arg[@]}"}
