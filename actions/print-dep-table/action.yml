name: Print dependency table
description: >
  Render a Markdown table of the own package and its resolved dependencies,
  linked to repo and commit, to the step summary.

inputs:
  resolved:
    description: >
      The matrix leg's _resolved block as JSON. Rejected when empty, since an
      undeclared input also arrives empty.
    required: true
  own-repo:
    description: 'owner/repo of the own package (not in _resolved).'
    required: false
    default: ${{ github.repository }}
  own-source:
    description: "How this job got the OWN artifact: 'built' (default) or 'artifact' when a cache-gated build skipped."
    required: false
    default: 'built'
  title:
    description: 'Heading for the Markdown table section'
    required: false
    default: 'Resolved dependencies'

runs:
  using: composite
  steps:
    - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main

    - name: Print dependency table to step summary
      shell: bash
      env:
        RESOLVED_INPUT: ${{ inputs.resolved }}
        OWN_REPO_INPUT: ${{ inputs.own-repo }}
        OWN_SOURCE_INPUT: ${{ inputs.own-source }}
        TITLE_INPUT: ${{ inputs.title }}
      run: |
        set -euo pipefail
        "$CI_INFRASTRUCTURE_PYTHON" -m ci_infrastructure.print_dep_table \
          --resolved "$RESOLVED_INPUT" \
          --own-repo "$OWN_REPO_INPUT" \
          --own-source "$OWN_SOURCE_INPUT" \
          --title "$TITLE_INPUT"
