name: Open a PR regenerating downstream-CI workflows
description: >
  Regenerate this repo's generated downstream-CI workflows from the manifests
  and, if they drifted, force-push the result to `branch` and open (or update)
  a PR into `base`; once nothing drifts, close that PR. `mode: pr-auto-merge`
  also enables auto-merge on the PR; `mode: auto-commit` pushes the commit to
  `base` instead, falling back to the PR if that push is rejected (e.g. by
  branch protection the App may not bypass). `write-token` must be an
  App token with contents, pull-requests and workflows write: GITHUB_TOKEN may
  not push workflow files, and PRs it opens trigger no CI.

inputs:
  read-token:
    description: 'Token with contents:read on every repo in [[deps]] and [[trigger-downstream]].'
    required: true
  write-token:
    description: 'App token with contents, pull-requests and workflows write on this repo.'
    required: true
  app-slug:
    description: 'Slug of the App behind write-token; the commit is authored as its bot user.'
    required: true
  manifest-path:
    description: 'Path to the manifest within each repo.'
    required: false
    default: '.ci/manifest.toml'
  branch:
    description: 'Branch the regenerated files are force-pushed to.'
    required: false
    default: 'ci/regenerate-workflows'
  base:
    description: 'Branch the PR targets. Defaults to the branch the workflow runs on.'
    required: false
    default: ''
  labels:
    description: 'Comma-separated labels for a newly opened PR; one the repo lacks is left out.'
    required: false
    default: ''
  mode:
    description: >
      'pr' opens a PR; 'pr-auto-merge' also enables squash auto-merge on it (needs "Allow auto-merge"
      and required status checks on base); 'auto-commit' pushes to base (the App must be allowed to bypass its protection).
    required: false
    default: 'pr'
  direct-push:
    description: "Deprecated: 'true' is mode 'auto-commit'."
    required: false
    default: 'false'

outputs:
  status:
    description: "'up-to-date', 'pushed', 'pr-opened', 'pr-updated' or 'pr-unchanged'."
    value: ${{ steps.pr.outputs.status }}
  pr-url:
    description: 'URL of the open PR; empty when up to date.'
    value: ${{ steps.pr.outputs.pr-url }}

runs:
  using: composite
  steps:
    - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main

    - name: Regenerate workflows
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.read-token }}
        MANIFEST_PATH_INPUT: ${{ inputs.manifest-path }}
      run: |
        set -euo pipefail
        "$CI_INFRASTRUCTURE_PYTHON" -I -m ci_infrastructure.generate_downstream_ci --manifest-path "$MANIFEST_PATH_INPUT"

    # Committed only with drifted workflows, so a push to ci-infrastructure alone opens no PR.
    - name: Pin the ci-infrastructure hooks to the generator's commit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.read-token }}
        GENERATOR_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        sha=$(gh api "repos/ecmwf/ci-infrastructure/commits/${GENERATOR_REF:-main}" --jq .sha)
        "$CI_INFRASTRUCTURE_PYTHON" -I -m ci_infrastructure.pin_hook_rev "$sha"

    - id: pr
      name: Open, update or close the PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.write-token }}
        GH_REPO: ${{ github.repository }}
        APP_SLUG: ${{ inputs.app-slug }}
        BRANCH: ${{ inputs.branch }}
        BASE: ${{ inputs.base || github.ref_name }}
        LABELS: ${{ inputs.labels }}
        MODE: ${{ inputs.mode }}
        DIRECT_PUSH: ${{ inputs.direct-push }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        if [ "$DIRECT_PUSH" = true ]; then
          echo "::warning title=Regenerate workflows::direct-push is deprecated; use mode: auto-commit."
          [ "$MODE" = pr ] && MODE=auto-commit
        fi
        case "$MODE" in
          pr|pr-auto-merge|auto-commit) ;;
          *) echo "::error title=Regenerate workflows::mode must be pr, pr-auto-merge or auto-commit, not '$MODE'."; exit 1 ;;
        esac
        title="Regenerate downstream-CI workflows"
        open_pr=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json url --jq '.[0].url // ""')

        if [ -z "$(git status --porcelain -- .github/workflows)" ]; then
          if [ -n "$open_pr" ]; then
            gh pr close "$open_pr" --delete-branch --comment "The generated workflows on \`$BASE\` are up to date again ($RUN_URL)."
          fi
          echo "Generated workflows are up to date."
          echo "status=up-to-date" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        bot="${APP_SLUG}[bot]"
        bot_id=$(gh api "users/$bot" --jq .id)
        git add -A -- .github/workflows
        [ -f .pre-commit-config.yaml ] && git add -- .pre-commit-config.yaml
        git -c user.name="$bot" -c user.email="${bot_id}+${bot}@users.noreply.github.com" commit -q -m "$title"

        # Not forced: a concurrent push to base is rejected and the PR takes over.
        if [ "$MODE" = auto-commit ]; then
          if git -c http.https://github.com/.extraheader= push -q \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BASE"; then
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --delete-branch --comment "Pushed the regenerated workflows to \`$BASE\` directly ($RUN_URL)."
            fi
            echo "::notice title=Regenerate workflows::Pushed $(git rev-parse HEAD) to $BASE."
            echo "status=pushed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning title=Regenerate workflows::Could not push to $BASE; opening a PR instead."
        fi

        # Rewriting identical workflows would retrigger CI on the PR every night, as would a hook rev
        # that moves with every push to ci-infrastructure.
        remote_tree=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github?ref=$BRANCH" \
          --jq '.[] | select(.name == "workflows") | .sha' 2>/dev/null || true)
        if [ -n "$open_pr" ] && [ "$remote_tree" = "$(git rev-parse 'HEAD:.github/workflows')" ]; then
          echo "::notice title=Regenerate workflows::$open_pr already has these changes."
          status=pr-unchanged
        else
          # Empty extraheader drops any credentials actions/checkout persisted.
          git -c http.https://github.com/.extraheader= push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

          body=$(printf 'The generated downstream-CI workflows drifted from `.ci/manifest.toml`, the sibling manifests or the generator. Regenerated by %s.\n\n```\n%s\n```\n' \
            "$RUN_URL" "$(git diff --name-status HEAD~1)")
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --body "$body"
            status=pr-updated
          else
            # gh pr create fails on a label the repo lacks; this runs org-wide, so leave such a label out.
            existing=$(gh label list --limit 1000 --json name --jq '.[].name')
            labels=()
            IFS=',' read -ra wanted <<< "$LABELS"
            for label in "${wanted[@]}"; do
              label="${label#"${label%%[![:space:]]*}"}"; label="${label%"${label##*[![:space:]]}"}"
              [ -n "$label" ] || continue
              if grep -qxF -- "$label" <<< "$existing"; then
                labels+=(--label "$label")
              else
                echo "::warning title=Regenerate workflows::$GITHUB_REPOSITORY has no label '$label'; opening the PR without it."
              fi
            done
            open_pr=$(gh pr create --head "$BRANCH" --base "$BASE" --title "$title" --body "$body" "${labels[@]}")
            status=pr-opened
          fi
          echo "::notice title=Regenerate workflows::$open_pr"
        fi

        # Not fatal: the PR stays open for a human when the repo does not allow auto-merge.
        if [ "$MODE" = pr-auto-merge ] && ! gh pr merge "$open_pr" --auto --squash; then
          echo "::warning title=Regenerate workflows::Could not enable auto-merge on $open_pr; is \"Allow auto-merge\" on?"
        fi
        { echo "status=$status"; echo "pr-url=$open_pr"; } >> "$GITHUB_OUTPUT"
