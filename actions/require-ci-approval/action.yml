name: Require CI approval for fork pull requests
description: >
  Fail unless a fork pull request has been approved to run CI, so a
  `pull_request_target` workflow cannot run outside code on self-hosted
  hardware or near its credentials before a maintainer has read the diff.

  Approved: a non-PR event, a head branch in the base repository, or a fork
  carrying `label` set by someone with write access. The label is single-use:
  deleted when honoured; `synchronize`/`reopened` of a fork PR fails and deletes it too.

  Gate jobs with `needs:` only: it FAILS rather than skips, because a skipped
  job reports Success. The caller MUST listen for `synchronize`. Labelling
  needs only triage, so "who may label" is "who may approve". Needs bash, jq,
  gh and `pull-requests: write`; triage can set labels, so who set it is checked.

inputs:
  label:
    description: 'Label that grants approval for one run.'
    required: false
    default: 'approved-for-ci'
  consume-label:
    description: >
      'true': delete the label when honoured and fail `synchronize`/`reopened`
      of a fork PR. 'false' makes one approval cover every future push.
    required: false
    default: 'true'
  trust-same-repo:
    description: >
      'true' treats a head branch in the base repository as approved; 'false'
      demands the label from everyone.
    required: false
    default: 'true'
  token:
    description: 'Token with pull-requests:write, used only to delete the label. Defaults to github.token.'
    required: false
    default: ''

outputs:
  reason:
    description: >
      Why the step passed: not-a-pull-request, same-repo or approved. Logs only;
      gating jobs on it lets unapproved pull requests go green.

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        LABEL_INPUT: ${{ inputs.label }}
        CONSUME_INPUT: ${{ inputs.consume-label }}
        TRUST_SAME_REPO_INPUT: ${{ inputs.trust-same-repo }}
      run: |
        set -euo pipefail

        label="${LABEL_INPUT:-approved-for-ci}"

        # A typo must fail, not pick the permissive branch.
        parse_bool() {
          case "$2" in
            ''|true|TRUE|True) printf 'true' ;;
            false|FALSE|False) printf 'false' ;;
            *)
              echo "::error title=CI approval::input '$1' must be 'true' or 'false', got '$2'." >&2
              exit 1
              ;;
          esac
        }
        consume="$(parse_bool consume-label "${CONSUME_INPUT:-}")"
        trust_same_repo="$(parse_bool trust-same-repo "${TRUST_SAME_REPO_INPUT:-}")"

        pass() {
          echo "reason=$1" >> "$GITHUB_OUTPUT"
          echo "CI approval: $1"
          exit 0
        }

        # Fails loudly: a silently kept label is a live approval for the next push.
        spend_label() {
          # @uri, not the raw name: labels may contain spaces and slashes.
          local encoded
          encoded="$(printf '%s' "$label" | jq -sRr @uri)"
          if ! gh api -X DELETE \
               "repos/$GITHUB_REPOSITORY/issues/$pr_number/labels/$encoded" >/dev/null 2>&1; then
            echo "::error title=CI approval::could not remove the approval label from #$pr_number. Grant this job 'pull-requests: write', or set consume-label: 'false' if that is really what you want." >&2
            exit 1
          fi
          echo "$1"
        }

        # Who set the label: the event's sender when this event set it, else the last `labeled` event.
        labeler() {
          if [ "$action" = labeled ] && [ "$(jq -r '.label.name // empty' "$event")" = "$label" ]; then
            jq -r '.sender.login // empty' "$event"
            return
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr_number/events" \
            --jq "map(select(.event == \"labeled\" and .label.name == \"$label\")) | last | .actor.login // empty"
        }

        # Labelling needs only triage; approving means handing out this repository's secrets.
        require_write_access() {
          local who permission
          if ! who="$(labeler)" || [ -z "$who" ]; then
            echo "::error title=CI approval::could not tell who set '$label' on #$pr_number; re-apply the label." >&2
            exit 1
          fi
          if ! permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$who/permission" --jq .permission 2>/dev/null)"; then
            echo "::error title=CI approval::could not look up the permission of @$who on $GITHUB_REPOSITORY, so '$label' does not count; check this job's token." >&2
            exit 1
          fi
          case "$permission" in
            admin|maintain|write) ;;
            *)
              if [ "$consume" = "true" ]; then
                spend_label "Removed '$label' from #$pr_number: @$who cannot approve."
              fi
              echo "::error title=CI approval::'$label' was set by @$who, who has '${permission:-no}' access to $GITHUB_REPOSITORY; only write, maintain or admin can approve CI for a fork." >&2
              exit 1
              ;;
          esac
        }

        event="${GITHUB_EVENT_PATH:-}"
        if [ -z "$event" ] || [ ! -f "$event" ]; then
          echo "::error title=CI approval::no event payload at \$GITHUB_EVENT_PATH." >&2
          exit 1
        fi
        if ! command -v jq >/dev/null 2>&1; then
          echo "::error title=CI approval::jq is not on PATH; run this job on ubuntu-latest or add jq to the runner image." >&2
          exit 1
        fi

        pr_number="$(jq -r '.pull_request.number // empty' "$event")"

        # schedule, workflow_dispatch, push and merge_group have no fork to distrust.
        if [ -z "$pr_number" ]; then
          pass not-a-pull-request
        fi

        head_repo="$(jq -r '.pull_request.head.repo.full_name // empty' "$event")"
        base_repo="$(jq -r '.pull_request.base.repo.full_name // empty' "$event")"
        action="$(jq -r '.action // empty' "$event")"
        has_label="$(jq -r --arg l "$label" \
          '[.pull_request.labels[]?.name] | index($l) | if . == null then "no" else "yes" end' "$event")"

        # A deleted fork leaves head.repo null: treated as a fork (fail closed).
        if [ -n "$head_repo" ] && [ "$head_repo" = "$base_repo" ] && [ "$trust_same_repo" = "true" ]; then
          pass same-repo
        fi

        # A label still here was never spent; delete it before failing.
        if [ "$consume" = "true" ] && { [ "$action" = "synchronize" ] || [ "$action" = "reopened" ]; }; then
          if [ "$has_label" = "yes" ]; then
            spend_label "Removed a leftover approval label from #$pr_number: the head commit changed before it was spent."
          fi
          {
            echo "### CI approval required"
            echo
            echo "The head commit of this pull request changed, so its earlier approval no longer applies."
            printf "A maintainer must review the new commits and re-apply the '%s' label.\n" "$label"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=CI approval::new commits need a fresh approval; a maintainer must re-apply the approval label after reviewing them." >&2
          exit 1
        fi

        if [ "$has_label" = "yes" ]; then
          require_write_access
          if [ "$consume" = "true" ]; then
            spend_label "Spent the approval label on #$pr_number: it covers this run only."
          fi
          pass approved
        fi

        {
          echo "### CI approval required"
          echo
          echo "This pull request comes from a fork, and the jobs behind this gate run its code"
          echo "with repository secrets. A maintainer must read the diff and apply the"
          printf "'%s' label before they will run.\n" "$label"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "::error title=CI approval::this fork pull request is not approved to run CI; a maintainer must apply the approval label after reviewing the diff." >&2
        exit 1
