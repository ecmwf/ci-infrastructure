name: Mint a token
description: >
  The one way the CI mints a token: from a GitHub App key, on named
  repositories of this owner, with named permissions. It knows no App, so the
  key decides what a token can reach; asking for more than the App grants
  fails the mint. Callers depend only on the inputs below and the `token`
  output, so the key inputs can give way to OIDC without touching anything else.
  check-ci-credentials holds the workflows to which key may sit where.

inputs:
  client-id:
    description: "The App's client ID."
    required: true
  private-key:
    description: "The App's private key."
    required: true
  repositories:
    description: >
      Comma-, space- or newline-separated repository names of this owner, e.g. "eckit,eccodes";
      '*' for every repository the App is installed on.
    required: true
  permissions:
    description: >
      Comma-, space- or newline-separated `name:level` pairs, e.g. "contents:read actions:read";
      names: actions, administration, checks, contents, pull-requests; levels: read, write.
    required: true

outputs:
  token:
    description: 'The installation token; revoked when the job ends.'
    value: ${{ steps.mint.outputs.token }}
  app-slug:
    description: "The App's slug, e.g. for a commit's bot author."
    value: ${{ steps.mint.outputs.app-slug }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
        REPOSITORIES: ${{ inputs.repositories }}
        PERMISSIONS: ${{ inputs.permissions }}
      run: |
        set -euo pipefail -f
        fail() { echo "::error title=mint-token::$*"; exit 1; }

        names=(actions administration checks contents pull-requests)
        levels=("" "" "" "" "")
        for pair in $(tr ',' ' ' <<< "$PERMISSIONS"); do
          name="${pair%%:*}" level="${pair#*:}"
          [[ "$level" == read || "$level" == write ]] || fail "'$pair' is not name:read or name:write"
          known=false
          for i in "${!names[@]}"; do
            if [ "${names[$i]}" = "$name" ]; then levels[i]="$level"; known=true; fi
          done
          [ "$known" = true ] || fail "'$name' is not one of: ${names[*]}"
        done
        # No permission-* at all would give the token every permission of the App.
        [ -n "$(printf '%s' "${levels[@]}")" ] || fail "permissions is empty"

        repos=()
        # Empty `repositories` with `owner` mints on the whole installation.
        if [ "${REPOSITORIES//[[:space:]]/}" != "*" ]; then
          for repo in $(tr ',' ' ' <<< "$REPOSITORIES"); do
            case "$repo" in
              "$OWNER"/*) repo="${repo#"$OWNER"/}" ;;
              */*) fail "'$repo' is not a repository of $OWNER" ;;
            esac
            [[ "$repo" =~ ^[A-Za-z0-9_.-]+$ ]] || fail "'$repo' is not a repository name"
            repos+=("$repo")
          done
          [ "${#repos[@]}" -gt 0 ] || fail "repositories is empty"
        fi

        {
          for i in "${!names[@]}"; do echo "${names[$i]}=${levels[$i]}"; done
          echo "repositories=$(IFS=,; echo "${repos[*]-}")"
        } >> "$GITHUB_OUTPUT"

    - id: mint
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ steps.check.outputs.repositories }}
        permission-actions: ${{ steps.check.outputs.actions }}
        permission-administration: ${{ steps.check.outputs.administration }}
        permission-checks: ${{ steps.check.outputs.checks }}
        permission-contents: ${{ steps.check.outputs.contents }}
        permission-pull-requests: ${{ steps.check.outputs.pull-requests }}
