name: Retry a failed scheduled run
description: >
  For a workflow_run on a failed scheduled run: re-run its failed jobs, unless
  its branch has moved on since. The calling workflow limits the attempts. The
  re-run is started with an App token, so its completion triggers workflow_run
  again, unlike one started with the job's own token.

inputs:
  client-id:
    description: 'Client ID of the dispatcher App.'
    required: true
  app-private-key:
    description: 'Private key of the dispatcher App (PEM).'
    required: true

runs:
  using: composite
  steps:
    - id: token
      uses: ecmwf/ci-infrastructure/actions/mint-token@main
      with:
        app: dispatcher
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        repositories: ${{ github.event.repository.name }}
        permissions: actions:write

    # The branch head with github.token (contents: read): the dispatcher reads no contents.
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RERUN_TOKEN: ${{ steps.token.outputs.token }}
      run: |
        set -euo pipefail
        event="${GITHUB_EVENT_PATH:?}"
        run_id="$(jq -r '.workflow_run.id' "$event")"
        attempt="$(jq -r '.workflow_run.run_attempt' "$event")"
        sha="$(jq -r '.workflow_run.head_sha' "$event")"
        branch="$(jq -r '.workflow_run.head_branch' "$event")"
        head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${branch}" --jq .sha)"
        if [ "$head" != "$sha" ]; then
          echo "${branch} moved on from ${sha:0:8} to ${head:0:8}; its own CI covers that, so no retry"
          exit 0
        fi
        GH_TOKEN="$RERUN_TOKEN" gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun-failed-jobs" >/dev/null
        echo "::notice title=Retry::re-running the failed jobs of run ${run_id} (attempt ${attempt} failed)"
