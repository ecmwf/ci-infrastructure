name: Check a commit's pull request label
description: >
  For workflow_run orchestrators (no PR or labels in the payload): read the
  level label of the open PR for `sha`, `<label>:all` or `<label>:<n>`, into
  `run` and `depth`. A commit with no open PR (a push) runs at depth `all`. Fails
  on a bare `<label>`, an invalid level, or more than one level label.

inputs:
  label:
    description: 'Prefix of the level labels.'
    required: false
    default: 'run-downstream-CI'
  sha:
    description: 'Commit to resolve a pull request for (e.g. workflow_run.head_sha).'
    required: true
  token:
    description: 'Token with pull-requests:read on this repo. Defaults to github.token (an App token 403s on non-public repos).'
    required: false
    default: ''

outputs:
  run:
    description: "'true' when the lane should run for this commit, else 'false'."
    value: ${{ steps.gate.outputs.run }}
  depth:
    description: "'all', or the highest consumer level to run; empty when `run` is 'false'."
    value: ${{ steps.gate.outputs.depth }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        LABEL_INPUT: ${{ inputs.label }}
        SHA_INPUT: ${{ inputs.sha }}
      run: |
        set -euo pipefail

        for var in LABEL_INPUT SHA_INPUT; do
          if [ -z "${!var:-}" ]; then
            echo "::error title=Label gate::input '${var%_INPUT}' is required and was empty." >&2
            exit 1
          fi
        done
        if ! command -v jq >/dev/null 2>&1; then
          echo "::error title=Label gate::jq is not on PATH; run this job on a runner image that has it." >&2
          exit 1
        fi

        pulls="${RUNNER_TEMP:-/tmp}/label-gate-pulls.json"
        gh api "/repos/${GITHUB_REPOSITORY}/commits/${SHA_INPUT}/pulls" > "$pulls"

        depth=""
        if [ "$(jq '[.[] | select(.state == "open")] | length' "$pulls")" -eq 0 ]; then
          run=true
          depth=all
          why="no open pull request (a push); running everything"
        else
          bare=false
          levels=()
          while IFS= read -r name; do
            if [ "$name" = "$LABEL_INPUT" ]; then
              bare=true
            elif [ "${name#"$LABEL_INPUT:"}" != "$name" ]; then
              levels+=("${name#"$LABEL_INPUT:"}")
            fi
          done < <(jq -r '.[] | select(.state == "open") | .labels[].name' "$pulls")

          if $bare; then
            echo "::error title=Label gate::the bare '$LABEL_INPUT' label is not used any more; use '$LABEL_INPUT:all' or '$LABEL_INPUT:<n>'." >&2
            exit 1
          fi
          if [ "${#levels[@]}" -gt 1 ]; then
            found=""
            for l in "${levels[@]}"; do found+=" '$LABEL_INPUT:$l'"; done
            echo "::error title=Label gate::more than one level label ($found ); set exactly one." >&2
            exit 1
          fi
          if [ "${#levels[@]}" -eq 0 ]; then
            run=false
            why="no '$LABEL_INPUT:all' or '$LABEL_INPUT:<n>' label; skipping"
          elif [ "${levels[0]}" = all ] || [[ "${levels[0]}" =~ ^[1-9][0-9]*$ ]]; then
            run=true
            depth="${levels[0]}"
            why="pull request carries '$LABEL_INPUT:$depth'"
          else
            echo "::error title=Label gate::'$LABEL_INPUT:${levels[0]}' is not a level; use 'all' or a number from 1." >&2
            exit 1
          fi
        fi

        echo "run=$run" >> "$GITHUB_OUTPUT"
        echo "depth=$depth" >> "$GITHUB_OUTPUT"
        echo "Label gate: $why"
