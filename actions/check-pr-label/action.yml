name: Check a commit's pull request label (deprecated)
description: >
  Deprecated: renamed to should-downstream-run, which this forwards to.
  Kept until every generated workflow has been regenerated.

inputs:
  label:
    description: 'Prefix of the level labels.'
    required: false
    default: 'run-downstream-ci'
  sha:
    description: 'Commit to resolve a pull request for (e.g. workflow_run.head_sha).'
    required: true
  token:
    description: 'Token with pull-requests:read on this repo. Defaults to github.token.'
    required: false
    default: ''

outputs:
  run:
    description: "'true' when the lane should run for this commit, else 'false'."
    value: ${{ steps.gate.outputs.run }}
  depth:
    description: "'all', or the highest consumer level to run; empty when `run` is 'false'."
    value: ${{ steps.gate.outputs.depth }}

runs:
  using: composite
  steps:
    - id: gate
      uses: ecmwf/ci-infrastructure/actions/should-downstream-run@main
      with:
        label: ${{ inputs.label }}
        sha: ${{ inputs.sha }}
        token: ${{ inputs.token }}
