name: Gate the HPC legs on a label
description: >
  Decide whether this run's HPC legs run: always outside a pull request, and on
  one only if it carries `label`. The commit status `context` follows the labels:
  pending while the legs run (the collecting ci-result job sets the result),
  and success with `opt-out-label` alone. With neither it is not posted: like
  the downstream statuses, the required check blocks the merge as "Expected". Adding `label` later re-runs this job through the hpc-label-decision
  workflow, so the labels are read live, not from the event a re-run keeps.
  Never fails for a missing label. A fork's own pull_request run posts nothing:
  ci-fork.yml runs its CI. Gate the HPC jobs on the output `run`, and collect
  them with ci-result under the same `context`. Needs bash, jq and gh.

inputs:
  label:
    description: 'Label that lets the HPC legs run on a pull request.'
    required: false
    default: 'run-hpc-ci'
  opt-out-label:
    description: 'Label that deliberately skips them, setting `context` to success.'
    required: false
    default: 'hpc-ci-not-needed'
  context:
    description: 'Commit status context the HPC legs report under (the required check).'
    required: false
    default: 'ci-result/hpc-atos'
  token:
    description: 'Token with statuses:write and pull-requests:read. Defaults to github.token.'
    required: false
    default: ''

outputs:
  run:
    description: "'true' if the HPC legs run, else 'false'."
    value: ${{ steps.gate.outputs.run }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        LABEL_INPUT: ${{ inputs.label }}
        OPT_OUT_INPUT: ${{ inputs.opt-out-label }}
        CONTEXT_INPUT: ${{ inputs.context }}
        GH_TOKEN: ${{ inputs.token || github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        for var in LABEL_INPUT OPT_OUT_INPUT CONTEXT_INPUT; do
          if [ -z "${!var:-}" ]; then
            echo "::error title=HPC gate::input '${var%_INPUT}' is required and was empty." >&2
            exit 1
          fi
        done

        decide() {
          echo "run=$1" >> "$GITHUB_OUTPUT"
          echo "HPC legs run: $1 ($2)"
        }

        event="${GITHUB_EVENT_PATH:-/dev/null}"
        pr_number="$(jq -r '.pull_request.number // empty' "$event" 2>/dev/null || true)"
        if [ -z "$pr_number" ]; then
          decide true "not a pull request"
          exit 0
        fi

        if ! labels="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" --jq '.[].name')"; then
          echo "::error title=HPC gate::could not read the labels of #${pr_number}; check this job's token." >&2
          exit 1
        fi
        has() { grep -qxF -- "$1" <<< "$labels"; }
        if has "$LABEL_INPUT"; then
          decide true "labelled $LABEL_INPUT"
          state=pending
          desc="HPC legs running"
        elif has "$OPT_OUT_INPUT"; then
          decide false "labelled $OPT_OUT_INPUT"
          state=success
          desc="HPC CI not needed"
        else
          decide false "neither $LABEL_INPUT nor $OPT_OUT_INPUT"
          echo "$CONTEXT_INPUT: not posted; add $LABEL_INPUT or $OPT_OUT_INPUT"
          exit 0
        fi

        head_repo="$(jq -r '.pull_request.head.repo.full_name // empty' "$event")"
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -n "$head_repo" ] && [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
          echo "A fork's own pull_request run: ci-fork.yml posts $CONTEXT_INPUT, not this run."
          exit 0
        fi
        sha="$(jq -r '.pull_request.head.sha // empty' "$event")"
        sha="${sha:-$GITHUB_SHA}"
        gh api -X POST "/repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
          -f state="$state" -f context="$CONTEXT_INPUT" -f target_url="$RUN_URL" \
          -f description="${desc:0:140}" >/dev/null
        echo "$CONTEXT_INPUT: $state, $desc"
