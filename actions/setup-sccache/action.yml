name: Set up sccache
description: >
  Installs sccache and configures one of three storage backends:

    - s3 (default): S3-compatible bucket. The caller supplies the bucket and
      endpoint plus AWS credentials in the job environment (AWS_ACCESS_KEY_ID /
      AWS_SECRET_ACCESS_KEY, or a runner IAM role), along with cache-key-suffix.
    - gha: GitHub Actions cache. Works on hosted and self-hosted runners that
      can reach GitHub's cache service.
    - redis: shared Redis instance (env var SCCACHE_REDIS=<url>). Recommended
      on self-hosted runner pools where a co-located Redis is faster and
      survives runner restarts.

  The S3 bucket and endpoint have no built-in default. Each is taken from its
  input, or failing that from the job environment, so a workflow-level env
  block configures every call site at once instead of every build action
  threading the same two values through:

    s3-bucket    <- SCCACHE_BUCKET
    s3-endpoint  <- SCCACHE_ENDPOINT, then ARTIFACT_S3_ENDPOINT
    s3-region    <- ARTIFACT_S3_REGION, else RegionOne
    s3-use-ssl   <- ARTIFACT_S3_USE_SSL, else true

  The artifact store and sccache share one endpoint and one credential pair and
  differ only in bucket, which is why the endpoint falls back to the artifact
  variable but the bucket does not.

  Use the outputs as CMake compiler-launcher flags:
    -DCMAKE_C_COMPILER_LAUNCHER=sccache
    -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

  For Rust/maturin, RUSTC_WRAPPER=sccache is set automatically as an env var.

  Cache entries are namespaced by the 'cache-key-suffix' input so that
  different compiler/build-type matrix legs do not pollute each other.

inputs:
  cache-key-suffix:
    description: >
      String appended to the sccache cache key namespace (or Redis/S3 prefix),
      e.g. "clang-18-Release". Use a value that uniquely identifies the
      compiler and build configuration for this matrix leg.
    required: false
    default: ''
  backend:
    description: '"s3" (default) | "gha" | "redis"'
    required: false
    default: 's3'
  redis-url:
    description: 'Redis connection URL (used when backend=redis). Defaults to SCCACHE_REDIS env/var.'
    required: false
    default: ''
  s3-bucket:
    description: 'S3 bucket name (backend=s3). Empty falls back to SCCACHE_BUCKET in the job environment.'
    required: false
    default: ''
  s3-region:
    description: 'AWS region (backend=s3). Empty falls back to ARTIFACT_S3_REGION, then RegionOne.'
    required: false
    default: ''
  s3-endpoint:
    description: 'S3-compatible endpoint URL (backend=s3). Empty falls back to SCCACHE_ENDPOINT, then ARTIFACT_S3_ENDPOINT.'
    required: false
    default: ''
  s3-use-ssl:
    description: 'Whether to use SSL for S3 connections (backend=s3). Empty falls back to ARTIFACT_S3_USE_SSL, then true.'
    required: false
    default: ''

outputs:
  cc-launcher:
    description: 'Value to pass to CMAKE_C_COMPILER_LAUNCHER (sccache)'
    value: sccache
  cxx-launcher:
    description: 'Value to pass to CMAKE_CXX_COMPILER_LAUNCHER (sccache)'
    value: sccache

runs:
  using: composite
  steps:
    - name: Install sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

    - name: Configure sccache backend
      shell: bash
      env:
        BACKEND_INPUT: ${{ inputs.backend }}
        SUFFIX: ${{ inputs.cache-key-suffix }}
        REDIS_URL_INPUT: ${{ inputs.redis-url }}
        S3_BUCKET_INPUT: ${{ inputs.s3-bucket }}
        S3_REGION_INPUT: ${{ inputs.s3-region }}
        S3_ENDPOINT_INPUT: ${{ inputs.s3-endpoint }}
        S3_USE_SSL_INPUT: ${{ inputs.s3-use-ssl }}
      run: |
        backend="$BACKEND_INPUT"
        echo "Using sccache backend: $backend"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        case "$backend" in
          gha)
            echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_VERSION=sccache-${SUFFIX}" >> "$GITHUB_ENV"
            ;;
          redis)
            redis_url="${REDIS_URL_INPUT:-$SCCACHE_REDIS}"
            if [ -z "$redis_url" ]; then
              echo "::error::backend=redis but no redis URL provided (set redis-url input or SCCACHE_REDIS env)"
              exit 1
            fi
            echo "SCCACHE_REDIS=$redis_url" >> "$GITHUB_ENV"
            echo "SCCACHE_REDIS_KEY_PREFIX=sccache-${SUFFIX}" >> "$GITHUB_ENV"
            ;;
          s3)
            # Input wins; otherwise inherit from the job environment. The
            # endpoint accepts the artifact variable too, since both stores are
            # the same one.
            bucket="${S3_BUCKET_INPUT:-${SCCACHE_BUCKET:-}}"
            endpoint="${S3_ENDPOINT_INPUT:-${SCCACHE_ENDPOINT:-${ARTIFACT_S3_ENDPOINT:-}}}"
            region="${S3_REGION_INPUT:-${ARTIFACT_S3_REGION:-RegionOne}}"
            use_ssl="${S3_USE_SSL_INPUT:-${ARTIFACT_S3_USE_SSL:-true}}"
            if [ -z "$bucket" ] || [ -z "$endpoint" ]; then
              echo "::error::backend=s3 needs a bucket and an endpoint: pass s3-bucket/s3-endpoint, or set SCCACHE_BUCKET and SCCACHE_ENDPOINT (or ARTIFACT_S3_ENDPOINT) in the job environment"
              exit 1
            fi
            echo "sccache bucket resolved (endpoint and bucket not echoed: they may be secrets)"
            {
              echo "SCCACHE_BUCKET=$bucket"
              echo "SCCACHE_ENDPOINT=$endpoint"
              echo "AWS_REGION=$region"
              echo "SCCACHE_S3_USE_SSL=$use_ssl"
              echo "SCCACHE_S3_KEY_PREFIX=sccache-${SUFFIX}"
            } >> "$GITHUB_ENV"
            ;;
          *)
            echo "::error::Unknown backend '$backend' (expected s3, gha, or redis)"
            exit 1
            ;;
        esac
