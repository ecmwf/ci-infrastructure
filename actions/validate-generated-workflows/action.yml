name: Validate generated downstream-CI workflows
description: >
  Re-render this repo's generated downstream-CI workflows from the manifests and
  report drift from the checked-in files. Drift warns unless fail-on-drift; a
  schema or graph violation always fails.

inputs:
  token:
    description: 'Token with contents:read on every repo in [[deps]] and [[trigger-downstream]].'
    required: false
    default: ''
  self-path:
    description: 'Path to the repo root being validated.'
    required: false
    default: '.'
  manifest-path:
    description: 'Path to the manifest within each repo.'
    required: false
    default: '.ci/manifest.toml'
  fail-on-drift:
    description: "'true' fails on drift; 'false' only warns, so one unregenerated repo does not withhold downstream CI."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main

    - name: Validate generated workflows
      shell: bash
      working-directory: ${{ inputs.self-path }}
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        MANIFEST_PATH_INPUT: ${{ inputs.manifest-path }}
        FAIL_ON_DRIFT_INPUT: ${{ inputs.fail-on-drift }}
      run: |
        set -euo pipefail
        args=( --manifest-path "$MANIFEST_PATH_INPUT" --check )
        case "$FAIL_ON_DRIFT_INPUT" in
          true) args+=( --fail-on-drift ) ;;
          false) ;;
          # A typo must not silently downgrade the gate to a warning.
          *) echo "::error title=Validate generated workflows::fail-on-drift must be 'true' or 'false', got '$FAIL_ON_DRIFT_INPUT'." >&2; exit 1 ;;
        esac
        "$CI_INFRASTRUCTURE_PYTHON" -m ci_infrastructure.generate_downstream_ci "${args[@]}"
