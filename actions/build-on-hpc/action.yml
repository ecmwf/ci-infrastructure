name: Build a package on HPC via SLURM
description: >
  HPC counterpart of the runner build: submit .ci/hpc/build-<toolchain>.sh via
  troika/SLURM, ship source and deps, wait, and publish the install tree to S3.
  Drop-in for the build step after fetch-deps (download-only). Restartable: a
  cache hit skips, and a running job with the same artifact name is reattached.

inputs:
  site:
    description: 'Troika site to submit to (a site name in troika-config.yml)'
    required: true
  job-script:
    description: "Path to the repo's .ci/hpc/build-<toolchain>.sh (its #SBATCH header + build/test body)"
    required: true
  matrix-leg:
    description: >
      The matrix leg as JSON (pass toJSON of the matrix); render context for a
      .j2 job-script, ignored otherwise. Never write the expression delimiters
      here: descriptions are evaluated and `matrix` breaks loading.
    required: false
    default: ''
  artifact-name:
    description: 'Canonical artifact name (build identity; also the job-name + cache key)'
    required: true
  cmake-prefix-path:
    description: 'Semicolon/colon-separated dependency prefixes from the download-only step'
    required: false
    default: ''
  source-dir:
    description: 'Runner-local checkout shipped to the cluster. Defaults to the workspace.'
    required: false
    default: ${{ github.workspace }}
  work-dir:
    description: 'Runner-local scratch for tarballs and the fetched install tree. Empty uses $RUNNER_TEMP.'
    required: false
    default: ''
  remote-work-dir:
    description: >
      Absolute cluster dir visible to compute nodes, writable by the troika user.
      May name cluster variables (e.g. "$SCRATCH/github-ci"), expanded remotely.
    required: true
  marker-wait-timeout:
    description: 'Seconds the SLURM job waits for the source-transfer marker before failing.'
    required: false
    default: '1800'
  troika-config:
    description: 'Path to a troika config. Empty uses the one packaged with ci-infrastructure.'
    required: false
    default: ''
  troika-user:
    description: 'Remote/scheduler user for troika. Empty lets ssh/troika decide.'
    required: false
    default: ''
  publish:
    description: '"false": run the job for pass/fail only; no cache check, fetch or publish.'
    required: false
    default: 'true'
  s3-bucket:
    description: 'Artifact S3 bucket name. Empty leaves ARTIFACT_S3_BUCKET from the job environment in place.'
    required: false
    default: ''
  s3-region:
    description: 'Artifact S3 region. Empty keeps the org default (RegionOne).'
    required: false
    default: ''
  s3-endpoint:
    description: 'Artifact S3 endpoint URL. Empty leaves ARTIFACT_S3_ENDPOINT from the job environment in place.'
    required: false
    default: ''
  s3-use-ssl:
    description: 'Whether to use SSL for S3 connections. Empty keeps the default (true).'
    required: false
    default: ''
  s3-key-prefix:
    description: 'Key prefix for artifact objects. Empty stores them at the bucket root.'
    required: false
    default: ''
  s3-ca-bundle:
    description: 'Path to a CA bundle for S3 TLS verification. Empty uses the object-store root vendored with ci-infrastructure.'
    required: false
    default: ''

outputs:
  install-path:
    description: 'Absolute path of the built package install tree (for a downstream publish/print step)'
    value: ${{ steps.submit.outputs.install-path }}
  cache-hit:
    description: '"true" if the artifact already existed and no job was submitted'
    value: ${{ steps.submit.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main

    - name: Configure S3 artifact store
      shell: bash
      env:
        S3_BUCKET_INPUT: ${{ inputs.s3-bucket }}
        S3_REGION_INPUT: ${{ inputs.s3-region }}
        S3_ENDPOINT_INPUT: ${{ inputs.s3-endpoint }}
        S3_USE_SSL_INPUT: ${{ inputs.s3-use-ssl }}
        S3_KEY_PREFIX_INPUT: ${{ inputs.s3-key-prefix }}
        S3_CA_BUNDLE_INPUT: ${{ inputs.s3-ca-bundle }}
      run: |
        set -euo pipefail
        if [ -n "$S3_BUCKET_INPUT" ]; then echo "ARTIFACT_S3_BUCKET=$S3_BUCKET_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_REGION_INPUT" ]; then echo "ARTIFACT_S3_REGION=$S3_REGION_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_ENDPOINT_INPUT" ]; then echo "ARTIFACT_S3_ENDPOINT=$S3_ENDPOINT_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_USE_SSL_INPUT" ]; then echo "ARTIFACT_S3_USE_SSL=$S3_USE_SSL_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_KEY_PREFIX_INPUT" ]; then echo "ARTIFACT_S3_KEY_PREFIX=$S3_KEY_PREFIX_INPUT" >> "$GITHUB_ENV"; fi
        if [ -n "$S3_CA_BUNDLE_INPUT" ]; then echo "ARTIFACT_S3_CA_BUNDLE=$S3_CA_BUNDLE_INPUT" >> "$GITHUB_ENV"; fi
        echo "S3 artifact bucket: ${ARTIFACT_S3_BUCKET:-<unset>}"

    - name: Submit build job and wait
      id: submit
      shell: bash
      env:
        SITE: ${{ inputs.site }}
        JOB_SCRIPT: ${{ inputs.job-script }}
        MATRIX_LEG: ${{ inputs.matrix-leg }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        CMAKE_PREFIX_PATH_INPUT: ${{ inputs.cmake-prefix-path }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        WORK_DIR_INPUT: ${{ inputs.work-dir }}
        REMOTE_WORK_DIR_INPUT: ${{ inputs.remote-work-dir }}
        MARKER_WAIT_TIMEOUT: ${{ inputs.marker-wait-timeout }}
        TROIKA_CONFIG: ${{ inputs.troika-config }}
        TROIKA_USER: ${{ inputs.troika-user }}
        PUBLISH: ${{ inputs.publish }}
      run: |
        set -euo pipefail
        if [ -z "$REMOTE_WORK_DIR_INPUT" ]; then
          echo "::error::remote-work-dir is empty. Set vars.HPC_CI_REMOTE_WORK_DIR (e.g. '\$SCRATCH/github-ci')." >&2
          exit 1
        fi
        # Local (runner) scratch: shipped/fetched tarball staging, fetched install.
        work_dir="${WORK_DIR_INPUT:-$RUNNER_TEMP}"
        tar_dir="$work_dir/hpc-tars"
        local_install_path="$work_dir/install/$ARTIFACT_NAME"
        mkdir -p "$tar_dir"
        # Unique per submission; names the TRANSFER_COMPLETED marker and is stamped
        # into the job's --comment so a reattaching run can find which run shipped.
        run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        # Verbatim: '$SCRATCH/...' is expanded on the cluster, not here.
        args=(
          --site "$SITE"
          --job-script "$JOB_SCRIPT"
          --artifact-name "$ARTIFACT_NAME"
          --remote-work-dir "$REMOTE_WORK_DIR_INPUT"
          --local-install-path "$local_install_path"
          --source-dir "$SOURCE_DIR"
          --run-id "$run_id"
          --marker-wait-timeout "$MARKER_WAIT_TIMEOUT"
          --tar-dir "$tar_dir"
          --cmake-prefix-path "$CMAKE_PREFIX_PATH_INPUT"
        )
        # Only for a .j2 job-script; a plain recipe ignores it. Through the array,
        # so quoting and $(...) inside a manifest string stay inert.
        if [ -n "$MATRIX_LEG" ]; then args+=(--matrix-leg "$MATRIX_LEG"); fi
        if [ -n "$TROIKA_CONFIG" ]; then args+=(--troika-config "$TROIKA_CONFIG"); fi
        if [ -n "$TROIKA_USER" ]; then args+=(--troika-user "$TROIKA_USER"); fi
        if [ "$PUBLISH" = "false" ]; then args+=(--no-publish); fi
        # -u: unbuffered so the wait progress can't hide behind block buffering.
        "$CI_INFRASTRUCTURE_PYTHON" -u -m ci_infrastructure.hpc submit-wait "${args[@]}"

    # Skipped on a cache hit (found) and in test-only mode.
    - name: Publish
      if: ${{ inputs.publish != 'false' }}
      uses: ecmwf/ci-infrastructure/actions/publish-artifact@main
      with:
        install-path: ${{ steps.submit.outputs.install-path }}
        artifact-name: ${{ inputs.artifact-name }}
        found: ${{ steps.submit.outputs.cache-hit }}
        s3-bucket: ${{ inputs.s3-bucket }}
        s3-region: ${{ inputs.s3-region }}
        s3-endpoint: ${{ inputs.s3-endpoint }}
        s3-use-ssl: ${{ inputs.s3-use-ssl }}
        s3-key-prefix: ${{ inputs.s3-key-prefix }}
        s3-ca-bundle: ${{ inputs.s3-ca-bundle }}
