name: Should downstream CI run for this commit
description: >
  For workflow_run orchestrators (no PR or labels in the payload): read the
  level label of the open PR for `sha`, `<label>:all` or `<label>:<n>`, into
  `run` and `depth`; a commit with no open PR (a push, e.g. a merge) does not run.
  Fails unless the PR carries at most one, valid level label. A dispatch passes
  `level` instead; a fork's PR, which `sha` does not find, comes as `pull-request`.

inputs:
  label:
    description: 'Prefix of the level labels.'
    required: false
    default: 'run-downstream-ci'
  sha:
    description: 'Commit to resolve a pull request for (e.g. workflow_run.head_sha).'
    required: true
  pull-request:
    description: 'Number of the pull request to read the label from, instead of looking it up by `sha`.'
    required: false
    default: ''
  level:
    description: "'all' or a level from 1, e.g. a dispatch input; replaces the label."
    required: false
    default: ''
  token:
    description: 'Token with pull-requests:read on this repo. Defaults to github.token (an App token 403s on non-public repos).'
    required: false
    default: ''

outputs:
  run:
    description: "'true' when the lane should run for this commit, else 'false'."
    value: ${{ steps.gate.outputs.run }}
  depth:
    description: "'all', or the highest consumer level to run; empty when `run` is 'false'."
    value: ${{ steps.gate.outputs.depth }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        LABEL_INPUT: ${{ inputs.label }}
        SHA_INPUT: ${{ inputs.sha }}
        PULL_REQUEST_INPUT: ${{ inputs.pull-request }}
        LEVEL_INPUT: ${{ inputs.level }}
      run: |
        set -euo pipefail

        for var in LABEL_INPUT SHA_INPUT; do
          if [ -z "${!var:-}" ]; then
            echo "::error title=Label gate::input '${var%_INPUT}' is required and was empty." >&2
            exit 1
          fi
        done
        if ! command -v jq >/dev/null 2>&1; then
          echo "::error title=Label gate::jq is not on PATH; run this job on a runner image that has it." >&2
          exit 1
        fi

        if [ -n "${LEVEL_INPUT:-}" ]; then
          if [ "$LEVEL_INPUT" != all ] && ! [[ "$LEVEL_INPUT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Label gate::level must be 'all' or a level from 1, got '$LEVEL_INPUT'" >&2
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "depth=$LEVEL_INPUT" >> "$GITHUB_OUTPUT"
          echo "Label gate: level '$LEVEL_INPUT' requested"
          exit 0
        fi

        pulls="${RUNNER_TEMP:-/tmp}/label-gate-pulls.json"
        if [ -n "${PULL_REQUEST_INPUT:-}" ]; then
          gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_INPUT}" | jq '[.]' > "$pulls"
        else
          # The lookup also returns PRs stacked on this commit; only the PR it heads counts.
          gh api "/repos/${GITHUB_REPOSITORY}/commits/${SHA_INPUT}/pulls" |
            jq --arg sha "$SHA_INPUT" '[.[] | select(.head.sha == $sha)]' > "$pulls"
        fi

        depth=""
        if [ "$(jq '[.[] | select(.state == "open")] | length' "$pulls")" -eq 0 ]; then
          run=false
          why="no open pull request (a push); skipping"
        else
          found=()
          while IFS= read -r name; do
            if [ "$name" = "$LABEL_INPUT" ] || [ "${name#"$LABEL_INPUT:"}" != "$name" ]; then
              found+=("$name")
            fi
          done < <(jq -r '.[] | select(.state == "open") | .labels[].name' "$pulls")
          level=""
          if [ "${#found[@]}" -gt 0 ]; then level="${found[0]#"$LABEL_INPUT:"}"; fi

          if [ "${#found[@]}" -eq 0 ]; then
            run=false
            why="no '$LABEL_INPUT:all' or '$LABEL_INPUT:<n>' label; skipping"
          elif [ "${#found[@]}" -eq 1 ] && [ "$level" != "${found[0]}" ] &&
               { [ "$level" = all ] || [[ "$level" =~ ^[1-9][0-9]*$ ]]; }; then
            run=true
            depth="$level"
            why="pull request carries '${found[0]}'"
          else
            echo "::error title=Label gate::set exactly one of '$LABEL_INPUT:all' or '$LABEL_INPUT:<n>' (n from 1); found: ${found[*]}" >&2
            exit 1
          fi
        fi

        echo "run=$run" >> "$GITHUB_OUTPUT"
        echo "depth=$depth" >> "$GITHUB_OUTPUT"
        echo "Label gate: $why"
