# The rolled-out repos: regenerate-repos.yml writes to them, default-branch-status.yml shows them.
# The regenerator App must be installed on each.
# mode: 'pr', 'pr-auto-merge' or 'auto-commit'.

[defaults]
mode = "pr-auto-merge"
labels = ["downstream-ci-not-needed", "hpc-ci-not-needed"]
title = "Regenerate downstream-CI workflows"

[repos.ecbuild]
[repos.stack-dependencies]
[repos.eckit]
[repos.eccodes]
[repos.ecflow]
[repos.fckit]
[repos.atlas]
[repos.metkit]
[repos.mir]
[repos.fdb]
[repos.gribjump]

[repos.odc]
labels = ["downstream-ci-not-needed"]

[repos.zfdb]
mode = "pr"
labels = ["downstream-ci-not-needed"]

[repos.anemoi-utils]
mode = "pr"
labels = ["downstream-ci-not-needed", "hpc-ci-not-needed", "ATS Approval Not Needed"]
title = "chore: Regenerate downstream-CI workflows"

