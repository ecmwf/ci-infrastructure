# They still run in the fan-out and show their result; read on every fan-out from main,
# so an entry applies at once, to every upstream. Remove it once the consumer is green again.
#
# [repos.<name>]
# reason = "One sentence: why it is red, and what turns it green."
# since = 2026-11-25

