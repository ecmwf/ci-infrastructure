# This org's ARC scale sets and the `hpc` self-hosted runner, which actionlint
# would otherwise flag as unknown labels.
self-hosted-runner:
  labels:
    - arc-runner-normal
    - arc-runner-large
    - arc-runner-very-large
    - hpc-submit
    - hpc

paths:
  # The push job reads the public robot from its environment `eccr-push`;
  # declaring the names under workflow_call would shadow it with empty values.
  .github/workflows/images.yml:
    ignore:
      - 'property "public_eccr_robot_(name|token)" is not defined'
