name: HPC transfer e2e

# Real-world usage test for the fetch-tree / push-tree primitives against the
# actual cluster: pushes a tree to shared scratch over troika ssh and fetches it
# back, driving the composite actions exactly as a consumer would.
#
# Runs on every push and pull request, like the rest of the suite, so a change to
# the transfer path is caught before it is dispatched by hand. push is scoped to
# main so a branch with an open PR runs the pull_request copy only, not a
# redundant second run.
#
# It needs cluster credentials, so it cannot run for a pull request from a fork:
# secrets are withheld there. That is reported as an explicit failure rather than
# a skip, because a skipped job counts as PASSING for branch protection -- a fork
# PR would otherwise appear to have this coverage without ever running it.
#
# The check lives in its own container-less job. hpc-roundtrip resolves its
# `container:` (including the registry credentials) at job setup, before any step
# runs, so on a fork PR it would die on an opaque registry-auth error and no step
# of ours would get the chance to explain why.
#
# Per-run trees go under <work dir>/transfer-e2e/, one of run_gc's GC_SUBDIRS: the
# cleanup step at the end has no `if:`, so it deliberately leaves the tree behind
# when the round-trip fails, and the nightly sweep is what stops those
# accumulating now that this runs per push rather than on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Always runs, and is a green no-op except on a fork pull request. Keeping it
  # container-less and on the cheap runner is the whole point: it can report the
  # real reason before anything tries to pull a private image.
  fork-guard:
    runs-on: ubuntu-slim
    steps:
      - name: Refuse a fork pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          echo "::error title=HPC transfer e2e cannot run from a fork::This pull request comes from $HEAD_REPO, and GitHub withholds secrets from fork pull requests — so the cluster login user and the private image credentials this job needs are both empty. Failing rather than skipping, because a skipped job counts as passing. To get this coverage: a maintainer should push the branch into ecmwf/ci-infrastructure and open the pull request from there, or run this workflow manually via workflow_dispatch once the change is on main." >&2
          exit 1

  hpc-roundtrip:
    needs: fork-guard
    # Manual only: it reaches the real cluster over troika ssh from the login-node
    # self-hosted runner, exercising the composite actions exactly as a consumer
    # would. The ubuntu-latest job above is the per-push gate.
    #
    # force-reinstall below is what makes this an honest end-to-end test of THIS
    # branch. The container image bakes ci-infrastructure and advertises
    # CI_INFRASTRUCTURE_PYTHON, so without it ensure-infrastructure-present would
    # reuse the image's copy — which is pinned to whatever commit the image was
    # built at, not what is being tested here. (It used to do that silently; it
    # now refuses, so this job would fail rather than mislead.)
    runs-on: arc-pet-vsphere-prod
    container:
      image: eccr.ecmwf.int/private-playground-ci/ubuntu24.04-internal-tools:latest
      credentials:
        username: ${{ secrets.ECCR_PULL_ROBOT_NAME }}
        password: ${{ secrets.ECCR_PULL_ROBOT_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main
        with:
          force-reinstall: true

      # Fail before touching the cluster if the work-dir variable is unset:
      # interpolating an empty vars.HPC_CI_REMOTE_WORK_DIR below yields
      # "/transfer-e2e-<run id>", and the cluster then reports a read-only-filesystem
      # error at / that says nothing about the cause. push-tree refuses such a path
      # too, but naming the variable here is the clearer failure. Same guard as
      # hpc-nightly-cleanup.yml.
      - name: Require the remote work dir environment variable being set
        shell: bash
        env:
          REMOTE_WORK_DIR: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}
        run: |
          set -euo pipefail
          if [ -z "$REMOTE_WORK_DIR" ]; then
            echo "::error::HPC_CI_REMOTE_WORK_DIR is empty. Set it as a repo/org Actions variable (e.g. '\$SCRATCH/downstream-ci') — see HPC.md." >&2
            exit 1
          fi
          echo "remote work dir: $REMOTE_WORK_DIR"

      - name: Seed a tree to push to the cluster
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hpc-e2e/src"
          mkdir -p "$src/nested"
          echo "hpc-e2e $GITHUB_RUN_ID" > "$src/hello.txt"
          echo deep > "$src/nested/deep.txt"

      - name: Push the tree up to the cluster
        id: push
        uses: ./actions/push-hpc-tree
        with:
          site: hpc-batch
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          local-dir: ${{ runner.temp }}/hpc-e2e/src
          remote-dir: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}/transfer-e2e/${{ github.run_id }}

      - name: Fetch the tree back from the cluster
        id: fetch
        uses: ./actions/fetch-hpc-tree
        with:
          site: hpc-batch
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          remote-dir: ${{ steps.push.outputs.remote-dir }}
          local-dir: ${{ runner.temp }}/hpc-e2e/back

      - name: Assert the round-trip
        shell: bash
        run: |
          set -euo pipefail
          diff -r "$RUNNER_TEMP/hpc-e2e/src" "$RUNNER_TEMP/hpc-e2e/back"
          echo "HPC round-trip OK"

      # Dogfood remove-hpc-tree exactly as a consumer would: last step, no `if:`,
      # so it runs only when the round-trip above succeeded and leaves the tree on
      # scratch for debugging if anything failed.
      - name: Remove the cluster scratch dir
        uses: ./actions/remove-hpc-tree
        with:
          site: hpc-batch
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          remote-dir: ${{ steps.push.outputs.remote-dir }}
