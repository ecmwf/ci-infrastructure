name: Registry orphans

# Manual only: deleting a repository cannot be undone, and reporting is something
# you want when you are about to act on it, not on every push.
on:
  workflow_dispatch:
    inputs:
      delete:
        description: 'Delete the orphans as well as reporting them'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  orphans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Find orphans
        shell: bash
        env:
          # Only needed for --delete; the listing is anonymous.
          PUBLIC_ECCR_CLEANUP_ROBOT_NAME: ${{ secrets.PUBLIC_ECCR_CLEANUP_ROBOT_NAME }}
          PUBLIC_ECCR_CLEANUP_ROBOT_TOKEN: ${{ secrets.PUBLIC_ECCR_CLEANUP_ROBOT_TOKEN }}
          DELETE: ${{ inputs.delete }}
        run: |
          set -euo pipefail
          args=(--format md)
          if [ "$DELETE" = "true" ]; then
            args+=(--delete)
          fi
          python3 scripts/registry_orphans.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
