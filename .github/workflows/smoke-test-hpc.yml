name: Smoke test HPC

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      full-matrix:
        description: 'Both lanes (arc, hpc) against both sites (hpc-batch, ac-batch)'
        type: boolean
        default: false

jobs:
  # Remote, not ./actions/...: a local path needs a checkout, and this job has none.
  ci-approval:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - uses: ecmwf/ci-infrastructure/actions/require-ci-approval@main

  # `arc`: an ARC pod in the internal-tools image, which carries the cluster ssh
  # identity. `hpc`: a self-hosted runner with that identity on the host and no
  # container, proving the actions don't depend on the image.
  #
  # JSON, since a YAML alias cannot be conditional. The reduced matrix drops the
  # `hpc` include too: an unmatched include would ADD a row with no site.
  lanes:
    needs: ci-approval
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick the lane/site matrix
        id: pick
        shell: bash
        env:
          # A string in the payload; absent outside workflow_dispatch.
          FULL: ${{ github.event.inputs.full-matrix }}
        run: |
          set -euo pipefail
          arc='{"lane":"arc","runner":"arc-hpc-pet-vsphere-prod","container":"eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"}'
          hpc='{"lane":"hpc","runner":"hpc","container":""}'
          if [ "${FULL:-false}" = "true" ]; then
            matrix="{\"lane\":[\"arc\",\"hpc\"],\"site\":[\"hpc-batch\",\"ac-batch\"],\"include\":[$arc,$hpc]}"
          else
            matrix="{\"lane\":[\"arc\"],\"site\":[\"hpc-batch\"],\"include\":[$arc]}"
          fi
          echo "$matrix" | jq -e . > /dev/null
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "::notice::HPC smoke matrix: $matrix"

  ssh:
    needs: [ci-approval, lanes]
    name: ssh to HPC (${{ matrix.lane }}, ${{ matrix.site }})
    strategy: &hpc-lanes
      fail-fast: false
      matrix: ${{ fromJSON(needs.lanes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: &hpc-container
      # An empty image runs the job on the host. Credentials are passed
      # unconditionally: an empty image is valid, empty credentials are not.
      image: ${{ matrix.container }}
      credentials:
        username: ${{ secrets.ECCR_PULL_ROBOT_NAME }}
        password: ${{ secrets.ECCR_PULL_ROBOT_TOKEN }}
    steps:
      - name: SSH to HPC
        shell: bash
        env:
          HPC_CI_SSH_USER: ${{ secrets.HPC_CI_SSH_USER }}
        run: |
          set -euo pipefail
          : "${HPC_CI_SSH_USER:?set the HPC_CI_SSH_USER secret to the HPC login user}"
          # The site name is an ssh alias. BatchMode fails rather than hangs on a
          # missing key or unknown host.
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "${HPC_CI_SSH_USER}@${{ matrix.site }}" \
            'echo "connected to HPC"'

  hpc-roundtrip:
    needs: [ci-approval, lanes]
    name: transfer round-trip (${{ matrix.lane }}, ${{ matrix.site }})
    strategy: *hpc-lanes
    runs-on: ${{ matrix.runner }}
    container: *hpc-container
    steps:
      # Fork code in a trusted context: safe only because every job needs ci-approval.
      - uses: ecmwf/ci-infrastructure/actions/checkout-under-test@main
        with:
          allow-unsafe-pr-checkout: 'true'

      - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main
        with:
          force-reinstall: true

      - &require-work-dir
        name: Require HPC_CI_REMOTE_WORK_DIR
        shell: bash
        env:
          HPC_CI_REMOTE_WORK_DIR: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}
        run: |
          set -euo pipefail
          : "${HPC_CI_REMOTE_WORK_DIR:?set vars.HPC_CI_REMOTE_WORK_DIR to the cluster work dir}"

      - name: Seed a tree to push to the cluster
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hpc-e2e/src"
          mkdir -p "$src/nested"
          echo "hpc-e2e $GITHUB_RUN_ID" > "$src/hello.txt"
          echo deep > "$src/nested/deep.txt"

      - name: Push the tree up to the cluster
        id: push
        uses: ./actions/push-hpc-tree
        with:
          site: ${{ matrix.site }}
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          local-dir: ${{ runner.temp }}/hpc-e2e/src
          # Per leg: concurrent legs must not remove each other's trees.
          remote-dir: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}/transfer-e2e/${{ github.run_id }}-${{ matrix.lane }}-${{ matrix.site }}

      - name: Fetch the tree back from the cluster
        id: fetch
        uses: ./actions/fetch-hpc-tree
        with:
          site: ${{ matrix.site }}
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          remote-dir: ${{ steps.push.outputs.remote-dir }}
          local-dir: ${{ runner.temp }}/hpc-e2e/back

      - name: Assert the round-trip
        shell: bash
        run: |
          set -euo pipefail
          diff -r "$RUNNER_TEMP/hpc-e2e/src" "$RUNNER_TEMP/hpc-e2e/back"
          echo "HPC round-trip OK"

      # Last step, no `if:`: a failed run leaves the tree for debugging.
      - name: Remove the cluster scratch dir
        uses: ./actions/remove-hpc-tree
        with:
          site: ${{ matrix.site }}
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          remote-dir: ${{ steps.push.outputs.remote-dir }}

  hpc-submit:
    needs: [ci-approval, lanes]
    name: submit a SLURM job (${{ matrix.lane }}, ${{ matrix.site }})
    # Submit, wait for the marker, run the recipe, read the sentinel back. The
    # artifact name is unique per run+attempt, so a re-run never reattaches.
    strategy: *hpc-lanes
    runs-on: ${{ matrix.runner }}
    container: *hpc-container
    steps:
      - uses: ecmwf/ci-infrastructure/actions/checkout-under-test@main
        with:
          allow-unsafe-pr-checkout: 'true'

      - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main
        with:
          force-reinstall: true

      - *require-work-dir

      - name: Seed a source tree and a trivial recipe
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hpc-submit/src"
          mkdir -p "$src/.ci/hpc"
          echo "$GITHUB_RUN_ID" > "$src/shipped.txt"
          # Smallest QoS atos schedules promptly. No sentinel echo: ci-infrastructure
          # appends it, and printing it here would defeat the check.
          cat > "$src/.ci/hpc/smoke.sh" <<'RECIPE'
          #!/bin/bash
          #SBATCH --qos=nf
          #SBATCH --time=00:05:00
          #SBATCH --nodes=1
          #SBATCH --ntasks=1

          echo "ci-smoke: on $(hostname)"
          # Fails a silent no-op transfer.
          test -f shipped.txt
          test -n "$CI_INSTALL_PREFIX"
          mkdir -p "$CI_INSTALL_PREFIX"
          echo ok > "$CI_INSTALL_PREFIX/smoke.txt"
          RECIPE

      - name: Submit to SLURM and wait for the sentinel
        shell: bash
        env:
          HPC_CI_REMOTE_WORK_DIR: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}
          HPC_CI_SSH_USER: ${{ secrets.HPC_CI_SSH_USER }}
        run: |
          set -euo pipefail
          "$CI_INFRASTRUCTURE_PYTHON" -u -m ci_infrastructure.hpc submit-wait \
            --site "${{ matrix.site }}" \
            --troika-user "$HPC_CI_SSH_USER" \
            --job-script "$RUNNER_TEMP/hpc-submit/src/.ci/hpc/smoke.sh" \
            --artifact-name "ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.lane }}-${{ matrix.site }}" \
            --remote-work-dir "$HPC_CI_REMOTE_WORK_DIR" \
            --local-install-path "$RUNNER_TEMP/hpc-submit/install" \
            --source-dir "$RUNNER_TEMP/hpc-submit/src" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --tar-dir "$RUNNER_TEMP/hpc-submit/tars" \
            --no-publish
