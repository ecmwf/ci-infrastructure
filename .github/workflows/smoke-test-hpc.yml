name: Smoke test HPC

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      full-matrix:
        description: 'Both lanes (arc, hpc) against both sites (hpc-batch, ac-batch)'
        type: boolean
        default: false

jobs:
  # Pinned remote rather than ./actions/...: a local path resolves only after a
  # checkout, and this job deliberately has none.
  ci-approval:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - uses: ecmwf/ci-infrastructure/actions/require-ci-approval@main

  # Two lanes for the same test. `arc` is an ARC pod that pulls the
  # internal-tools image, where the cluster ssh identity (keys, the hpc-batch
  # alias, known_hosts) lives; hence the registry credentials. `hpc` is a
  # self-hosted runner carrying the same identity on the host with NO container,
  # proving these actions don't depend on the image.
  #
  # `include` entries add runner/container to both of that lane's sites.
  # ac-batch exercises a second cluster: the image's ssh config matches
  # `Host hpc-* a?-*` and its known_hosts carries aa/ab/ac/ad/ag-batch.
  #
  # Emitted as JSON rather than a YAML anchor because an alias cannot be made
  # conditional, and the default run is one combination rather than four. The
  # reduced matrix drops the `hpc` include entry as well as the lane: an include
  # whose `lane` matches no base value would ADD a row, here one with no site.
  lanes:
    needs: ci-approval
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick the lane/site matrix
        id: pick
        shell: bash
        env:
          # A boolean workflow_dispatch input reaches the payload as a string;
          # on every other event it is absent, so the default is the reduced set.
          FULL: ${{ github.event.inputs.full-matrix }}
        run: |
          set -euo pipefail
          arc='{"lane":"arc","runner":"arc-hpc-pet-vsphere-prod","container":"eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"}'
          hpc='{"lane":"hpc","runner":"hpc","container":""}'
          if [ "${FULL:-false}" = "true" ]; then
            matrix="{\"lane\":[\"arc\",\"hpc\"],\"site\":[\"hpc-batch\",\"ac-batch\"],\"include\":[$arc,$hpc]}"
          else
            matrix="{\"lane\":[\"arc\"],\"site\":[\"hpc-batch\"],\"include\":[$arc]}"
          fi
          echo "$matrix" | jq -e . > /dev/null
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "::notice::HPC smoke matrix: $matrix"

  ssh:
    needs: [ci-approval, lanes]
    name: ssh to HPC (${{ matrix.lane }}, ${{ matrix.site }})
    strategy: &hpc-lanes
      # fail-fast off: which lane broke is the signal.
      fail-fast: false
      matrix: ${{ fromJSON(needs.lanes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: &hpc-container
      # An empty image runs the job on the host. Credentials are passed
      # unconditionally: an empty image is valid, empty credentials are not.
      image: ${{ matrix.container }}
      credentials:
        username: ${{ secrets.ECCR_PULL_ROBOT_NAME }}
        password: ${{ secrets.ECCR_PULL_ROBOT_TOKEN }}
    steps:
      - name: SSH to HPC
        shell: bash
        env:
          HPC_CI_SSH_USER: ${{ secrets.HPC_CI_SSH_USER }}
        run: |
          set -euo pipefail
          : "${HPC_CI_SSH_USER:?set the HPC_CI_SSH_USER secret to the HPC login user}"
          # The site name doubles as the ssh alias: an entry in ~/.ssh/config with a matching
          # known_hosts entry — baked into the image on the `arc` leg, present on
          # the host on the `hpc` leg. BatchMode fails instead of prompting, so a
          # missing key or unknown host is an error here rather than a hang.
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "${HPC_CI_SSH_USER}@${{ matrix.site }}" \
            'echo "connected to HPC"'

  hpc-roundtrip:
    needs: [ci-approval, lanes]
    name: transfer round-trip (${{ matrix.lane }}, ${{ matrix.site }})
    strategy: *hpc-lanes
    runs-on: ${{ matrix.runner }}
    container: *hpc-container
    steps:
      # Fork code in a trusted context, which every job here hangs off
      # ci-approval to make payable.
      - uses: ecmwf/ci-infrastructure/actions/checkout-under-test@main
        with:
          allow-unsafe-pr-checkout: 'true'

      - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main
        with:
          force-reinstall: true

      - &require-work-dir
        name: Require HPC_CI_REMOTE_WORK_DIR
        shell: bash
        env:
          HPC_CI_REMOTE_WORK_DIR: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}
        run: |
          set -euo pipefail
          : "${HPC_CI_REMOTE_WORK_DIR:?set vars.HPC_CI_REMOTE_WORK_DIR to the cluster work dir}"

      - name: Seed a tree to push to the cluster
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hpc-e2e/src"
          mkdir -p "$src/nested"
          echo "hpc-e2e $GITHUB_RUN_ID" > "$src/hello.txt"
          echo deep > "$src/nested/deep.txt"

      - name: Push the tree up to the cluster
        id: push
        uses: ./actions/push-hpc-tree
        with:
          site: ${{ matrix.site }}
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          local-dir: ${{ runner.temp }}/hpc-e2e/src
          # Per leg, not just per run: four legs run concurrently and a shared
          # remote dir would have them pushing and removing each other's trees.
          remote-dir: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}/transfer-e2e/${{ github.run_id }}-${{ matrix.lane }}-${{ matrix.site }}

      - name: Fetch the tree back from the cluster
        id: fetch
        uses: ./actions/fetch-hpc-tree
        with:
          site: ${{ matrix.site }}
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          remote-dir: ${{ steps.push.outputs.remote-dir }}
          local-dir: ${{ runner.temp }}/hpc-e2e/back

      - name: Assert the round-trip
        shell: bash
        run: |
          set -euo pipefail
          diff -r "$RUNNER_TEMP/hpc-e2e/src" "$RUNNER_TEMP/hpc-e2e/back"
          echo "HPC round-trip OK"

      # Dogfood remove-hpc-tree exactly as a consumer would: last step, no `if:`,
      # so it runs only when the round-trip above succeeded and leaves the tree on
      # scratch for debugging if anything failed.
      - name: Remove the cluster scratch dir
        uses: ./actions/remove-hpc-tree
        with:
          site: ${{ matrix.site }}
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          remote-dir: ${{ steps.push.outputs.remote-dir }}

  hpc-submit:
    needs: [ci-approval, lanes]
    name: submit a SLURM job (${{ matrix.lane }}, ${{ matrix.site }})
    # Proves the half the transfer round-trip doesn't: troika submits, the
    # compute node waits for the marker, unpacks, runs the recipe, and the runner
    # reads the sentinel back. --no-publish skips S3 and the cache; the artifact
    # name is unique per run+attempt so a re-run never reattaches.
    strategy: *hpc-lanes
    runs-on: ${{ matrix.runner }}
    container: *hpc-container
    steps:
      - uses: ecmwf/ci-infrastructure/actions/checkout-under-test@main
        with:
          allow-unsafe-pr-checkout: 'true'

      - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main
        with:
          force-reinstall: true

      - *require-work-dir

      - name: Seed a source tree and a trivial recipe
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hpc-submit/src"
          mkdir -p "$src/.ci/hpc"
          echo "$GITHUB_RUN_ID" > "$src/shipped.txt"
          # Resources are the smallest atos will schedule promptly: it selects on
          # QoS rather than partition. No sentinel echo — ci-infrastructure
          # appends that, and a recipe printing it itself would defeat the check.
          cat > "$src/.ci/hpc/smoke.sh" <<'RECIPE'
          #!/bin/bash
          #SBATCH --qos=nf
          #SBATCH --time=00:05:00
          #SBATCH --nodes=1
          #SBATCH --ntasks=1

          echo "ci-smoke: on $(hostname)"
          # The wrapper cds into the unpacked checkout, so the shipped file must
          # be here; asserting it makes a silent no-op transfer a failure.
          test -f shipped.txt
          test -n "$CI_INSTALL_PREFIX"
          mkdir -p "$CI_INSTALL_PREFIX"
          echo ok > "$CI_INSTALL_PREFIX/smoke.txt"
          RECIPE

      - name: Submit to SLURM and wait for the sentinel
        shell: bash
        env:
          HPC_CI_REMOTE_WORK_DIR: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}
          HPC_CI_SSH_USER: ${{ secrets.HPC_CI_SSH_USER }}
        run: |
          set -euo pipefail
          "$CI_INFRASTRUCTURE_PYTHON" -u -m ci_infrastructure.hpc submit-wait \
            --site "${{ matrix.site }}" \
            --troika-user "$HPC_CI_SSH_USER" \
            --job-script "$RUNNER_TEMP/hpc-submit/src/.ci/hpc/smoke.sh" \
            --artifact-name "ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.lane }}-${{ matrix.site }}" \
            --remote-work-dir "$HPC_CI_REMOTE_WORK_DIR" \
            --local-install-path "$RUNNER_TEMP/hpc-submit/install" \
            --source-dir "$RUNNER_TEMP/hpc-submit/src" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --tar-dir "$RUNNER_TEMP/hpc-submit/tars" \
            --no-publish
