name: Smoke test HPC

# Two end-to-end checks against the real cluster, sharing one runner and one
# image, cheapest first:
#
#   ssh           -- proves the private internal-tools image can reach HPC at all,
#                    using the ssh keys, ~/.ssh/config host aliases and
#                    known_hosts baked into it.
#   hpc-roundtrip -- proves the push-tree / fetch-tree / remove-tree primitives
#                    work against shared scratch, driving the composite actions
#                    exactly as a consumer would.
#
# Independent jobs rather than chained: a broken ssh setup fails both, and which
# one failed is the diagnosis. Chaining would only hide the second result.
#
# Runs on every push and pull request, so a change to the transfer path is caught
# before it is dispatched by hand. push is scoped to main so a branch with an open
# PR runs the pull_request copy only, not a redundant second run.
#
# Requires:
#   - the pull-only eccr robot secrets (ECCR_PULL_ROBOT_NAME / ECCR_PULL_ROBOT_TOKEN);
#     pulling the private image exercises the robot's private-project access.
#   - secrets.HPC_CI_SSH_USER: the HPC login user. It must match one of the baked
#     config's `Match originalhost hpc-* user <...>` blocks so the corresponding
#     baked identity is selected.
#   - vars.HPC_CI_REMOTE_WORK_DIR: the cluster work dir trees are created under.
#
# Neither job can run for a pull request from a fork: secrets are withheld there,
# and both resolve `container:` (registry credentials included) at job setup, so a
# fork PR dies before any step of ours gets to explain why. That is an explicit
# failure rather than a skip, because a skipped job counts as PASSING for branch
# protection -- a fork PR would otherwise appear to have this coverage without
# ever running it.
#
# Per-run trees go under <work dir>/transfer-e2e/, one of run_gc's GC_SUBDIRS: the
# cleanup step at the end has no `if:`, so it deliberately leaves the tree behind
# when the round-trip fails, and the nightly sweep is what stops those
# accumulating.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ssh:
    name: ssh to HPC
    runs-on: arc-hpc-pet-vsphere-prod
    container:
      image: eccr.ecmwf.int/private-playground-ci/ubuntu24.04-internal-tools:latest
      credentials:
        username: ${{ secrets.ECCR_PULL_ROBOT_NAME }}
        password: ${{ secrets.ECCR_PULL_ROBOT_TOKEN }}
    steps:
      - name: SSH to HPC
        shell: bash
        env:
          HPC_CI_SSH_USER: ${{ secrets.HPC_CI_SSH_USER }}
        run: |
          set -euo pipefail
          : "${HPC_CI_SSH_USER:?set the HPC_CI_SSH_USER secret to the HPC login user}"
          # hpc-batch is the alias baked into the image's ~/.ssh/config and
          # known_hosts. BatchMode fails instead of prompting; the baked
          # known_hosts is what lets host-key checking pass for hpc-batch.
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "${HPC_CI_SSH_USER}@hpc-batch" \
            'echo "connected to HPC"'

  hpc-roundtrip:
    runs-on: arc-hpc-pet-vsphere-prod
    container:
      image: eccr.ecmwf.int/private-playground-ci/ubuntu24.04-internal-tools:latest
      credentials:
        username: ${{ secrets.ECCR_PULL_ROBOT_NAME }}
        password: ${{ secrets.ECCR_PULL_ROBOT_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main
        with:
          force-reinstall: true

      - uses: ./actions/require-environment-variable
        with:
          name: HPC_CI_REMOTE_WORK_DIR
        env:
          HPC_CI_REMOTE_WORK_DIR: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}

      - name: Seed a tree to push to the cluster
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hpc-e2e/src"
          mkdir -p "$src/nested"
          echo "hpc-e2e $GITHUB_RUN_ID" > "$src/hello.txt"
          echo deep > "$src/nested/deep.txt"

      - name: Push the tree up to the cluster
        id: push
        uses: ./actions/push-hpc-tree
        with:
          site: hpc-batch
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          local-dir: ${{ runner.temp }}/hpc-e2e/src
          remote-dir: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}/transfer-e2e/${{ github.run_id }}

      - name: Fetch the tree back from the cluster
        id: fetch
        uses: ./actions/fetch-hpc-tree
        with:
          site: hpc-batch
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          remote-dir: ${{ steps.push.outputs.remote-dir }}
          local-dir: ${{ runner.temp }}/hpc-e2e/back

      - name: Assert the round-trip
        shell: bash
        run: |
          set -euo pipefail
          diff -r "$RUNNER_TEMP/hpc-e2e/src" "$RUNNER_TEMP/hpc-e2e/back"
          echo "HPC round-trip OK"

      # Dogfood remove-hpc-tree exactly as a consumer would: last step, no `if:`,
      # so it runs only when the round-trip above succeeded and leaves the tree on
      # scratch for debugging if anything failed.
      - name: Remove the cluster scratch dir
        uses: ./actions/remove-hpc-tree
        with:
          site: hpc-batch
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          remote-dir: ${{ steps.push.outputs.remote-dir }}
