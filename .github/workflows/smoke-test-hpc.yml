name: Smoke test HPC

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ssh:
    name: ssh to HPC (${{ matrix.name }})
    strategy:
      fail-fast: false
      # Two lanes for the same test. `arc` is an ARC pod that pulls the
      # internal-tools image, which is where the cluster ssh identity (keys, the
      # hpc-batch alias, known_hosts) lives — hence the registry credentials.
      # `hpc` is one of the pre-existing self-hosted runners labelled `hpc`:
      # those carry the same identity on the host and run NO container, so they
      # exercise the path that predates the ARC lane and prove these actions do
      # not quietly depend on something baked into the image.
      #
      # fail-fast off, because which lane broke is the whole signal: green `arc`
      # beside red `hpc` says "image-only assumption" out loud.
      matrix:
        include:
          - name: arc
            runner: arc-hpc-pet-vsphere-prod
            container: eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest
          - name: hpc
            runner: hpc
            container: ''
    runs-on: ${{ matrix.runner }}
    container:
      # An empty image runs the job on the host — that is what the `hpc` leg
      # wants, and the validator accepts it here.
      #
      # The credentials are NOT gated on the image, though the instinct is to.
      # `${{ matrix.container != '' && secrets.X || '' }}` fails template
      # validation on the hpc leg with "Unexpected value ''": an empty image is
      # allowed, an empty credentials username/password is not. So they are
      # passed unconditionally and are simply unused when there is no image to
      # pull — the secrets are always non-empty, which is all the validator wants.
      image: ${{ matrix.container }}
      credentials:
        username: ${{ secrets.ECCR_PULL_ROBOT_NAME }}
        password: ${{ secrets.ECCR_PULL_ROBOT_TOKEN }}
    steps:
      - name: SSH to HPC
        shell: bash
        env:
          HPC_CI_SSH_USER: ${{ secrets.HPC_CI_SSH_USER }}
        run: |
          set -euo pipefail
          : "${HPC_CI_SSH_USER:?set the HPC_CI_SSH_USER secret to the HPC login user}"
          # hpc-batch is an alias from ~/.ssh/config with a matching
          # known_hosts entry — baked into the image on the `arc` leg, present on
          # the host on the `hpc` leg. BatchMode fails instead of prompting, so a
          # missing key or unknown host is an error here rather than a hang.
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "${HPC_CI_SSH_USER}@hpc-batch" \
            'echo "connected to HPC"'

  hpc-roundtrip:
    name: transfer round-trip (${{ matrix.name }})
    strategy:
      fail-fast: false
      # Two lanes for the same test. `arc` is an ARC pod that pulls the
      # internal-tools image, which is where the cluster ssh identity (keys, the
      # hpc-batch alias, known_hosts) lives — hence the registry credentials.
      # `hpc` is one of the pre-existing self-hosted runners labelled `hpc`:
      # those carry the same identity on the host and run NO container, so they
      # exercise the path that predates the ARC lane and prove these actions do
      # not quietly depend on something baked into the image.
      #
      # fail-fast off, because which lane broke is the whole signal: green `arc`
      # beside red `hpc` says "image-only assumption" out loud.
      matrix:
        include:
          - name: arc
            runner: arc-hpc-pet-vsphere-prod
            container: eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest
          - name: hpc
            runner: hpc
            container: ''
    runs-on: ${{ matrix.runner }}
    container:
      # An empty image runs the job on the host — that is what the `hpc` leg
      # wants, and the validator accepts it here.
      #
      # The credentials are NOT gated on the image, though the instinct is to.
      # `${{ matrix.container != '' && secrets.X || '' }}` fails template
      # validation on the hpc leg with "Unexpected value ''": an empty image is
      # allowed, an empty credentials username/password is not. So they are
      # passed unconditionally and are simply unused when there is no image to
      # pull — the secrets are always non-empty, which is all the validator wants.
      image: ${{ matrix.container }}
      credentials:
        username: ${{ secrets.ECCR_PULL_ROBOT_NAME }}
        password: ${{ secrets.ECCR_PULL_ROBOT_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main
        with:
          force-reinstall: true

      - uses: ./actions/require-environment-variable
        with:
          name: HPC_CI_REMOTE_WORK_DIR
        env:
          HPC_CI_REMOTE_WORK_DIR: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}

      - name: Seed a tree to push to the cluster
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hpc-e2e/src"
          mkdir -p "$src/nested"
          echo "hpc-e2e $GITHUB_RUN_ID" > "$src/hello.txt"
          echo deep > "$src/nested/deep.txt"

      - name: Push the tree up to the cluster
        id: push
        uses: ./actions/push-hpc-tree
        with:
          site: hpc-batch
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          local-dir: ${{ runner.temp }}/hpc-e2e/src
          remote-dir: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}/transfer-e2e/${{ github.run_id }}

      - name: Fetch the tree back from the cluster
        id: fetch
        uses: ./actions/fetch-hpc-tree
        with:
          site: hpc-batch
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          remote-dir: ${{ steps.push.outputs.remote-dir }}
          local-dir: ${{ runner.temp }}/hpc-e2e/back

      - name: Assert the round-trip
        shell: bash
        run: |
          set -euo pipefail
          diff -r "$RUNNER_TEMP/hpc-e2e/src" "$RUNNER_TEMP/hpc-e2e/back"
          echo "HPC round-trip OK"

      # Dogfood remove-hpc-tree exactly as a consumer would: last step, no `if:`,
      # so it runs only when the round-trip above succeeded and leaves the tree on
      # scratch for debugging if anything failed.
      - name: Remove the cluster scratch dir
        uses: ./actions/remove-hpc-tree
        with:
          site: hpc-batch
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
          remote-dir: ${{ steps.push.outputs.remote-dir }}

  hpc-submit:
    name: submit a SLURM job (${{ matrix.name }})
    # The transfer round-trip above proves ssh, $SCRATCH expansion and a writable
    # work dir. This proves the half the build path actually depends on and
    # nothing else covered: troika submits to the scheduler, the compute node
    # waits for the transfer marker, unpacks the shipped source, runs the recipe,
    # and the runner reads the sentinel back out of the job output.
    #
    # --no-publish keeps it a pure test: no S3 artifact is written, and the cache
    # short-circuit is skipped so it really runs every time. Artifact name is
    # unique per run+attempt, so a re-run never reattaches to a finished job; the
    # per-artifact trees it leaves under the work dir are what the nightly GC
    # sweeps.
    strategy:
      fail-fast: false
      # Two lanes for the same test. `arc` is an ARC pod that pulls the
      # internal-tools image, which is where the cluster ssh identity (keys, the
      # hpc-batch alias, known_hosts) lives — hence the registry credentials.
      # `hpc` is one of the pre-existing self-hosted runners labelled `hpc`:
      # those carry the same identity on the host and run NO container, so they
      # exercise the path that predates the ARC lane and prove these actions do
      # not quietly depend on something baked into the image.
      #
      # fail-fast off, because which lane broke is the whole signal: green `arc`
      # beside red `hpc` says "image-only assumption" out loud.
      matrix:
        include:
          - name: arc
            runner: arc-hpc-pet-vsphere-prod
            container: eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest
          - name: hpc
            runner: hpc
            container: ''
    runs-on: ${{ matrix.runner }}
    container:
      # An empty image runs the job on the host — that is what the `hpc` leg
      # wants, and the validator accepts it here.
      #
      # The credentials are NOT gated on the image, though the instinct is to.
      # `${{ matrix.container != '' && secrets.X || '' }}` fails template
      # validation on the hpc leg with "Unexpected value ''": an empty image is
      # allowed, an empty credentials username/password is not. So they are
      # passed unconditionally and are simply unused when there is no image to
      # pull — the secrets are always non-empty, which is all the validator wants.
      image: ${{ matrix.container }}
      credentials:
        username: ${{ secrets.ECCR_PULL_ROBOT_NAME }}
        password: ${{ secrets.ECCR_PULL_ROBOT_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main
        with:
          force-reinstall: true

      - uses: ./actions/require-environment-variable
        with:
          name: HPC_CI_REMOTE_WORK_DIR
        env:
          HPC_CI_REMOTE_WORK_DIR: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}

      - name: Seed a source tree and a trivial recipe
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hpc-submit/src"
          mkdir -p "$src/.ci/hpc"
          echo "$GITHUB_RUN_ID" > "$src/shipped.txt"
          # Resources are the smallest atos will schedule promptly: it selects on
          # QoS rather than partition. No sentinel echo — ci-infrastructure
          # appends that, and a recipe printing it itself would defeat the check.
          cat > "$src/.ci/hpc/smoke.sh" <<'RECIPE'
          #!/bin/bash
          #SBATCH --qos=nf
          #SBATCH --time=00:05:00
          #SBATCH --nodes=1
          #SBATCH --ntasks=1

          echo "ci-smoke: on $(hostname)"
          # The wrapper cds into the unpacked checkout, so the shipped file must
          # be here; asserting it makes a silent no-op transfer a failure.
          test -f shipped.txt
          test -n "$CI_INSTALL_PREFIX"
          mkdir -p "$CI_INSTALL_PREFIX"
          echo ok > "$CI_INSTALL_PREFIX/smoke.txt"
          RECIPE

      - name: Submit to SLURM and wait for the sentinel
        shell: bash
        env:
          HPC_CI_REMOTE_WORK_DIR: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}
          HPC_CI_SSH_USER: ${{ secrets.HPC_CI_SSH_USER }}
        run: |
          set -euo pipefail
          # Passed through verbatim: the spec is expanded on the cluster, so this
          # shell must not expand it first.
          "$CI_INFRASTRUCTURE_PYTHON" -u -m ci_infrastructure.hpc submit-wait \
            --site hpc-batch \
            --troika-user "$HPC_CI_SSH_USER" \
            --job-script "$RUNNER_TEMP/hpc-submit/src/.ci/hpc/smoke.sh" \
            --artifact-name "ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --remote-work-dir "$HPC_CI_REMOTE_WORK_DIR" \
            --local-install-path "$RUNNER_TEMP/hpc-submit/install" \
            --source-dir "$RUNNER_TEMP/hpc-submit/src" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --tar-dir "$RUNNER_TEMP/hpc-submit/tars" \
            --no-publish
