name: Default-branch status

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: default-branch-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-actions: read

      - uses: ./actions/ensure-infrastructure-present

      - shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: '"$CI_INFRASTRUCTURE_PYTHON" -I -u -m ci_infrastructure.default_branch_status'
