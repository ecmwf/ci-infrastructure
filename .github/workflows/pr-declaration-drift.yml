name: Contributor Declaration drift

# The declaration is vendored so editing ecmwf/.github cannot change every
# repo's merge rule at once; this job watches for the resulting drift.
on:
  schedule:
    # Weekly, off-the-hour to dodge the cron pileup, like hpc-nightly-cleanup.yml.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # gh api, not raw.githubusercontent.com: unauthenticated raw fetches 429.
      - name: Fetch the org pull request template
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/ecmwf/.github/contents/.github/PULL_REQUEST_TEMPLATE.md \
            -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/org-template.md"

      # The org template is a valid PR body, so the checker itself diagnoses any
      # drift (diverged, not-at-end, heading-missing).
      - name: Compare the vendored declaration against the org template
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m ci_infrastructure.check_pr_declaration \
            --body-file "$RUNNER_TEMP/org-template.md"
