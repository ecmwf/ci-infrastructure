name: S3 cleanup

# One-off: delete the oldest-written artifacts down to a share of current usage.
# A deleted artifact is rebuilt by the next consumer that needs it.
on:
  workflow_dispatch:
    inputs:
      percent:
        description: 'Share of current usage to keep'
        type: number
        default: 50
      dryrun:
        description: 'List what would be deleted without deleting'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: arc-runner-normal
    container:
      image: eccr.ecmwf.int/public-ci-images/ubuntu24.04-base:latest
    steps:
      - uses: ecmwf/ci-infrastructure/actions/announce-image@main

      - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main

      - name: Delete the oldest-written artifacts
        shell: bash
        env:
          ARTIFACT_S3_ENDPOINT: ${{ secrets.ARTIFACT_S3_ENDPOINT }}
          ARTIFACT_S3_REGION: ${{ secrets.ARTIFACT_S3_REGION }}
          ARTIFACT_S3_BUCKET: ${{ secrets.ARTIFACT_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PERCENT: ${{ inputs.percent }}
          DRYRUN: ${{ inputs.dryrun }}
        run: |
          set -euo pipefail
          args=(--percent "$PERCENT")
          if [ "$DRYRUN" = "true" ]; then args+=(--dryrun); fi
          "$CI_INFRASTRUCTURE_PYTHON" -I -u -m ci_infrastructure.s3_store gc "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
