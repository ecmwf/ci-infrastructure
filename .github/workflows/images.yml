name: Images

# Build and push the CI images under public-images/ (see public-images/README.md).
# An image is rebuilt exactly when scripts/build_image.py finds its tag missing
# from the registry, so there is no `paths:` filter or image list here. Pull
# requests push nothing.
on:
  workflow_call:
    # Named explicitly rather than taking `secrets: inherit` from the caller:
    # this is the one workflow that executes pull-request-authored Dockerfiles,
    # and it has no business seeing the AWS keys, the HPC SSH user or the
    # artifact-store credentials that inherit would also hand it.
    secrets:
      PUBLIC_ECCR_ROBOT_NAME:
        required: false
      PUBLIC_ECCR_ROBOT_TOKEN:
        required: false
      CI_PERMISSIONS_APP_CLIENT_ID:
        required: false
      CI_PERMISSIONS_APP_PRIVATE_KEY:
        required: false
  # Nightly, for the rolling platform only -- in effect, not by configuration.
  # A scheduled run discovers every image exactly as a push does; the pinned
  # platforms' tags are already in the registry and are skipped, while
  # a `rolling-*` platform carries a UTC date in its tag (build-image.sh), so
  # each night's tag is new and gets built. Nothing here names the rolling
  # images: that would be a second answer to "what needs rebuilding", which is
  # the one thing this workflow is built to avoid.
  #
  # 03:17 UTC: after the Arch mirrors' nightly churn has settled, and off the
  # hour, where scheduled workloads pile up on GitHub's runners.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: >
          Rebuild past the registry check: 'all', or space-separated
          <platform>/<variant> names. Empty means "only what is missing", which
          on an unchanged tree is a no-op. Use this for an upstream ubuntu:24.04
          CVE, or to restore a tag someone deleted by hand.
        default: ''
        required: false

concurrency:
  # Never cancel a run mid-push to the registry.
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  # Push for pushes to main; never for pull_request validation. Matched by prefix:
  # under pull_request_target github.ref is the base branch, i.e. main.
  PUSH: ${{ !startsWith(github.event_name, 'pull_request') && github.ref == 'refs/heads/main' }}
  DOCKER_BUILDKIT: "1"
  # 'false' validates only the bases on pull requests: faster, misses broken variants.
  VALIDATE_DEPENDENTS_ON_PR: 'true'

jobs:
  discover:
    # Not ubuntu-slim: imagetools needs docker. Anonymous reads, so no secrets.
    runs-on: ubuntu-latest
    outputs:
      base-matrix: ${{ steps.d.outputs.base-matrix }}
      dependent-matrix: ${{ steps.d.outputs.dependent-matrix }}
      base-in-set: ${{ steps.d.outputs.base-in-set }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0          # the tag is `git log` over the build inputs
          # PR-authored Dockerfiles build over the repo root, and .dockerignore
          # is editable by the PR: keep the token out of .git/config.
          persist-credentials: false
      - id: d
        env:
          MODE: ${{ (!startsWith(github.event_name, 'pull_request') && github.ref == 'refs/heads/main') && 'publish' || (env.VALIDATE_DEPENDENTS_ON_PR == 'true' && 'validate' || 'validate-bases') }}
          REBUILD: ${{ inputs.rebuild }}
        run: ./build-image.sh --discover --mode "$MODE" --rebuild "$REBUILD"

  build-base:
    needs: discover
    if: ${{ needs.discover.outputs.base-matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.base-matrix) }}
    name: build ${{ matrix.name }}
    env:
      IMAGE: ${{ matrix.name }}
      # Pin discover's tag: a rolling tag carries a UTC date that can change at midnight.
      IMAGE_TAG: ${{ matrix.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build ${{ matrix.name }}
        run: ./build-image.sh "$IMAGE"
      - name: Test ${{ matrix.name }}
        run: ./build-image.sh --test "$IMAGE"
      - name: Export for dependents
        if: ${{ matrix.export }}
        env:
          REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          docker save "$REF" | zstd -T0 -3 > "$RUNNER_TEMP/image.tar.zst"
      - if: ${{ matrix.export }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-${{ matrix.flat }}
          path: ${{ runner.temp }}/image.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Push ${{ matrix.name }}
        if: ${{ env.PUSH == 'true' }}
        env:
          # Only the publishing leg gets the push credentials, and only for this
          # step: nothing the image or the tests run can see them.
          PUBLIC_ECCR_ROBOT_NAME: ${{ secrets.PUBLIC_ECCR_ROBOT_NAME }}
          PUBLIC_ECCR_ROBOT_TOKEN: ${{ secrets.PUBLIC_ECCR_ROBOT_TOKEN }}
        # The tag is a function of committed content, so publish only a clean tree.
        run: ./build-image.sh --push-built "$IMAGE" --require-clean

  build-dependents:
    needs: [discover, build-base]
    # One broken base must not hold back every platform; a dependent whose base
    # failed has no artifact to load and fails there.
    if: ${{ !cancelled()
            && needs.discover.result == 'success'
            && needs.discover.outputs.dependent-matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.dependent-matrix) }}
    name: build ${{ matrix.name }}
    env:
      IMAGE: ${{ matrix.name }}
      IMAGE_TAG: ${{ matrix.tag }}
      # Set when the base was rebuilt in this run; empty means the published
      # :latest is current and is what the dependent builds on.
      BASE_IMAGE: ${{ matrix.base_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: ${{ matrix.base_ref != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-${{ matrix.base }}
          path: ${{ runner.temp }}/base
      - name: Load base ${{ matrix.base }}
        if: ${{ matrix.base_ref != '' }}
        run: |
          set -euo pipefail
          zstd -dc "$RUNNER_TEMP/base/image.tar.zst" | docker load
          docker image inspect "$BASE_IMAGE" >/dev/null
      - name: Build ${{ matrix.name }}
        run: ./build-image.sh "$IMAGE"
      - name: Test ${{ matrix.name }}
        run: ./build-image.sh --test "$IMAGE"
      - name: Push ${{ matrix.name }}
        if: ${{ env.PUSH == 'true' }}
        env:
          PUBLIC_ECCR_ROBOT_NAME: ${{ secrets.PUBLIC_ECCR_ROBOT_NAME }}
          PUBLIC_ECCR_ROBOT_TOKEN: ${{ secrets.PUBLIC_ECCR_ROBOT_TOKEN }}
        run: ./build-image.sh --push-built "$IMAGE" --require-clean

  # The private images in ecmwf/ci-container-images FROM our base and rebuild on
  # any trigger, so a bare dispatch is enough.
  notify-container-images:
    needs: [discover, build-base, build-dependents]
    if: ${{ !cancelled()
            && !startsWith(github.event_name, 'pull_request')
            && github.ref == 'refs/heads/main'
            && needs.discover.outputs.base-in-set == 'true'
            && needs.build-base.result == 'success'
            && (needs.build-dependents.result == 'success' || needs.build-dependents.result == 'skipped') }}
    runs-on: ubuntu-slim
    steps:
      # github.token cannot dispatch into another repo.
      - id: mint
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ci-container-images
          permission-actions: write
      - name: Dispatch the private image rebuild
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          set -euo pipefail
          gh workflow run build-image.yml --repo ecmwf/ci-container-images --ref main
          url="https://github.com/ecmwf/ci-container-images/actions/workflows/build-image.yml"
          echo "::notice title=Private image rebuild dispatched::the public base moved — $url"
          {
            echo "### Private image rebuild dispatched"
            echo
            echo "The public base was republished, so \`ecmwf/ci-container-images\` was asked to"
            echo "rebuild against the new base digest."
            echo
            echo "[Watch the build]($url)"
          } >> "$GITHUB_STEP_SUMMARY"
