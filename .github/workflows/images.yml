name: Images

# Build and push the CI images under public-images/ (see public-images/README.md).
# An image is rebuilt exactly when scripts/build_image.py finds its tag missing
# from the registry, so there is no `paths:` filter or image list here. Pull
# requests push nothing: the build jobs only reach the scratch registry, and the
# push job, which runs no Dockerfile, holds the public robot in the `main`-only
# environment `eccr-push`.
on:
  workflow_call:
    # Named, not `secrets: inherit`: this workflow runs PR-authored Dockerfiles
    # and must not see the other credentials.
    secrets:
      SCRATCH_ECCR_ROBOT_NAME:
        required: false
      SCRATCH_ECCR_ROBOT_TOKEN:
        required: false
      CI_DISPATCHER_APP_CLIENT_ID:
        required: false
      CI_DISPATCHER_APP_PRIVATE_KEY:
        required: false
      # Never passed: the push job reads them from its environment `eccr-push`,
      # which wins over these. Declared so linters know the names.
      PUBLIC_ECCR_ROBOT_NAME:
        required: false
      PUBLIC_ECCR_ROBOT_TOKEN:
        required: false
    inputs:
      dependents:
        description: 'On a pull request, also build the images whose base it rebuilds.'
        type: boolean
        default: false
  # Nightly rebuilds only `rolling-*` in effect: their tag carries the UTC date,
  # every other tag is already in the registry. 03:17: after the Arch mirrors
  # settle, and off the hour.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: >
          Rebuild past the registry check: 'all', or space-separated
          <platform>/<variant> names. Empty means "only what is missing", which
          on an unchanged tree is a no-op. Use this for an upstream ubuntu:24.04
          CVE, or to restore a tag someone deleted by hand.
        default: ''
        required: false

concurrency:
  # Never cancel a run mid-push; a pull request pushes nothing.
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  DOCKER_BUILDKIT: "1"

jobs:
  discover:
    # Anonymous reads, so no secrets.
    runs-on: ubuntu-latest
    outputs:
      base-matrix: ${{ steps.d.outputs.base-matrix }}
      dependent-matrix: ${{ steps.d.outputs.dependent-matrix }}
      base-in-set: ${{ steps.d.outputs.base-in-set }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0          # the tag is `git log` over the build inputs
          # PR-authored Dockerfiles build over the repo root, and .dockerignore
          # is editable by the PR: keep the token out of .git/config.
          persist-credentials: false
      - id: d
        env:
          MODE: ${{ (!startsWith(github.event_name, 'pull_request') && github.ref == 'refs/heads/main') && 'publish' || (inputs.dependents && 'validate' || 'validate-bases') }}
          REBUILD: ${{ inputs.rebuild }}
          # A pull request tests only the dependents it changes; main publishes the rest.
          SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: ./build-image.sh --discover --mode "$MODE" --rebuild "$REBUILD" ${SINCE:+--since "$SINCE"}

  build-base:
    needs: discover
    if: ${{ needs.discover.outputs.base-matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.base-matrix) }}
    name: build ${{ matrix.name }}
    env:
      IMAGE: ${{ matrix.name }}
      # Pin discover's tag: a rolling tag carries a UTC date that can change at midnight.
      IMAGE_TAG: ${{ matrix.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build ${{ matrix.name }}
        run: ./build-image.sh "$IMAGE"
      - name: Test ${{ matrix.name }}
        run: ./build-image.sh --test "$IMAGE"
      # Through the scratch registry rather than an Actions artifact: unchanged
      # layers are not uploaded again, and nothing counts against Actions storage.
      # Only a tested image gets here, so that is all the push job can publish.
      - name: Hand ${{ matrix.name }} to its dependents and the push job
        if: ${{ matrix.export || env.PUSH == 'true' }}
        env:
          REF: ${{ matrix.ref }}
          SCRATCH: ${{ vars.SCRATCH_REGISTRY }}/run-${{ github.run_id }}/${{ matrix.flat }}:built
          SCRATCH_ECCR_ROBOT_NAME: ${{ secrets.SCRATCH_ECCR_ROBOT_NAME }}
          SCRATCH_ECCR_ROBOT_TOKEN: ${{ secrets.SCRATCH_ECCR_ROBOT_TOKEN }}
          FLAT: ${{ matrix.flat }}
        run: |
          set -euo pipefail
          printf '%s' "$SCRATCH_ECCR_ROBOT_TOKEN" | docker login "${SCRATCH%%/*}" -u "$SCRATCH_ECCR_ROBOT_NAME" --password-stdin
          docker tag "$REF" "$SCRATCH"
          docker push "$SCRATCH"
          docker logout "${SCRATCH%%/*}"
          # Pull requests can write to the scratch registry too, so the push job
          # takes the digest pushed here, from this run's artifacts, not the tag.
          mkdir -p handoff
          docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$SCRATCH" \
            | grep -m1 "^${SCRATCH%:*}@" > "handoff/$FLAT"
      - if: ${{ matrix.export || env.PUSH == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: handoff-${{ matrix.flat }}
          path: handoff/${{ matrix.flat }}
          retention-days: 1
          overwrite: true

  build-dependents:
    needs: [discover, build-base]
    # One broken base must not hold back every platform; a dependent whose base
    # failed has nothing to pull and fails there.
    if: ${{ !cancelled()
            && needs.discover.result == 'success'
            && needs.discover.outputs.dependent-matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.dependent-matrix) }}
    name: build ${{ matrix.name }}
    env:
      IMAGE: ${{ matrix.name }}
      IMAGE_TAG: ${{ matrix.tag }}
      # Set when the base was rebuilt in this run; empty means the published
      # :latest is current and is what the dependent builds on.
      BASE_IMAGE: ${{ matrix.base_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: ${{ matrix.base_ref != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: handoff-${{ matrix.base }}
          path: handoff
      # The scratch project is public: pulling needs no credentials. By the digest
      # the base's build job recorded, since pull requests can write there too.
      - name: Load base ${{ matrix.base }}
        if: ${{ matrix.base_ref != '' }}
        env:
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          built=$(cat "handoff/$BASE")
          docker pull "$built"
          docker tag "$built" "$BASE_IMAGE"
          docker image inspect "$BASE_IMAGE" >/dev/null
      - name: Build ${{ matrix.name }}
        run: ./build-image.sh "$IMAGE"
      - name: Test ${{ matrix.name }}
        run: ./build-image.sh --test "$IMAGE"
      - name: Hand ${{ matrix.name }} to the push job
        if: ${{ env.PUSH == 'true' }}
        env:
          REF: ${{ matrix.ref }}
          SCRATCH: ${{ vars.SCRATCH_REGISTRY }}/run-${{ github.run_id }}/${{ matrix.flat }}:built
          SCRATCH_ECCR_ROBOT_NAME: ${{ secrets.SCRATCH_ECCR_ROBOT_NAME }}
          SCRATCH_ECCR_ROBOT_TOKEN: ${{ secrets.SCRATCH_ECCR_ROBOT_TOKEN }}
          FLAT: ${{ matrix.flat }}
        run: |
          set -euo pipefail
          printf '%s' "$SCRATCH_ECCR_ROBOT_TOKEN" | docker login "${SCRATCH%%/*}" -u "$SCRATCH_ECCR_ROBOT_NAME" --password-stdin
          docker tag "$REF" "$SCRATCH"
          docker push "$SCRATCH"
          docker logout "${SCRATCH%%/*}"
          # Pull requests can write to the scratch registry too, so the push job
          # takes the digest pushed here, from this run's artifacts, not the tag.
          mkdir -p handoff
          docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$SCRATCH" \
            | grep -m1 "^${SCRATCH%:*}@" > "handoff/$FLAT"
      - if: ${{ env.PUSH == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: handoff-${{ matrix.flat }}
          path: handoff/${{ matrix.flat }}
          retention-days: 1
          overwrite: true

  # The only job with the public robot: it runs no Dockerfile and checks out
  # nothing, and copies from the scratch registry only the digests the build jobs
  # of this run tested and recorded.
  # Bases come first, so a dependent never lands before its base.
  push:
    needs: [discover, build-base, build-dependents]
    if: ${{ !cancelled()
            && needs.discover.result == 'success'
            && !startsWith(github.event_name, 'pull_request')
            && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: eccr-push
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: handoff-*
          path: handoff
          merge-multiple: true
      - name: Push the tested images
        env:
          BASE_MATRIX: ${{ needs.discover.outputs.base-matrix }}
          DEPENDENT_MATRIX: ${{ needs.discover.outputs.dependent-matrix }}
          PUBLIC_ECCR_ROBOT_NAME: ${{ secrets.PUBLIC_ECCR_ROBOT_NAME }}
          PUBLIC_ECCR_ROBOT_TOKEN: ${{ secrets.PUBLIC_ECCR_ROBOT_TOKEN }}
        run: |
          set -euo pipefail
          images=$(jq -rn --argjson b "$BASE_MATRIX" --argjson d "$DEPENDENT_MATRIX" \
            '($b.include + $d.include)[] | "\(.flat) \(.ref)"')
          [ -n "$images" ] || exit 0
          registry="${images#* }"; registry="${registry%%/*}"
          printf '%s' "$PUBLIC_ECCR_ROBOT_TOKEN" | docker login "$registry" -u "$PUBLIC_ECCR_ROBOT_NAME" --password-stdin
          while read -r flat ref; do
            if [ ! -s "handoff/$flat" ]; then
              echo "::warning::$ref failed to build or test in this run; not pushed"
              continue
            fi
            built=$(cat "handoff/$flat")
            docker pull -q "$built" >/dev/null
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "::notice::$ref already exists; not pushed"
              continue
            fi
            docker tag "$built" "$ref"
            docker tag "$built" "${ref%:*}:latest"
            docker push -q "$ref"
            docker push -q "${ref%:*}:latest"
            echo "::notice::pushed $ref and ${ref%:*}:latest"
          done <<<"$images"
          docker logout "$registry"

  # After a green or cancelled run: a failed one keeps its bases for re-running the
  # failed jobs. The scratch project's retention rule removes whatever is left.
  # Each run has repositories of its own, so deleting them cannot touch another run's.
  delete-scratch-images:
    needs: [discover, build-base, build-dependents, push]
    if: ${{ always()
            && needs.discover.result == 'success'
            && (cancelled()
                || (needs.build-base.result == 'success'
                    && (needs.build-dependents.result == 'success' || needs.build-dependents.result == 'skipped')
                    && (needs.push.result == 'success' || needs.push.result == 'skipped'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete this run's bases from the scratch registry
        env:
          SCRATCH_REGISTRY: ${{ vars.SCRATCH_REGISTRY }}
          BASE_MATRIX: ${{ needs.discover.outputs.base-matrix }}
          DEPENDENT_MATRIX: ${{ needs.discover.outputs.dependent-matrix }}
          RUN: run-${{ github.run_id }}
          SCRATCH_ECCR_ROBOT_NAME: ${{ secrets.SCRATCH_ECCR_ROBOT_NAME }}
          SCRATCH_ECCR_ROBOT_TOKEN: ${{ secrets.SCRATCH_ECCR_ROBOT_TOKEN }}
        run: |
          set -euo pipefail
          host="${SCRATCH_REGISTRY%%/*}"
          project="${SCRATCH_REGISTRY#*/}"
          # What the build jobs handed off: exported bases, and on main every image.
          for image in $(jq -rn --argjson b "$BASE_MATRIX" --argjson d "$DEPENDENT_MATRIX" --argjson push "$PUSH" \
                           '($b.include[] | select(.export or $push)), ($d.include[] | select($push)) | .flat'); do
            # Harbor wants the slash in a repository name encoded twice.
            curl -fsS -X DELETE -u "$SCRATCH_ECCR_ROBOT_NAME:$SCRATCH_ECCR_ROBOT_TOKEN" \
              "https://$host/api/v2.0/projects/$project/repositories/$RUN%252F$image" \
              || echo "::warning::could not delete $SCRATCH_REGISTRY/$RUN/$image; the retention rule will"
          done

  # For pinning by digest, e.g. in an org variable read with fromJSON.
  latest-digests:
    needs: [build-base, build-dependents]
    if: ${{ !cancelled()
            && !startsWith(github.event_name, 'pull_request')
            && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Print the digest of every :latest
        run: |
          set -euo pipefail
          api="https://eccr.ecmwf.int/api/v2.0/projects/public-ci-images/repositories"
          names=""
          page=1
          while :; do
            page_names=$(curl -fsS "$api?page_size=100&page=$page" | jq -r '.[].name | sub("^public-ci-images/"; "")')
            [ -n "$page_names" ] || break
            names+="$page_names"$'\n'
            page=$((page + 1))
          done
          json=$(for name in $names; do
            if digest=$(curl -fsS "$api/$name/artifacts/latest" 2>/dev/null | jq -r .digest); then
              printf '%s\t%s\n' "$name" "$digest"
            else
              echo "::warning::no :latest for $name" >&2
            fi
          done | jq -RnS '[inputs | split("\t") | {(.[0]): .[1]}] | add // {}')
          echo "$json"
          printf '### Digests of :latest\n\n~~~json\n%s\n~~~\n' "$json" >> "$GITHUB_STEP_SUMMARY"

  # The private images in ecmwf/ci-container-images FROM our base and rebuild on
  # any trigger, so a bare dispatch is enough.
  notify-container-images:
    needs: [discover, build-base, build-dependents, push]
    if: ${{ !cancelled()
            && !startsWith(github.event_name, 'pull_request')
            && github.ref == 'refs/heads/main'
            && needs.discover.outputs.base-in-set == 'true'
            && needs.build-base.result == 'success'
            && (needs.build-dependents.result == 'success' || needs.build-dependents.result == 'skipped')
            && needs.push.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # github.token cannot dispatch into another repo.
      - id: mint
        uses: ecmwf/ci-infrastructure/actions/mint-token@main
        with:
          client-id: ${{ secrets.CI_DISPATCHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_DISPATCHER_APP_PRIVATE_KEY }}
          repositories: ci-container-images
          permissions: actions:write
      - name: Dispatch the private image rebuild
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          set -euo pipefail
          gh workflow run build-image.yml --repo ecmwf/ci-container-images --ref main
          url="https://github.com/ecmwf/ci-container-images/actions/workflows/build-image.yml"
          echo "::notice title=Private image rebuild dispatched::the public base moved — $url"
          {
            echo "### Private image rebuild dispatched"
            echo
            echo "The public base was republished, so \`ecmwf/ci-container-images\` was asked to"
            echo "rebuild against the new base digest."
            echo
            echo "[Watch the build]($url)"
          } >> "$GITHUB_STEP_SUMMARY"
