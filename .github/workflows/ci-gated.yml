# Placeholder: one central ci-approval gate for several workflow files.
#
# This is the only file with pull request triggers. The lanes it runs
# (placeholder-ci.yml, try-integration-test-gating.yml) only have
# `on: workflow_call`, so every lane hangs off the same gate and one
# 'test-approved-for-ci' label is spent exactly once, for all of them. A gate in each
# file would not work: every gate fires on the same label event, the first one
# deletes the label and the others fail as "not approved".
#
#   test-ci-approval --+--> unit-tests         (placeholder-ci.yml)
#                      |
#                      +--> integration-tests  (try-integration-test-gating.yml,
#                                               only with 'run-expensive-tests')
#
# Keep pull request triggers out of the lane files, and call them from nowhere
# else: the check-ci-approval hook does not see who calls a reusable workflow.

name: Gated CI (placeholder)

on:
  # Every pull request event, pushes included, goes through pull_request_target.
  # A single event type means one `test-ci-approval (pull_request_target)` check per
  # commit: a fork push shows it red ("new commits need a fresh approval") and
  # the approval label's run replaces it with green. A `pull_request` push check
  # would stay red beside it and block a required `test-ci-approval` check. It also
  # gives the gate a write token on pushes, so it can revoke an unspent label.
  #
  # A branch in this repository passes the gate as same-repo; a fork needs the
  # approval label.
  #
  # pull_request_target runs this file AND the `./` lanes from the default
  # branch, so a pull request never exercises its own changes to them.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  # Testing changes to this file or the lanes: run it on the branch, e.g.
  #   gh workflow run ci-gated.yml --ref <branch>
  # The caller and its `./` lanes then come from that branch. Not a pull request
  # event, so the gate passes as not-a-pull-request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A separate 'test-approved-for-ci' label while trying this out: smoke-test-hpc.yml
  # has its own gate on 'approved-for-ci', and two gates spending the same label on
  # the same label event race -- one deletes it, the other fails with "could not
  # remove the approval label".
  #
  # Same-repo pull requests and non-PR events pass; a fork needs
  # 'test-approved-for-ci', which this spends. Label events only count for the two
  # labels that matter, so adding e.g. 'documentation' starts nothing.
  # Named apart from smoke-test-hpc.yml's `ci-approval`, so a ruleset can require
  # this gate's check on its own.
  test-ci-approval:
    if: ${{ github.event.action != 'labeled' || contains(fromJSON('["run-expensive-tests", "test-approved-for-ci"]'), github.event.label.name) }}
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write   # only so the label can be spent or revoked
    steps:
      - uses: ecmwf/ci-infrastructure/actions/require-ci-approval@main
        with:
          label: test-approved-for-ci

  unit-tests:
    needs: test-ci-approval
    uses: ./.github/workflows/placeholder-ci.yml
    secrets: inherit

  integration-tests:
    needs: test-ci-approval
    # Opt-in on top of the approval: a skip here skips the whole called workflow.
    if: ${{ !github.event.pull_request || contains(github.event.pull_request.labels.*.name, 'run-expensive-tests') }}
    uses: ./.github/workflows/try-integration-test-gating.yml
    secrets: inherit
