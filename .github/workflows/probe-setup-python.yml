name: Probe setup-python on self-hosted runners

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: Version to ask setup-python and uv for
        required: false
        default: '3.11'
      probe-uv:
        description: Also probe uv ('true'/'false')
        required: false
        default: 'true'
      probe-pip-install:
        description: Also venv + pip install this checkout ('true'/'false')
        required: false
        default: 'true'

jobs:
  probe:
    name: probe (hpc)
    runs-on: [hpc]
    timeout-minutes: 30
    steps:
      - name: Host baseline
        shell: bash
        run: |
          set -euo pipefail
          hostname
          cat /etc/os-release 2>/dev/null || true
          ldd --version 2>&1 | head -1 || true
          for cand in python3 python3.9 python3.10 python3.11 python3.12 python3.13; do
            if p="$(command -v "$cand" 2>/dev/null)"; then
              echo "$cand -> $p : $("$p" --version 2>&1)"
            else
              echo "$cand -> (absent)"
            fi
          done
          echo "CI_INFRASTRUCTURE_PYTHON=${CI_INFRASTRUCTURE_PYTHON:-<unset>}"
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-<unset>}"

      - id: setup_python
        continue-on-error: true
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: setup-python verdict
        shell: bash
        env:
          SETUP_OUTCOME: ${{ steps.setup_python.outcome }}
          SETUP_PATH: ${{ steps.setup_python.outputs.python-path }}
        run: |
          set -euo pipefail
          echo "outcome: $SETUP_OUTCOME"
          echo "path: ${SETUP_PATH:-<none>}"
          echo "pythonLocation=${pythonLocation:-<unset>}"
          if [ "$SETUP_OUTCOME" != "success" ]; then
            echo "::warning::setup-python failed"
            exit 0
          fi
          python --version
          python -c 'import sys, ssl, sqlite3, ctypes, lzma, venv, tomllib; print(sys.executable, ssl.OPENSSL_VERSION)'

      - name: uv
        if: inputs.probe-uv == 'true'
        continue-on-error: true
        shell: bash
        env:
          WANT_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          export UV_INSTALL_DIR="$RUNNER_TEMP/uv-probe/bin"
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/uv-probe/pythons"
          export UV_CACHE_DIR="$RUNNER_TEMP/uv-probe/cache"
          mkdir -p "$UV_INSTALL_DIR" "$UV_PYTHON_INSTALL_DIR" "$UV_CACHE_DIR"
          curl -fsSL --max-time 120 https://astral.sh/uv/install.sh | env INSTALLER_NO_MODIFY_PATH=1 sh
          export PATH="$UV_INSTALL_DIR:$PATH"
          uv --version
          uv python install "$WANT_VERSION"
          py="$(uv python find "$WANT_VERSION")"
          "$py" --version
          "$py" -c 'import ssl, tomllib; print(ssl.OPENSSL_VERSION)'

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: inputs.probe-pip-install == 'true'

      - name: venv + pip install
        if: inputs.probe-pip-install == 'true'
        continue-on-error: true
        shell: bash
        env:
          SETUP_OUTCOME: ${{ steps.setup_python.outcome }}
          WANT_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          py=""
          if [ "$SETUP_OUTCOME" = "success" ] && command -v python >/dev/null 2>&1 \
             && python -c 'import sys; sys.exit(0 if sys.version_info >= (3,11) else 1)' 2>/dev/null; then
            py="$(command -v python)"
          elif [ -x "$RUNNER_TEMP/uv-probe/bin/uv" ] \
               && py="$("$RUNNER_TEMP/uv-probe/bin/uv" python find "$WANT_VERSION" 2>/dev/null)"; then
            :
          else
            echo "::warning::no >=3.11 interpreter to build a venv from"
            exit 0
          fi
          echo "using $py"
          venv="$RUNNER_TEMP/probe-venv"
          rm -rf "$venv"
          "$py" -m venv "$venv"
          "$venv/bin/pip" install --no-input --timeout 60 --retries 2 --disable-pip-version-check .
          "$venv/bin/python" -c 'import ci_infrastructure.hpc.orchestrate; print("ci_infrastructure imports")'
