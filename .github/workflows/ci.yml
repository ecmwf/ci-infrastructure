name: CI

on:
  # push scoped to main so a branch with an open PR runs the pull_request copy
  # only, not a redundant second push run.
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    # Lint hooks need a CPU and a Python, nothing else — ubuntu-slim is the cheap
    # 1-CPU ARC runner.
    runs-on: ubuntu-slim
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./actions/pre-commit

  mypy_and_tests:
    needs: pre-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range, so requires-python is a tested claim
        # rather than an assertion. Bump the floor here and in pyproject together.
        python-version: ["3.11", "3.12"]
    name: mypy + pytest (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Mypy
        run: mypy src/ tests/
      - name: pytest
        run: pytest

  # Build and publish the container images under public-images/. Gated behind the
  # tests via `needs:` rather than given its own `on: push`, so the registry is
  # never touched by a commit whose tests are red -- a separate workflow could
  # only express that with workflow_run, which TODOs already records as a trap.
  #
  # The images live in this repo, so an image's tag is a function of this repo's
  # committed content and images.yml owns that answer.
  images:
    needs: mypy_and_tests
    uses: ./.github/workflows/images.yml
    # Not `inherit`: images.yml is the only workflow here that runs a
    # pull-request-authored Dockerfile, so it gets the four secrets it uses and
    # none of the other ten (AWS keys, HPC SSH user, artifact store, ...).
    secrets:
      PUBLIC_ECCR_ROBOT_NAME: ${{ secrets.PUBLIC_ECCR_ROBOT_NAME }}
      PUBLIC_ECCR_ROBOT_TOKEN: ${{ secrets.PUBLIC_ECCR_ROBOT_TOKEN }}
      CI_PERMISSIONS_APP_CLIENT_ID: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
      CI_PERMISSIONS_APP_PRIVATE_KEY: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}
