name: CI

on:
  # push scoped to main so a branch with an open PR runs the pull_request copy
  # only, not a redundant second push run.
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-slim
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./actions/pre-commit

  mypy_and_tests:
    needs: pre-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The requires-python floor (bump with pyproject) and every interpreter an
        # image bakes as CI_INFRASTRUCTURE_PYTHON.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    name: mypy + pytest (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Mypy
        run: mypy src/ tests/ scripts/
      - name: pytest
        run: pytest

  # Gated on the tests, so a red commit never touches the registry.
  images:
    needs: mypy_and_tests
    uses: ./.github/workflows/images.yml
    # Only the secrets images.yml uses: it runs PR-authored Dockerfiles.
    secrets:
      PUBLIC_ECCR_ROBOT_NAME: ${{ secrets.PUBLIC_ECCR_ROBOT_NAME }}
      PUBLIC_ECCR_ROBOT_TOKEN: ${{ secrets.PUBLIC_ECCR_ROBOT_TOKEN }}
      CI_PERMISSIONS_APP_CLIENT_ID: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
      CI_PERMISSIONS_APP_PRIVATE_KEY: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}
