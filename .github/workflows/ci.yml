name: CI

on:
  # push scoped to main so a branch with an open PR runs the pull_request copy
  # only, not a redundant second push run.
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-slim
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  mypy_and_tests:
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Mypy
        run: mypy src/ tests/
      - name: pytest
        run: pytest

  # Keep the container images' baked ci-infrastructure current. Since
  # ensure-infrastructure-present now REFUSES a baked copy that does not match the
  # checkout, a stale image is a hard failure for every consumer using it -- so the
  # images have to follow main automatically rather than when someone remembers.
  #
  # Only the pin bump moves an image's identity, and only ci-container-images can
  # commit its own pin, so we dispatch and it does the rest. That also keeps write
  # access to that repo inside that repo: this job needs nothing but actions:write.
  rebuild-container-images:
    needs: mypy_and_tests
    # Pushes to main only. A pull request must never touch the registry, and the
    # commit has to exist on main before an image can be pinned to it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2          # enough to diff this push against its parent
          persist-credentials: false

      # A docs- or workflow-only merge changes nothing that gets installed, and an
      # image build is not free. Anything that lands in the image is under src/ or
      # is declared in pyproject.toml, so those two paths are the whole test.
      - id: changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD~1 HEAD -- src pyproject.toml | grep -q .; then
            echo "install-surface-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "install-surface-changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no change under src/ or pyproject.toml — leaving the container images alone"
          fi

      # github.token is scoped to this repo and cannot dispatch into another, so
      # mint a short-lived installation token, narrowed to actions:write. Same
      # pattern as actions/resolve-deps.
      - id: mint
        if: steps.changed.outputs.install-surface-changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ci-container-images
          permission-actions: write

      - name: Dispatch the image rebuild
        if: steps.changed.outputs.install-surface-changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          set -euo pipefail
          # --ref main so the dispatched run pushes: docker-images.yml gates
          # pushing on github.ref == refs/heads/main.
          gh workflow run docker-images.yml \
            --repo ecmwf/ci-container-images \
            --ref main \
            -f ci-infrastructure-ref="$GITHUB_SHA"
          url="https://github.com/ecmwf/ci-container-images/actions/workflows/docker-images.yml"
          echo "::notice title=Container image rebuild dispatched::ci-infrastructure-ref=$GITHUB_SHA — $url"
          {
            echo "### Container image rebuild dispatched"
            echo
            echo "Pinning \`ecmwf/ci-container-images\` to \`$GITHUB_SHA\`."
            echo
            echo "[Watch the build]($url)"
          } >> "$GITHUB_STEP_SUMMARY"
