name: CI

on:
  # push scoped to main so a branch with an open PR runs the pull_request copy
  # only, not a redundant second push run.
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer commit of a pull request cancels its older run. Any other run gets a
  # group of its own, so a main run, which pushes images, is never cancelled or queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-slim
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./actions/pre-commit

  mypy_and_tests:
    needs: pre-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The requires-python floor (bump with pyproject) and every interpreter an
        # image bakes as CI_INFRASTRUCTURE_PYTHON.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    name: mypy + pytest (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Mypy
        run: mypy src/ tests/ scripts/
      - name: pytest
        run: pytest

  # On a pull request, the label test-dependent-images also builds the images on the bases it rebuilds;
  # pr-label-images.yml keeps the decision pending. Read live, so a re-run after labelling picks it up.
  image-label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      dependents: ${{ steps.label.outputs.dependents }}
    steps:
      - id: label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
          echo "dependents=$(grep -qx test-dependent-images <<< "$labels" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Gated on the tests, so a red commit never touches the registry.
  images:
    needs: [mypy_and_tests, image-label]
    if: ${{ !cancelled() && needs.mypy_and_tests.result == 'success' && needs.image-label.result != 'failure' }}
    uses: ./.github/workflows/images.yml
    with:
      dependents: ${{ needs.image-label.outputs.dependents == 'true' }}
    # Only the secrets images.yml uses: it runs PR-authored Dockerfiles.
    secrets:
      PUBLIC_ECCR_ROBOT_NAME: ${{ secrets.PUBLIC_ECCR_ROBOT_NAME }}
      PUBLIC_ECCR_ROBOT_TOKEN: ${{ secrets.PUBLIC_ECCR_ROBOT_TOKEN }}
      SCRATCH_ECCR_ROBOT_NAME: ${{ secrets.SCRATCH_ECCR_ROBOT_NAME }}
      SCRATCH_ECCR_ROBOT_TOKEN: ${{ secrets.SCRATCH_ECCR_ROBOT_TOKEN }}
      CI_PERMISSIONS_APP_CLIENT_ID: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
      CI_PERMISSIONS_APP_PRIVATE_KEY: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}

  # The one required check of this workflow, so the ruleset never lists matrix legs.
  ci-result:
    if: always()
    needs: [images]
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./actions/ci-result
        with:
          needs: ${{ toJSON(needs) }}
