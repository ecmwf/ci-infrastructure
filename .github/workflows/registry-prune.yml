name: Registry prune

# Nightly it deletes all but the two newest versions per repository, keeping the
# project under its quota. Dispatched, it only reports unless `delete` is ticked.
on:
  # 02:47 UTC: before images.yml's nightly build (03:17), so its pushes have room.
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      delete:
        description: 'Delete the stale versions as well as reporting them'
        type: boolean
        default: false
      keep:
        description: 'Versions to keep per repository'
        type: number
        default: 2

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prune
        shell: bash
        env:
          # Only needed for --delete; the listing is anonymous.
          PUBLIC_ECCR_CLEANUP_ROBOT_NAME: ${{ secrets.PUBLIC_ECCR_CLEANUP_ROBOT_NAME }}
          PUBLIC_ECCR_CLEANUP_ROBOT_TOKEN: ${{ secrets.PUBLIC_ECCR_CLEANUP_ROBOT_TOKEN }}
          # A scheduled run has no inputs: it deletes, keeping the default.
          DELETE: ${{ github.event_name == 'schedule' || inputs.delete }}
          KEEP: ${{ inputs.keep || 2 }}
        run: |
          set -euo pipefail
          args=(--format md --keep "$KEEP")
          if [ "$DELETE" = "true" ]; then
            args+=(--delete)
          fi
          python3 scripts/registry_prune.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
