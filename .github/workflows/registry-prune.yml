name: Registry prune

# images.yml already prunes after every publish on main; this is for a one-off,
# e.g. a different --keep or a look at what would go.
on:
  workflow_dispatch:
    inputs:
      delete:
        description: 'Delete the stale versions as well as reporting them'
        type: boolean
        default: false
      keep:
        description: 'Versions to keep per repository'
        type: number
        default: 2

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prune
        shell: bash
        env:
          # Only needed for --delete; the listing is anonymous.
          PUBLIC_ECCR_ROBOT_NAME: ${{ secrets.PUBLIC_ECCR_ROBOT_NAME }}
          PUBLIC_ECCR_ROBOT_TOKEN: ${{ secrets.PUBLIC_ECCR_ROBOT_TOKEN }}
          DELETE: ${{ inputs.delete }}
          KEEP: ${{ inputs.keep }}
        run: |
          set -euo pipefail
          args=(--format md --keep "$KEEP")
          if [ "$DELETE" = "true" ]; then
            args+=(--delete)
          fi
          python3 scripts/registry_prune.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
