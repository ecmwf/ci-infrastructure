name: Smoke test runners

# One-shot smoke test: proves a job can be scheduled on each ARC scale set
# (arc-runner-normal / -large / -very-large) running the public base image, so
# the downstream CI can be repointed at them with confidence. Run it manually
# from the Actions tab. Requires the pull-only eccr robot secrets
# (ECCR_PULL_ROBOT_NAME / ECCR_PULL_ROBOT_TOKEN).
#
# It also probes the object store from each scale set, because artifact
# publish/fetch and sccache both depend on egress plus a credential that is
# valid for that particular store. Those come from secrets, never from
# defaults, so a wrong endpoint or a key issued against another store fails
# here instead of halfway through a downstream build:
#
#   ARTIFACT_S3_ENDPOINT   object store URL, shared by artifacts and sccache
#   AWS_ACCESS_KEY_ID      credential valid for THAT endpoint
#   AWS_SECRET_ACCESS_KEY
#   ARTIFACT_S3_BUCKET     artifact bucket, probed when set
#   SCCACHE_BUCKET         sccache bucket, probed when set
#   ARTIFACT_S3_REGION     optional, defaults to RegionOne
#
# At least one of the two buckets must be set, and the two must name DIFFERENT
# buckets: artifacts and sccache are orthogonal uses that merely share a store,
# and the probe prints a fingerprint per bucket so a shared value is visible at
# a glance. All but SCCACHE_BUCKET are names s3_store itself reads, so the env
# block below is a straight passthrough and the same names work when running
# scripts/probe_object_store.py by hand.
#
# The second job compiles a small C++ project through sccache and proves the
# result came back from the bucket rather than from a local cache. Its logic
# lives in scripts/probe_sccache.py, not in this file, so it can be run by hand
# the same way.
on:
  workflow_dispatch:

jobs:
  smoke:
    permissions:
        contents: read
        id-token: write

    strategy:
      # Report every scale set; one failing leg must not mask the others.
      fail-fast: false
      matrix:
        runner: [arc-runner-normal, arc-runner-large, arc-runner-very-large]
    name: smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    container:
      image: eccr.ecmwf.int/public-ci-images/ubuntu24.04-base:latest
    steps:
      - name: Report runner facts
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::identity"
          hostname
          id
          echo "::endgroup::"
          echo "::group::sizing"
          echo "nproc: $(nproc)"
          free -h 2>/dev/null || grep -E 'Mem|Swap' /proc/meminfo || true
          uname -a
          echo "::endgroup::"

      - name: Verify baked toolchain
        shell: bash
        run: |
          set -euo pipefail
          : "${CI_INFRASTRUCTURE_PYTHON:?the base image should set CI_INFRASTRUCTURE_PYTHON}"
          "$CI_INFRASTRUCTURE_PYTHON" -c 'import ci_infrastructure; print("ok")'
          # Reaches the image through a --build-arg that build-image.sh only
          # passes to Dockerfiles declaring `ARG SOURCE_REVISION`. If that wiring
          # ever breaks, the ENV is silently EMPTY rather than absent -- the image
          # still works, but ensure-infrastructure-present loses the commit from
          # its mismatch message and the provenance trail goes cold. Assert it.
          : "${CI_INFRASTRUCTURE_BAKED_REF:?the base image should record which commit it baked}"
          echo "baked ci-infrastructure: $CI_INFRASTRUCTURE_BAKED_REF"

          # Self-description, reaching the image through the same --build-arg
          # wiring and failing the same silent-empty way. actions/announce-image
          # prints these, and prints NOTHING when CI_IMAGE_NAME is empty, so
          # without this assertion a broken wiring looks like a quiet job.
          : "${CI_IMAGE_NAME:?the image should record its own name}"
          : "${CI_IMAGE_TAG:?the image should record its own tag}"
          : "${CI_IMAGE_CREATED:?the image should record when it was built}"
          : "${CI_IMAGE_DOCKERFILE_URL:?the image should record a link to its Dockerfile}"
          [ "$CI_IMAGE_NAME" = ubuntu24.04/base ] || {
            echo "::error::image reports itself as '$CI_IMAGE_NAME', expected ubuntu24.04/base"; exit 1; }
          echo "image: $CI_IMAGE_NAME:$CI_IMAGE_TAG built $CI_IMAGE_CREATED"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Retrieve secret from Vault
        uses: hashicorp/vault-action@v3.4.0
        with:
          method: jwt    # authentication endpoint configured by computing dept.
          path: jwt_github
          role: github-ecmwf-ci-infrastructure
          url: https://secrets.ecmwf.int
          secrets: |
            kvstore/data/fsst-pet/k8s-magnum-cci1-gh-runners-prod/gh-runners-artifact-bucket ARTIFACT_S3_ENDPOINT | ARTIFACT_S3_ENDPOINT;
            kvstore/data/fsst-pet/k8s-magnum-cci1-gh-runners-prod/gh-runners-artifact-bucket ARTIFACT_S3_REGION | ARTIFACT_S3_REGION;
            kvstore/data/fsst-pet/k8s-magnum-cci1-gh-runners-prod/gh-runners-artifact-bucket ARTIFACT_S3_BUCKET | ARTIFACT_S3_BUCKET;
            kvstore/data/fsst-pet/k8s-magnum-cci1-gh-runners-prod/gh-runners-artifact-bucket SCCACHE_BUCKET | SCCACHE_BUCKET;
            kvstore/data/fsst-pet/k8s-magnum-cci1-gh-runners-prod/gh-runners-artifact-bucket AWS_ACCESS_KEY_ID | AWS_ACCESS_KEY_ID;
            kvstore/data/fsst-pet/k8s-magnum-cci1-gh-runners-prod/gh-runners-artifact-bucket AWS_SECRET_ACCESS_KEY | AWS_SECRET_ACCESS_KEY;


      - name: Probe object store access
        shell: bash
        # The vault-action step above exports the names s3_store itself reads, so
        # the probe needs no env block and the same command works by hand.
        run: |
          set -euo pipefail
          "$CI_INFRASTRUCTURE_PYTHON" scripts/probe_object_store.py

  # A separate job because `container:` is per-job: the compile needs the
  # toolchain image, while the probe above deliberately runs on the plain base
  # image. Same scale-set matrix, so an sccache problem is attributed to the
  # scale set it appears on.
  sccache:
    strategy:
      fail-fast: false
      matrix:
        runner: [arc-runner-normal, arc-runner-large, arc-runner-very-large]
    name: sccache (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    container:
      image: eccr.ecmwf.int/public-ci-images/ubuntu24.04-clang18-gfortran13:latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify baked toolchain
        shell: bash
        run: |
          set -euo pipefail
          : "${CI_INFRASTRUCTURE_PYTHON:?the toolchain image should set CI_INFRASTRUCTURE_PYTHON}"
          "$CI_INFRASTRUCTURE_PYTHON" -c 'import ci_infrastructure; print("ok")'
          # Named explicitly rather than discovered: this image exists to carry
          # this compiler, and its absence is a finding about the image.
          command -v clang++-18 >/dev/null || { echo "::error::clang++-18 missing from the toolchain image"; exit 1; }
          command -v cmake >/dev/null || { echo "::error::cmake missing from the toolchain image"; exit 1; }

          # This job runs a VARIANT, which is what makes the check below worth
          # having: ENV is inherited, so if the CI_IMAGE_* block is ever added to
          # a base only, every variant silently announces itself as that base.
          # This is the assertion that catches it.
          : "${CI_INFRASTRUCTURE_BAKED_REF:?the toolchain image should record which commit it baked}"
          : "${CI_IMAGE_NAME:?the image should record its own name}"
          [ "$CI_IMAGE_NAME" = ubuntu24.04/clang18-gfortran13 ] || {
            echo "::error::variant reports itself as '$CI_IMAGE_NAME' — CI_IMAGE_* inherited from its base?"; exit 1; }
          echo "image: $CI_IMAGE_NAME:$CI_IMAGE_TAG built $CI_IMAGE_CREATED"

      # Configures sccache the way downstream builds are told to, so this job
      # exercises the action itself -- which until now had no caller anywhere
      # and was therefore entirely unverified.
      - uses: ./actions/setup-sccache
        with:
          cache-key-suffix: smoke-${{ matrix.runner }}
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          ARTIFACT_S3_ENDPOINT: ${{ secrets.ARTIFACT_S3_ENDPOINT }}
          ARTIFACT_S3_REGION: ${{ secrets.ARTIFACT_S3_REGION }}
          ARTIFACT_S3_USE_SSL: ${{ secrets.ARTIFACT_S3_USE_SSL }}

      - name: Prove sccache is served by the object store
        shell: bash
        env:
          # boto3's half of the probe: it lists the bucket independently of
          # sccache, over a different TLS trust path, to confirm which bucket
          # the objects actually landed in.
          ARTIFACT_S3_ENDPOINT: ${{ secrets.ARTIFACT_S3_ENDPOINT }}
          ARTIFACT_S3_REGION: ${{ secrets.ARTIFACT_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CXX: clang++-18
          # The daemon downgrades a failed read to a plain cache miss with only
          # a warning, so without this log a broken bucket looks like a cold one.
          SCCACHE_ERROR_LOG: ${{ runner.temp }}/sccache-server.log
          # info, not debug: sccache logs the bucket and endpoint at debug.
          SCCACHE_LOG: info
        run: |
          set -euo pipefail
          # --use-ambient-config: take the SCCACHE_* variables exactly as
          # setup-sccache left them, so the action's own output is what is under
          # test. Run without that flag to have the script derive them itself,
          # which is what makes a local run a single command.
          "$CI_INFRASTRUCTURE_PYTHON" scripts/probe_sccache.py --use-ambient-config

      - name: sccache daemon log
        if: failure()
        shell: bash
        run: cat "${{ runner.temp }}/sccache-server.log" || true

  # Per-image contract checks, one leg per toolchain image. Both failures that
  # reached a downstream repo's CI -- rocky8 shipping gcc-toolset-13 under the
  # unversioned name `g++`, and debian11's CMake below the floor our submodules
  # require -- were image defects that nothing here would have caught.
  image-contract:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu24.04-gfortran13-boost-qt6
            declares: ubuntu24.04/gfortran13-boost-qt6
            cxx: g++-13
            cxx-major: '13'
          - image: ubuntu24.04-clang18-gfortran13
            declares: ubuntu24.04/clang18-gfortran13
            cxx: clang++-18
            cxx-major: '18'
          - image: rocky8-gfortran13-boost-qt5
            declares: rocky8/gfortran13-boost-qt5
            cxx: g++-13
            cxx-major: '13'
          - image: debian11-gfortran10-boost-qt5
            declares: debian11/gfortran10-boost-qt5
            cxx: g++-10
            cxx-major: '10'
    name: image (${{ matrix.image }})
    runs-on: arc-runner-normal
    container:
      image: eccr.ecmwf.int/public-ci-images/${{ matrix.image }}:latest
    steps:
      # First step of the job, so the images' BASH_ENV announcer fires on the way
      # into this script -- the marker it leaves is the assertion below.
      - name: Verify the image contract
        shell: bash
        env:
          CXX_BINARY: ${{ matrix.cxx }}
          CXX_MAJOR: ${{ matrix.cxx-major }}
          DECLARES: ${{ matrix.declares }}
          # The floor libaec sets, which is the highest of any submodule we build.
          MIN_CMAKE: '3.26'
        run: |
          set -euo pipefail

          # The compiler a manifest names must exist under exactly that name and
          # be the version the image name promises.
          command -v "$CXX_BINARY" >/dev/null || {
            echo "::error::$CXX_BINARY is not on PATH in $DECLARES"; exit 1; }
          major="$("$CXX_BINARY" -dumpversion | cut -d. -f1)"
          [ "$major" = "$CXX_MAJOR" ] || {
            echo "::error::$CXX_BINARY reports major $major, expected $CXX_MAJOR"; exit 1; }
          echo "compiler: $(command -v "$CXX_BINARY") -> $("$CXX_BINARY" --version | head -1)"

          have="$(cmake --version | head -1 | awk '{print $3}')"
          [ "$(printf '%s\n%s\n' "$MIN_CMAKE" "$have" | sort -V | head -1)" = "$MIN_CMAKE" ] || {
            echo "::error::cmake $have is below the $MIN_CMAKE floor in $DECLARES"; exit 1; }
          echo "cmake: $have"

          # ENV is inherited, so a variant that failed to re-declare CI_IMAGE_*
          # would silently answer with its base's name and Dockerfile URL.
          : "${CI_IMAGE_NAME:?the image should record its own name}"
          [ "$CI_IMAGE_NAME" = "$DECLARES" ] || {
            echo "::error::image reports itself as '$CI_IMAGE_NAME', expected $DECLARES"; exit 1; }

          # announce-image.sh ran when bash sourced BASH_ENV entering this script.
          # Without this, a broken COPY or ENV looks like a quiet job.
          : "${BASH_ENV:?the image should point BASH_ENV at its announcer}"
          [ -r "$BASH_ENV" ] || { echo "::error::BASH_ENV=$BASH_ENV is not readable"; exit 1; }
          [ -e "${CI_IMAGE_ANNOUNCED_MARKER:-/tmp/.ci-image-announced}" ] || {
            echo "::error::$BASH_ENV did not announce on the first bash step"; exit 1; }
