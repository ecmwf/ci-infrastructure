name: Contributor Declaration

# Callers own the triggers -- a reusable workflow cannot declare its own. Copy
# the snippet from this repo's README verbatim; in particular the caller MUST
# listen for `edited`, because a description can be emptied with no push at all,
# and `synchronize`, because required status checks are per-SHA.
on:
  workflow_call:
    inputs:
      runs-on:
        description: >
          Runner label. Defaults to ubuntu-latest rather than this org's cheap
          ARC label ubuntu-slim: public consumers may have no ARC access, and
          the slim image is not guaranteed to carry a usable python3 (the
          pre-commit workflow next door installs one via setup-python).
        type: string
        required: false
        default: ubuntu-latest
      exempt-authors:
        description: 'Comma-separated bot logins to skip; empty means the built-in list.'
        type: string
        required: false
        default: ''

# Nothing is needed: the description comes from the event payload, and the
# consumer repo is never checked out. Declared explicitly rather than omitted so
# the job cannot inherit a broad caller token.
permissions: {}

jobs:
  # FROZEN NAME. Every ECMWF repo pins this workflow at @main, so this job id is
  # the required-status-check context in all of them at once. Renaming it breaks
  # every consumer simultaneously; tests/test_check_pr_declaration.py asserts the
  # literal string so the breakage cannot happen by accident.
  contributor-declaration:
    runs-on: ${{ inputs.runs-on }}
    steps:
      # @main, not ./actions/... : inside a reusable workflow a relative `uses`
      # resolves against the CALLER's workspace, so the local form would look for
      # this action in the consumer repo.
      - uses: ecmwf/ci-infrastructure/actions/check-pr-declaration@main
        with:
          exempt-authors: ${{ inputs.exempt-authors }}
