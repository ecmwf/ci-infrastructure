name: Contributor Declaration

# Callers own the triggers -- a reusable workflow cannot declare its own. Copy
# the snippet from this repo's README verbatim; in particular the caller MUST
# listen for `edited`, because a description can be emptied with no push at all,
# and `synchronize`, because required checks are per-SHA.
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        type: string
        required: false
        default: ubuntu-latest
      declaration-file:
        description: >
          Path in the consumer repo of a file holding the declaration to
          require; empty uses the text vendored in ci-infrastructure. Setting
          this adds an actions/checkout step.
        type: string
        required: false
        default: ''
      pr-number:
        # A string, not a number: a number input has no value that means "unset".
        description: 'Pull request to check; empty takes it from the event payload.'
        type: string
        required: false
        default: ''
      body-source:
        description: '"event" (default, needs no permissions) or "api" (needs pull-requests:read).'
        type: string
        required: false
        default: ''
      exempt-authors:
        description: 'Comma-separated bot logins to skip; empty means the built-in list.'
        type: string
        required: false
        default: ''

# body-source: api also needs the caller to grant pull-requests: read.
permissions:
  contents: read

jobs:
  # FROZEN NAME: it is the required-check context in every ECMWF repo
  # (asserted by tests/test_check_pr_declaration.py).
  contributor-declaration:
    runs-on: ${{ inputs.runs-on }}
    steps:
      # Only for a repo-local declaration-file; checks out the BASE branch.
      - if: inputs.declaration-file != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # @main: a relative `uses` in a reusable workflow resolves in the caller's repo.
      - uses: ecmwf/ci-infrastructure/actions/check-pr-declaration@main
        with:
          pr-number: ${{ inputs.pr-number }}
          declaration-file: ${{ inputs.declaration-file }}
          body-source: ${{ inputs.body-source }}
          exempt-authors: ${{ inputs.exempt-authors }}
