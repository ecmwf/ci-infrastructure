# Placeholder integration-test lane, mimicking anemoi-core's expensive HPC
# tests. Run only through ci-gated.yml, which owns the triggers, the ci-approval
# gate and the 'run-expensive-tests' opt-in; never add pull request triggers
# here. The `github` context is the caller's, so the pull request under test is
# still available as github.event.pull_request.

name: Try integration-test gating

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-env:
    runs-on: ubuntu-slim
    steps:
      - name: Placeholder for building the environment on HPC
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "would check out ${HEAD_SHA:-the default branch} and build the environment"

  test:
    needs: build-env
    runs-on: ubuntu-slim
    steps:
      - run: echo "would run the expensive integration tests"

  cleanup-env:
    needs: [build-env, test]
    # Always clean up once an environment was built, whether the tests passed or
    # failed -- but not when build-env never ran.
    if: ${{ always() && needs.build-env.result != 'skipped' }}
    runs-on: ubuntu-slim
    steps:
      - run: echo "would remove the environment from HPC"
