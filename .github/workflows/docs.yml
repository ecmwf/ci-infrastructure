name: Docs

# Separate from ci.yml: the build imports the package, i.e. runs PR code, so it
# stays on a GitHub-hosted runner with no secrets whatever trigger ci.yml moves to.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -e ".[docs]"
      - name: Build
        run: sphinx-build -W --keep-going -n -b html docs docs/_build/html
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-html
          path: docs/_build/html

  preview-publish:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build
    permissions:
      contents: read
      pull-requests: write  # the preview link goes into the PR description
    uses: ecmwf/reusable-workflows/.github/workflows/pr-preview-publish.yml@pr-preview-print-link
    with:
      artifact-id: ${{ needs.build.outputs.artifact-id }}
      space: docs
      name: dev-section
      path: ci-infrastructure/pull-requests
      link-text: Documentation preview
    secrets:
      sites-token: ${{ secrets.ECMWF_SITES_DOCS_DEV_SECTION_TOKEN }}

  preview-unpublish:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    uses: ecmwf/reusable-workflows/.github/workflows/pr-preview-unpublish.yml@main
    with:
      space: docs
      name: dev-section
      path: ci-infrastructure/pull-requests
    secrets:
      sites-token: ${{ secrets.ECMWF_SITES_DOCS_DEV_SECTION_TOKEN }}

  publish:
    if: github.event_name == 'push'
    needs: build
    uses: ecmwf/reusable-workflows/.github/workflows/docs-publish.yml@main
    with:
      artifact-id: ${{ needs.build.outputs.artifact-id }}
      space: docs
      name: dev-section
      path: ci-infrastructure
      id: main
      softlink: latest
    secrets:
      sites-token: ${{ secrets.ECMWF_SITES_DOCS_DEV_SECTION_TOKEN }}
