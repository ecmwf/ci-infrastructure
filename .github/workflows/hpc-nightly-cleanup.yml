name: Nightly cleanup

# Age-based GC of vars.HPC_CI_REMOTE_WORK_DIR, over troika's ssh connection, and
# the oldest-written S3 objects down to half an assumed quota per bucket.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      older-than-days:
        description: HPC age threshold in days
        required: false
        default: '1'
      dryrun:
        description: List what would be removed without deleting
        required: false
        default: 'false'

concurrency:
  group: hpc-nightly-cleanup
  cancel-in-progress: false

jobs:
  hpc:
    runs-on: hpc-submit
    container:
      image: eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest
      credentials:
        username: ${{ secrets.ECCR_PULL_ROBOT_NAME }}
        password: ${{ secrets.ECCR_PULL_ROBOT_TOKEN }}
    steps:
      - uses: ecmwf/ci-infrastructure/actions/announce-image@main

      - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main

      - name: Garbage-collect the cluster work dir
        shell: bash
        env:
          REMOTE_WORK_DIR: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}
          TROIKA_USER: ${{ secrets.HPC_CI_SSH_USER }}
          OLDER_THAN_DAYS: ${{ github.event.inputs.older-than-days || '1' }}
          DRYRUN: ${{ github.event.inputs.dryrun || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "$REMOTE_WORK_DIR" ]; then
            echo "::error::HPC_CI_REMOTE_WORK_DIR is empty; nothing to sweep." >&2
            exit 1
          fi
          args=(
            --site hpc-batch
            --remote-work-dir "$REMOTE_WORK_DIR"
            --older-than-days "$OLDER_THAN_DAYS"
          )
          if [ -n "$TROIKA_USER" ]; then args+=(--troika-user "$TROIKA_USER"); fi
          if [ "$DRYRUN" = "true" ]; then args+=(--dryrun); fi
          "$CI_INFRASTRUCTURE_PYTHON" -I -u -m ci_infrastructure.hpc gc "${args[@]}"

  s3:
    strategy:
      fail-fast: false
      matrix:
        store:
          - {name: artifacts, quota-gb: 800, suffix: .tar.gz}
          - {name: sccache, quota-gb: 150, suffix: ''}
    name: s3 (${{ matrix.store.name }})
    runs-on: arc-runner-normal
    container:
      image: eccr.ecmwf.int/public-ci-images/ubuntu24.04-base:latest
    steps:
      - uses: ecmwf/ci-infrastructure/actions/announce-image@main

      - uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main

      - name: Delete the oldest-written ${{ matrix.store.name }} objects
        shell: bash
        env:
          ARTIFACT_S3_ENDPOINT: ${{ secrets.ARTIFACT_S3_ENDPOINT }}
          ARTIFACT_S3_REGION: ${{ secrets.ARTIFACT_S3_REGION }}
          # gc reads its bucket from ARTIFACT_S3_BUCKET, for sccache too.
          ARTIFACT_S3_BUCKET: ${{ matrix.store.name == 'sccache' && secrets.SCCACHE_BUCKET || secrets.ARTIFACT_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          QUOTA_GB: ${{ matrix.store.quota-gb }}
          SUFFIX: ${{ matrix.store.suffix }}
          DRYRUN: ${{ github.event.inputs.dryrun || 'false' }}
        run: |
          set -euo pipefail
          args=(--percent 50 --quota-gb "$QUOTA_GB" --suffix "$SUFFIX")
          if [ "$DRYRUN" = "true" ]; then args+=(--dryrun); fi
          "$CI_INFRASTRUCTURE_PYTHON" -I -u -m ci_infrastructure.s3_store gc "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
