name: Contributor Declaration (dogfood)

# pull_request, not pull_request_target: the PR's own checker is under test.
# Consumers use pull_request_target so a PR cannot stub out its own gate.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  # Also the only coverage of a local `uses: ./actions/...` (no /_actions/ path).
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./actions/check-pr-declaration

      # Must agree with the vendored constant: a network-free drift check.
      - uses: ./actions/check-pr-declaration
        with:
          declaration-file: .github/PULL_REQUEST_TEMPLATE.md

  # Calls the action @main internally: verifies the wiring, not this PR's action.
  reusable-workflow:
    uses: ./.github/workflows/check-pr-declaration.yml
    with:
      runs-on: ubuntu-latest
