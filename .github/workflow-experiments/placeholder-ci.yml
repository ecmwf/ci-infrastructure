# Placeholder unit-test lane. Run only through ci-gated.yml, which owns the
# triggers and the ci-approval gate; never add pull request triggers here.
# The `github` context is the caller's, so the pull request under test is still
# available as github.event.pull_request.

name: Placeholder CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-slim
    steps:
      - name: Placeholder for the unit tests
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHON: ${{ matrix.python-version }}
        run: |
          echo "event=$EVENT: would check out ${HEAD_SHA:-the default branch} and run the unit tests on Python $PYTHON"
