repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Lints workflow YAML; custom runner labels in .github/actionlint.yaml.
  # zizmor: see TODOs.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: check-ci-approval
        name: require the ci-approval gate on workflows that can run fork code
        entry: python src/ci_infrastructure/check_ci_approval.py
        language: python
        additional_dependencies: ["PyYAML>=6"]
        files: ^\.github/workflows/.*\.ya?ml$

  # shellcheck-py (a pip wheel): the pre-commit runner has no docker.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
