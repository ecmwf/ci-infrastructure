repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Workflow YAML is otherwise unlinted here, and this repo's whole product is
  # workflow YAML. Custom self-hosted runner labels are declared in
  # .github/actionlint.yaml. (zizmor belongs next to this -- it is what caught the
  # template-injection findings a48f078 fixed -- but it reports 78 pre-existing
  # findings today, so adopting it needs its own pass. See TODOs.)
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: check-ci-approval
        name: require the ci-approval gate on workflows that can run fork code
        entry: python src/ci_infrastructure/check_ci_approval.py
        language: python
        additional_dependencies: ["PyYAML>=6"]
        files: ^\.github/workflows/.*\.ya?ml$

  # For the shell that remains: public-images/verify-image.sh, which runs inside
  # the images, and the build-image.sh entry point.
  # shellcheck-py, not koalaman/shellcheck-precommit: that one runs shellcheck in
  # a container, and the pre-commit job runs on ubuntu-slim, which is
  # unprivileged and has no docker. This one is a plain pip wheel.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
