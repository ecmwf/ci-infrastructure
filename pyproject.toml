[project]
name = "ci-infrastructure"
version = "0.1.0"
description = "Shared CI orchestration scripts and actions"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.1",
    "pydantic>=2",
    "PyYAML>=6",
    "boto3>=1.34",
    "jinja2>=3.1",
    "troika @ git+https://github.com/ecmwf/troika.git",
]


[project.scripts]
ci-infrastructure-generate = "ci_infrastructure.generate_downstream_ci:main"
ci-infrastructure-resolve = "ci_infrastructure.resolve_deps:main"
ci-infrastructure-fetch = "ci_infrastructure.fetch_deps:main"
ci-infrastructure-check = "ci_infrastructure.check_artifact:main"
ci-infrastructure-print-dep-table = "ci_infrastructure.print_dep_table:main"
ci-infrastructure-s3 = "ci_infrastructure.s3_store:main"
ci-infrastructure-check-ci-approval = "ci_infrastructure.check_ci_approval:main"
ci-infrastructure-hpc = "ci_infrastructure.hpc.orchestrate:main"
# For local debugging only. actions/check-pr-declaration deliberately does NOT
# use this entry point: it runs the module with `-m` and a PYTHONPATH, installing
# nothing, because the checker is stdlib-only by design.
ci-infrastructure-check-declaration = "ci_infrastructure.check_pr_declaration:main"

[project.optional-dependencies]
test = ["pytest>=7", "mypy", "boto3-stubs[s3]", "types-PyYAML"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ci_infrastructure.hpc" = ["troika-config.yml"]
"ci_infrastructure" = ["certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# check_pr_declaration.py has a LOWER Python floor than the rest of the package.
# Everything else runs in the venv ensure-infrastructure-present builds, so
# requires-python applies; this module is run as `python3 -m ...` with a
# PYTHONPATH and nothing installed, on whatever interpreter the consumer's runner
# happens to ship. So no 3.11-only idiom may appear here:
#   UP042 - would make Verdict a StrEnum (3.11+).
# E501: the CLA bullet is 149 characters and has to stay verbatim in the source
# for auditability; composing it from a shorter URL constant would make a legal
# declaration assembled rather than literal.
"src/ci_infrastructure/check_pr_declaration.py" = ["E501", "UP042"]

[tool.mypy]
strict = true

# # troika ships no type information yet (a py.typed release is in progress)
[[tool.mypy.overrides]]
module = "troika.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ci_infrastructure.hpc.site"
disallow_untyped_calls = false
