[project]
name = "ci-infrastructure"
version = "0.1.0"
description = "Shared CI orchestration scripts and actions"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "pydantic>=2",
    "PyYAML>=6",
    "boto3>=1.34",
    "tomli>=2.0; python_version < '3.11'",
    "troika @ git+https://github.com/ecmwf/troika.git@843684cd5c759c55477bf62632da0318fa984327",
]


[project.scripts]
ci-infrastructure-generate = "ci_infrastructure.generate_downstream_ci:main"
ci-infrastructure-resolve = "ci_infrastructure.resolve_deps:main"
ci-infrastructure-fetch = "ci_infrastructure.fetch_deps:main"
ci-infrastructure-check = "ci_infrastructure.check_artifact:main"
ci-infrastructure-print-dep-table = "ci_infrastructure.print_dep_table:main"
ci-infrastructure-s3 = "ci_infrastructure.s3_store:main"
ci-infrastructure-hpc = "ci_infrastructure.hpc.orchestrate:main"

[project.optional-dependencies]
test = ["pytest>=7", "mypy", "boto3-stubs[s3]", "types-PyYAML"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ci_infrastructure.hpc" = ["troika-config.yml"]
"ci_infrastructure" = ["certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true

# troika ships no type information yet (a py.typed release is in progress), so
# its imports would otherwise trip strict mode's missing-imports check.
[[tool.mypy.overrides]]
module = "troika.*"
ignore_missing_imports = true

# site.py is the only module that calls troika's (currently untyped) config
# loaders. Whether mypy flags those as untyped calls depends on which troika it
# resolves — an editable/source checkout vs the pip-installed package without
# py.typed — so relax that one check here rather than carry an inline ignore that
# is "unused" in whichever environment sees troika as Any. This becomes a no-op
# (and should be removed) once the pinned troika dependency ships py.typed.
[[tool.mypy.overrides]]
module = "ci_infrastructure.hpc.site"
disallow_untyped_calls = false
