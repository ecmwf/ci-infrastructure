[project]
name = "ci-infrastructure"
version = "0.1.0"
description = "Shared CI orchestration scripts and actions"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Minimal: the check-ci-approval pre-commit hook installs only this.
# The actions install `[all]`.
dependencies = [
    "click>=8.1",
    "PyYAML>=6",
]

[project.scripts]
ci-infrastructure-generate = "ci_infrastructure.generate_downstream_ci:main"
ci-infrastructure-resolve = "ci_infrastructure.resolve_deps:main"
ci-infrastructure-fetch = "ci_infrastructure.fetch_deps:main"
ci-infrastructure-check = "ci_infrastructure.check_artifact:main"
ci-infrastructure-print-dep-table = "ci_infrastructure.print_dep_table:main"
ci-infrastructure-s3 = "ci_infrastructure.s3_store:main"
ci-infrastructure-check-ci-approval = "ci_infrastructure.check_ci_approval:main"
ci-infrastructure-hpc = "ci_infrastructure.hpc.orchestrate:main"
# Local debugging only: actions/check-pr-declaration runs the stdlib-only module with -m.
ci-infrastructure-check-declaration = "ci_infrastructure.check_pr_declaration:main"

[project.optional-dependencies]
# One extra per heavy dependency; the module that needs it is noted beside it.
s3 = ["boto3>=1.34"]                                              # s3_store
schema = ["pydantic>=2"]                                          # manifest
hpc = ["jinja2>=3.1", "troika @ git+https://github.com/ecmwf/troika.git"]  # hpc/{jobscript,site}
all = ["ci-infrastructure[s3,schema,hpc]"]
test = ["ci-infrastructure[all]", "pytest>=7", "mypy", "boto3-stubs[s3]", "types-PyYAML"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ci_infrastructure.hpc" = ["troika-config.yml", "templates/*.j2"]
"ci_infrastructure" = ["certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# check_pr_declaration.py runs on the consumer's python3, below requires-python:
#   UP042 - would make Verdict a StrEnum (3.11+).
# E501: the CLA bullet (149 chars) stays verbatim for auditability.
"src/ci_infrastructure/check_pr_declaration.py" = ["E501", "UP042"]

[tool.mypy]
strict = true

# troika ships no type information
[[tool.mypy.overrides]]
module = "troika.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ci_infrastructure.hpc.site"
disallow_untyped_calls = false
